  voyage(si, L) {

  pliny(si, L) {

    const t1 = pS(si, 1);
    const sp = pill(g, 540, 1130, L.ship, { size: 62, fill: '#3B2A12', stroke: '#E9C46A', color: '#FFE9A8' }); pop(sp, t1 + .1, { gain: .7 });
    const er = pill(g, 540, 470, L.era, { size: 42, fill: C.card, stroke: C.accent }); pop(er, lastW(si) - .2, { gain: .5 }); sfx('chime', lastW(si) - .2, .7);

  numbers(si, L) {
    const T0 = sStart(si), T1 = sEnd(si), g = el('g', {}, $('mid'));
    tl.set(SHIP, { u: 1, cargo: 1 }, T0 - .02);
    tl.set(CAM, { tx: 3.0, ty: 1.6, tz: -5.4, dist: 7.6, yaw: -30, pitch: 20 }, T0 - .02);
    camTo(T0, { yaw: -12, dist: 7.0 }, T1 - T0, 'sine.inOut');
    sfx('whoosh', T0 - .05, .6);
    const tg = el('g', {}, g), tt = text(tg, 540, 330, '0', 140, C.accent, 'middle', { filter: 'url(#glow)' });
    pill(tg, 540, 450, L.unit, { size: 46, fill: C.card, stroke: C.accent }); fadeIn(tg, T0, .2);
    const dd = Math.max(1, wT(si, wIdx(si, 0, 3)) - T0), o = { v: 0 };
    tl.to(o, { v: L.total, duration: dd, ease: 'power2.out', onUpdate: () => tt.textContent = Math.round(o.v) + L.suffix }, T0 + .1);
    for (let k = 0; k < 14; k++) sfx('tick', T0 + .1 + dd * (1 - Math.sqrt(1 - k / 14)), .5);
    const t1 = pS(si, 1), bar = el('g', {}, g);
    el('rect', { x: 110, y: 540, width: 860, height: 54, rx: 27, fill: '#232A55' }, bar);
    const pr = el('rect', { x: 110, y: 540, width: 0, height: 54, rx: 27, fill: '#101010', stroke: '#fff', 'stroke-width': 3 }, bar);
    const bw = { w: 0 }; tl.to(bw, { w: 860 * 2 / 3, duration: .9, ease: 'power3.out', onUpdate: () => pr.setAttribute('width', bw.w) }, t1 + .2);
    pill(bar, 330, 650, L.pepper, { size: 42, fill: '#101010', stroke: '#fff' }); pill(bar, 800, 650, L.other, { size: 38, fill: C.card, stroke: C.accent });
    fadeIn(bar, t1, .25);
    const tw = pill(g, 540, 1140, L.twoThirds, { size: 60, fill: 'url(#goldG)', stroke: '#FFF3C4', color: C.ink });
    pop(tw, wT(si, wIdx(si, 1, 1)), { from: 2, ease: 'power4.out', d: .3, sound: 'thud' }); hit(wT(si, wIdx(si, 1, 1))); sfx('chime', lastW(si), .7);

  pattanam(si, L) {
    const T0 = sStart(si), T1 = sEnd(si), g = el('g', {}, $('mid'));
    place(digger, T0 - .02, { x: 2.25, z: 1.25, ry: 58, lean: 22, smile: .8, look: 0 });
    tl.set(DIGGING, { on: 1 }, T0 - .02); tl.set(DIGGING, { on: 0 }, T1 - .02);
    tl.set(CAM, { tx: 2.6, ty: 1.05, tz: 1.5, dist: 6.6, yaw: 34, pitch: 15 }, T0 - .02);

    const pl = pill(g, 540, 360, L.place, { size: 56, fill: C.card, stroke: C.accent }); pop(pl, T0 + .2, { gain: .6 });
    const cw = wT(si, wIdx(si, 0, 5)), pw = wT(si, wIdx(si, 0, 7));
    tl.to(FIND, { coin: 1, duration: .5, ease: 'back.out(2)' }, snapT(cw)); sfx('coin', cw, .8);
    tl.to(FIND, { pot: 1, duration: .5, ease: 'back.out(2)' }, snapT(pw)); sfx('pop', pw, .8);
    const cl = anchor(V(2.75, 1.25, 1.7)); pill(cl, 0, 0, L.coin, { size: 40, fill: C.card, stroke: C.accent }); pop(cl, cw + .25, { gain: .5 });
    const ptl = anchor(V(3.2, .95, 1.75)); pill(ptl, 0, 0, L.pot, { size: 40, fill: C.card, stroke: '#FF9A62' }); pop(ptl, pw + .25, { gain: .5 });
    const t1 = pS(si, 1), gs = pill(g, 540, 520, L.guess, { size: 96, fill: 'url(#goldG)', stroke: '#FFF3C4', color: C.ink, sw: 7 });
    pop(gs, wT(si, wIdx(si, 1, 1)), { from: 2.2, ease: 'power4.out', d: .3, sound: 'thud' }); hit(wT(si, wIdx(si, 1, 1))); flash(wT(si, wIdx(si, 1, 1)), .35); sfx('chime', lastW(si) - .1, .8);

    tl.set(CAM, { tx: .3, ty: 1.2, tz: .9, dist: 7.5, yaw: -10, pitch: 9 }, T0 - .02);

};
const DIGGING = { on: 0 };
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 28, scale: .82 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .22, ease: 'back.out(2.5)' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#FFFFFF' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, y: -18, duration: .1 }, tOut); tl.set(page, { y: 0 }, tOut + .15);
  });
});

// ---------------------------------------------------------------- time-only render
const tmp = new THREE.Vector3();
function render(t) {
  W.update(t); SEA.update(t); fire.update(t); ship.update(t);
  // ship on its route
  const u = Math.max(0, Math.min(1, SHIP.u)), sp = route.getPointAt(u), st = route.getTangentAt(u);
  ship.g.position.set(sp.x, 0, sp.z); ship.g.rotation.y = Math.atan2(-st.z, st.x);
  cargo.visible = SHIP.cargo > .5;
  // papyrus unroll
  papyrus.visible = PAP.vis > .5; papSheet.scale.x = Math.max(.02, PAP.open); rollL.position.x = -.9 * PAP.open - .04; rollR.position.x = .9 * PAP.open + .04;
  papyrus.position.y = 1.9 + .03 * Math.sin(t * 1.3);
  // dig finds rise out of the pit
  findCoin.position.set(-.1, -.1 + .75 * FIND.coin, 0); findCoin.rotation.z = t * 3; findCoin.visible = FIND.coin > .01;
  findPot.position.set(.25, -.4 + .45 * FIND.pot, .05); findPot.visible = FIND.pot > .01;
  // digging motion
  if (DIGGING.on > .5) { const s = Math.sin(t * 5.5); digger.S.armL = [70 + 25 * s, 40, 20]; digger.S.armR = [70 + 25 * s, 40, 20]; digger.S.lean = 20 + 10 * s; shovel.rotation.x = .3 + .5 * s; }
  scroll.visible = pliny.S.x < 30;
  // coin flocks
  rainCoins.update(t, (i, tt, p, r) => { if (!FX.rain) return 0; const u = (tt * .55 + i / 50) % 1; p.set(-1.6 + (i * .37) % 3.4, 4.2 - u * 4.15, -.2 + (i * .29) % 2.2); r.set(tt * 5 + i, tt * 3, 0); return 1; });
  deckCoins.update(t, (i, tt, p, r) => { if (!FX.deck) return 0; const a = Math.max(0, Math.min(1, (tt - FX.deckT - i * .04) / .6)); if (tt < FX.deckT + i * .04 || a >= 1) return 0; p.set(sp.x + Math.cos(i * 2.4) * .7, 5 - 4.4 * a * a, sp.z + Math.sin(i * 3.7) * .4); r.set(tt * 8 + i, 0, tt * 5); return 1; });
  streamCoins.update(t, (i, tt, p, r) => { if (!FX.stream) return 0; const u = (tt * .4 + i / 44) % 1; p.set(-.6 + u * 4.5, 1.6 + Math.sin(u * Math.PI) * 1.4 + Math.sin(i) * .2, .6 - u * 3 + Math.cos(i * 2) * .2); r.set(tt * 6 + i, tt * 4, 0); return 1; });
  riseCoins.update(t, (i, tt, p, r) => { if (!FX.rise) return 0; const u = (tt * .25 + i / 40) % 1, a = i * 2.4 + tt; p.set(-2.3 + Math.cos(a) * (.4 + u), .4 + u * 6, -1 + Math.sin(a) * (.4 + u)); r.set(tt * 4 + i, tt * 2, 0); return 1 - u * .6; });
  vineGlow.scale.setScalar(2.2 + .25 * Math.sin(t * 3));
  stack.visible = sacks.visible = PROPS.value > .5;
  PEOPLE.forEach(p => p.update(t, p.speakFn ? p.speakFn(t) : 0));
  // camera (optionally following the ship)
  const f = CAM.follow;
  LP.orbit(R.camera, { tx: CAM.tx + (sp.x - CAM.tx) * f, ty: CAM.ty, tz: CAM.tz + (sp.z - CAM.tz) * f, dist: CAM.dist, yaw: CAM.yaw, pitch: CAM.pitch, fov: CAM.fov });
  R.render();
  L3.forEach(l => { const s = LP.toScreen(R.camera, l.v); l.outer.setAttribute('transform', `translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})`); l.outer.style.display = s.behind ? 'none' : ''; });
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
