<!doctype html><html><head><meta charset="utf-8"><title>People Rig Preview</title>
<style>html,body{margin:0;background:#0A1033}</style></head><body>
<svg id="w" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#0A1033"/><stop offset=".55" stop-color="#2A1240"/><stop offset="1" stop-color="#0E4C6E"/></linearGradient>
<filter id="sh"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020414" flood-opacity=".5"/></filter></defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<g id="stage"></g></svg>
<script src="vendor/gsap.min.js"></script><script src="lib/people.js"></script>
<script>
const NS='http://www.w3.org/2000/svg', st=document.getElementById('stage');
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const lab=(x,y,s)=>{const t=mk('text',{x,y,'font-family':'FreeSans','font-size':34,'font-weight':700,fill:'#FFD166','text-anchor':'middle'},st);t.textContent=s};
[[560,'walk'],[1060,'sit → stand → give'],[1560,'run · talk']].forEach(([y])=>{mk('rect',{x:0,y,width:1080,height:6,fill:'#ffffff',opacity:.12},st)});
const A=Person(mk('g',{filter:'url(#sh)'},st),{hairStyle:'long',hair:'#5B3A1E',skin:'#E8B48F',top:'#3A86FF',topStyle:'tracksuit',stripe:'#fff',pants:'#1D3A8A',shoes:'#fff'});
const bench=mk('rect',{x:640,y:960,width:300,height:26,rx:8,fill:'#6E2433'},st); mk('rect',{x:660,y:986,width:20,height:74,fill:'#4A1622'},st); mk('rect',{x:900,y:986,width:20,height:74,fill:'#4A1622'},st);
const B=Person(mk('g',{filter:'url(#sh)'},st),{hairStyle:'side',hair:'#111',skin:'#D9A47A',top:'#E63946',topStyle:'tracksuit',stripe:'#FFD166',pants:'#9B1C2C',shoes:'#222'});
const A2=Person(mk('g',{filter:'url(#sh)'},st),{hairStyle:'long',hair:'#5B3A1E',skin:'#E8B48F',top:'#3A86FF',topStyle:'tracksuit',stripe:'#fff',pants:'#1D3A8A',shoes:'#fff'});
const C=Person(mk('g',{filter:'url(#sh)'},st),{hairStyle:'bun',hair:'#2B1B12',skin:'#8D5A3B',top:'#2DD4BF',topStyle:'tee',pants:'#22314F',shoes:'#FF6B6B'});
const D=Person(mk('g',{filter:'url(#sh)'},st),{hairStyle:'buzz',hair:'#6B6B6B',skin:'#F1C6A3',top:'#6B7280',topStyle:'jacket',pants:'#2B2F3A',shoes:'#3B2A1E',height:1.03});
lab(540,140,'WALK'); lab(540,640,'SIT → STAND → GIVE'); lab(270,1140,'RUN'); lab(800,1140,'TALK');
const gift=mk('g',{},st); mk('rect',{x:-40,y:-30,width:80,height:60,rx:6,fill:'#FFD166'},gift); mk('path',{d:'M-40 0H40M0 -30V30',stroke:'#E63946','stroke-width':8},gift);
Object.assign(A.S,{x:-150,y:560,walk:1,face:1,s:1.25}); Object.assign(B.S,{x:790,y:1060,sit:1,face:-1,s:1.25}); Object.assign(A2.S,{x:330,y:1060,face:1,smile:.4,s:1.25});
Object.assign(C.S,{x:270,y:1560,run:1,face:1,speed:1.1,s:1.25}); Object.assign(D.S,{x:800,y:1560,face:-1,talk:1,smile:.5,s:1.25});
const G={x:0,y:0,o:0};
const tl=gsap.timeline({paused:true}); tl.to({}, {duration:6},0);
tl.to(A.S,{x:1230,duration:6,ease:'none'},0);
tl.to(B.S,{sit:0,y:1060,duration:.6,ease:'back.out(1.4)'},1.2);
tl.to(B.S,{x:520,walk:1,duration:1.4,ease:'power1.inOut'},2.0); tl.to(B.S,{walk:0,duration:.3},3.1);
tl.set(B.S,{armN:[0,10]},3.3); tl.to(B.S.armN||{}, {},3.3);
const arm={a:0,e:10}; tl.to(arm,{a:80,e:0,duration:.5,ease:'back.out(2)'},3.4);
tl.to(A2.S,{smile:1,duration:.4},4.0); const arm2={a:0,e:10}; tl.to(arm2,{a:70,e:5,duration:.5,ease:'back.out(2)'},3.7);
tl.to(G,{o:1,duration:.2},3.5);
const gesture={a:10,e:40}; tl.to(gesture,{a:55,e:70,duration:.4,yoyo:true,repeat:7,ease:'sine.inOut'},.3);
window.seek=t=>{tl.seek(t,false);
  B.S.armN = t>=3.4?[arm.a,arm.e]:null; A2.S.armN = t>=3.7?[arm2.a,arm2.e]:null; D.S.armN=[gesture.a,gesture.e];
  const env=Math.max(0,Math.sin(t*17)*Math.sin(t*5.3+1)*1.3);
  [A,B,A2,C].forEach(p=>p.render(t,0)); D.render(t,env);
  gift.setAttribute('transform',`translate(${lerpX(t)} 840)`); gift.setAttribute('opacity',G.o);
};
function lerpX(t){return t<4.2?560:Math.max(430,560-(t-4.2)*260)}
window.DURATION=6; window.SFX=[]; window.CONFIG={music:{}}; seek(0); window.READY=true;
</script></body></html>
