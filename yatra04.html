  const span = Math.max(y1 - y0, (x1 - x0) / .5625) * 1000; const h = Math.max(1.4, span / .728 * pad);
  return camAt((x0 + x1) / 2, (y0 + y1) / 2 - .17 * h / 1000, h, tilt);
}

// one stop: preview dashed line, nav bar, drive (camera follows on short legs, frames the leg on long ones), arrive, place card
function stopScene(si, k, legs, tArrive, tEnd, chips = [], opt = {}) {

  else { v3(T0 - .05, { follow: 1 }); camTo(T0 - .05, { h: 1.2, tilt: 34 }, .9, 'power2.inOut'); }

const FOLLOW_N = .00009; // look-ahead to the north so the traveller sits low on screen, under the cards
function render(t) {

  M.render(t);
}
