<script type="module">
import { FloodDiorama } from './lib/flood3d.js';
(async function () {
const CFG = JSON.parse(document.getElementById('config').textContent);
const TIM = JSON.parse(document.getElementById('timings').textContent);
const C = CFG.palette, FONT = CFG.font;
const NS = 'http://www.w3.org/2000/svg';
const DUR = TIM.duration;
const SFX = [];
const $ = id => document.getElementById(id);
window.BEAT = TIM.beat || null;
const BEAT = window.BEAT;
const snapT = t => { if (!BEAT) return t; const g = 30 / BEAT.bpm; return Math.max(0, BEAT.t0 + Math.ceil((t - .08 - BEAT.t0) / g) * g); };
const FREE = new Set(['tick', 'wave', 'dip', 'shimmer', 'siren', 'type']);
const sfx = (type, t, gain = 1, extra = {}) => SFX.push(Object.assign({ type, t: +Math.max(0, FREE.has(type) ? t : snapT(t)).toFixed(3), gain }, extra));
const hit = t => sfx('hit', t, .8);

await document.fonts.load(`700 80px ${FONT}`, 'മലയാളം');
document.body.style.fontFamily = FONT;

function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function text(parent, x, y, str, size, fill, anchor = 'middle', extra = {}) { const t = el('text', Object.assign({ x, y, 'font-size': size, fill, 'text-anchor': anchor, 'font-family': FONT, 'dominant-baseline': 'central' }, extra), parent); t.textContent = str; return t; }

// ---------------------------------------------------------------- timing
const sentences = CFG.sentences.map((s, si) => { const ph = TIM.phrases.filter(p => p.sentence === si); return Object.assign({}, s, { ph, words: ph.flatMap(p => p.words) }); });
const sStart = si => sentences[si].ph[0].start;
const sEnd = si => si + 1 < sentences.length ? sStart(si + 1) : DUR;
const pS = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].start;
const pE = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].end;
const wT = (si, k) => { const w = sentences[si].words; return w[Math.max(0, Math.min(k, w.length - 1))].t; };
const wIdx = (si, j, k = 0) => sentences[si].ph.slice(0, j).reduce((a, p) => a + p.words.length, 0) + k;
const lastW = si => wT(si, sentences[si].words.length - 1);

const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DUR }, 0);
const hide = e => tl.set(e, { opacity: 0 }, 0);
const show = (e, t, d = .5) => { hide(e); tl.to(e, { opacity: 1, duration: d, ease: 'power1.out' }, t); };
const fadeOut = (e, t, d = .5) => tl.to(e, { opacity: 0, duration: d, ease: 'power1.in' }, t);
function stamp(e, t, o = {}) { t = snapT(t); tl.set(e, { opacity: 0, scale: 2.2, transformOrigin: o.origin || '50% 50%' }, 0); tl.to(e, { opacity: 1, scale: 1, duration: .28, ease: 'power4.out' }, t); sfx('thud', t + .2, .8); }
function counter(tEl, from, to, t, d, fmt, ticks = 14) { const o = { v: from }; tEl.textContent = fmt(from); tl.to(o, { v: to, duration: d, ease: 'power2.out', onUpdate: () => tEl.textContent = fmt(o.v) }, t); for (let k = 0; k < ticks; k++) sfx('tick', t + d * (1 - Math.sqrt(1 - k / ticks)), .5); }
const flash = (t, a = .35) => { tl.set($('flash'), { opacity: a }, t); tl.to($('flash'), { opacity: 0, duration: .5 }, t + .03); };
// typewriter line: reveals left to right with a key click per step
let clipN = 0;
function typeLine(parent, x, y, str, size, fill, t, d = .9, anchor = 'start') {
  const id = 'tw' + (clipN++), cp = el('clipPath', { id }, $('defs')); const r = el('rect', { x: anchor === 'middle' ? 0 : x - 4, y: y - size, width: 0, height: size * 2 }, cp);
  const g = el('g', { 'clip-path': `url(#${id})` }, parent); const tx = text(g, x, y, str, size, fill, anchor, { 'letter-spacing': 3 });
  const w = tx.getBBox().width + 12, x0 = anchor === 'middle' ? x - w / 2 : x - 4; r.setAttribute('x', x0);
  const o = { w: 0 }; tl.to(o, { w, duration: d, ease: 'steps(' + Math.max(6, str.length) + ')', onUpdate: () => r.setAttribute('width', o.w) }, t);
  for (let k = 0; k < Math.min(12, str.length); k++) sfx('type', t + k * d / Math.min(12, str.length), .5);
  return g;
}
// lower-third location card: thin orange line + typewriter text
function lowerThird(parent, line1, line2, t) {
  const g = el('g', {}, parent);
  const bar = el('rect', { x: 80, y: 300, width: 0, height: 5, fill: C.accent }, g);
  tl.to(bar, { attr: { width: 120 }, duration: .4, ease: 'power2.out' }, t);
  typeLine(g, 84, 352, line1, 46, '#F3EEE4', t + .2, .8);
  if (line2) typeLine(g, 84, 418, line2, 40, C.accent, t + .9, .5);
  return g;
}

// ---------------------------------------------------------------- camera (Ken Burns)
const CAM = { s: 1, x: 0, y: 0, r: 0 };
const CUTS = sentences.map((s, si) => sStart(si) - .05).concat([DUR]);
// a camera drift must finish before the next scene's camSet, or two tweens fight and the frame shakes
const camTo = (t, v, d, ease = 'sine.inOut') => { const nx = CUTS.find(c => c > t + .02) ?? DUR; const dd = Math.max(.05, Math.min(d, nx - .08 - t)); return tl.to(CAM, Object.assign({ duration: dd, ease }, v), t); };
const camSet = (t, v) => tl.set(CAM, v, t);
const scene = name => { const g = el('g', { id: 'sc_' + name }, $('cam')); hide(g); return g; };
const PPL = [];
function person(parent, opts, state) { const p = Person(parent, opts); Object.assign(p.S, { raise: 0 }, state); p.baseArm = state.armN || null; PPL.push(p); return p; }

// ================================================================= 3D DIORAMA + SCENES (1924 flood)
const F = new FloodDiorama($('gl')), ST = F.ST;
const v3 = (t, o) => tl.set(ST, o, Math.max(0, t));
const c3 = (t, cam) => tl.set(ST.cam, cam, Math.max(0, t));
const m3 = (t, cam, d, ease = 'sine.inOut') => { const nx = CUTS.find(c => c > t + .02) ?? DUR; const dd = Math.max(.05, Math.min(d, nx - .08 - t)); return tl.to(ST.cam, Object.assign({ duration: dd, ease }, cam), t); };
const go3 = (t, o, d, ease = 'power2.inOut') => tl.to(ST, Object.assign({ duration: d, ease }, o), t);
function pill(parent, cx, cy, str, size, fg = '#FFFFFF', bg = '#14181D', pad = 44) { const g = el('g', {}, parent), tx = text(g, cx, cy, str, size, fg, 'middle', { 'letter-spacing': 1 }); const w = tx.getBBox().width + pad * 2; g.insertBefore(el('rect', { x: cx - w / 2, y: cy - size * .95, width: w, height: size * 1.9, rx: size * .95, fill: bg, opacity: .9 }), tx); return g; }
function pop(e, t, d = .35) { tl.set(e, { opacity: 0, scale: .55, transformOrigin: '50% 50%' }, 0); tl.to(e, { opacity: 1, scale: 1, duration: d, ease: 'back.out(2.2)' }, Math.max(0, t)); sfx('pop', t, .5); }
function slam(e, t) { tl.set(e, { opacity: 0, scale: 2.6, transformOrigin: '50% 50%' }, 0); tl.to(e, { opacity: 1, scale: 1, duration: .26, ease: 'power4.out' }, Math.max(0, t)); sfx('thud', t + .18, .9); }
const overlay = si => { const g = el('g', {}, $('front')); tl.set(g, { opacity: 0 }, 0); tl.set(g, { opacity: 1 }, Math.max(0, sStart(si) - .05)); tl.set(g, { opacity: 0 }, sEnd(si) - .03); return g; };
const RC = F.railCurve, rp = u => RC.getPointAt(u), SC = F.slideC, RY = F.railY(SC.x), TP = F.topPos;
const HERO = { px: -170, py: 150, pz: -260, tx: 0, ty: -2, tz: 0, fov: 34 };

const scenes = {
  train(si, L) {
    c3(0, HERO); v3(0, { show: 0, trainOn: 1, trainU: .12, storm: 0, rain: 0, water: -2, slide: 0, railFade: 0, monoOn: 0, mist: 0, aperture: .00002 });
    m3(.05, { px: -115, py: 100, pz: -175, ty: 2, tz: 6 }, sEnd(si) - .1, 'sine.inOut');
    go3(0, { trainU: .3 }, sEnd(si), 'none');
    const o = overlay(si); const h = pill(o, 540, 420, L.hook, 70, '#FFFFFF', '#14181D', 46); slam(h, .04);
  },
  gone(si) {
    const T0 = sStart(si), p = rp(.42);
    v3(T0 - .05, { trainOn: 0 });
    c3(T0 - .05, { px: p.x + 34, py: p.y + 30, pz: p.z - 52, tx: p.x - 8, ty: p.y, tz: p.z, fov: 34 });
    m3(T0, { px: p.x + 26, py: p.y + 24, pz: p.z - 42 }, sEnd(si) - T0);
    go3(pS(si, 1), { railFade: 1.01 }, sEnd(si) - pS(si, 1) - .1, 'power1.in');
    for (let k = 0; k < 6; k++) sfx('tick', pS(si, 1) + k * .22, .4);
  },
  mono(si, L) {
    const T0 = sStart(si), x0 = -48, y0 = F.railY(x0), z0 = F.railZ(x0);
    v3(T0 - .05, { railFade: 1.01, monoOn: 1, trainOn: 0, aperture: .00006 });
    c3(T0 - .05, { px: x0 + 6, py: y0 + 16, pz: z0 - 5, tx: x0, ty: y0 + .5, tz: z0, fov: 34 });
    m3(T0, { px: x0 + 4.5, py: y0 + 12, pz: z0 - 4 }, pS(si, 1) - T0);
    const o = overlay(si); const yr = pill(o, 540, 420, L.mono, 54, '#14181D', '#FFFFFF', 34); pop(yr, T0 + .15); tl.to(yr, { opacity: 0, duration: .2 }, pS(si, 1));
    // the train climbing, tracked from the slope below
    const t1 = pS(si, 1), p = rp(.465);
    v3(t1 - .05, { railFade: 0, monoOn: 0, trainOn: 1, trainU: .47, aperture: .00004 }); go3(t1, { trainU: .53 }, sEnd(si) - t1 + .3, 'none');
    c3(t1 - .05, { px: p.x + 6, py: p.y + 15, pz: p.z - 6, tx: p.x - 1, ty: p.y + .8, tz: p.z, fov: 34 });
    m3(t1, { px: rp(.52).x + 6, py: rp(.52).y + 14, pz: rp(.52).z - 5, tx: rp(.52).x - 1, ty: rp(.52).y + .8, tz: rp(.52).z }, sEnd(si) - t1);
    flash(T0 - .02, .25);
  },
  rain(si, L) {
    const T0 = sStart(si);
    v3(T0 - .05, { trainOn: 0, aperture: .00002 });
    c3(T0 - .05, { px: -150, py: 120, pz: -230, tx: 0, ty: 0, tz: 0, fov: 34 });
    m3(T0, { px: -120, py: 100, pz: -190 }, pS(si, 2) - T0);
    go3(pS(si, 1), { storm: 1, exposure: .78 }, 2.2, 'power1.inOut'); go3(pS(si, 1) + .4, { rain: 1 }, 1.4, 'power1.in');
    sfx('wave', pS(si, 1) + .3, .6);
    const o = overlay(si); const d = pill(o, 540, 420, L.date, 76, '#FFFFFF', C.red, 44); slam(d, wT(si, 0));
    // macro: rain on the rails, shallow focus
    const t2 = pS(si, 2), p = rp(.62);
    c3(t2 - .05, { px: p.x + 3.5, py: p.y + 1.2, pz: p.z - 3.5, tx: p.x - 1, ty: p.y + .2, tz: p.z, fov: 34 }); v3(t2 - .05, { aperture: .00012 });
    m3(t2, { px: p.x + 2.6, py: p.y + .9, pz: p.z - 2.8 }, sEnd(si) - t2);
  },
  flood(si, L) {
    const T0 = sStart(si);
    v3(T0 - .05, { aperture: .00002, storm: 1, rain: 1 });
    c3(T0 - .05, { px: -30, py: 120, pz: -210, tx: 0, ty: -4, tz: -20, fov: 34 });
    m3(T0, { px: 10, py: 90, pz: -170 }, sEnd(si) - T0);
    go3(T0, { water: 4 }, pS(si, 1) - T0, 'power1.in'); go3(pS(si, 1), { water: 9 }, sEnd(si) - pS(si, 1), 'power2.out');
    sfx('wave', pS(si, 1), .8);
    const o = overlay(si); const r = pill(o, 540, 420, L.river, 72, '#FFFFFF', '#14181D'); pop(r, pS(si, 1));
  },
  slide(si, L) {
    const T0 = sStart(si);
    c3(T0 - .05, { px: SC.x - 28, py: RY + 34, pz: SC.y - 78, tx: SC.x, ty: RY - 2, tz: SC.y - 4, fov: 34 });
    m3(T0, { px: SC.x - 20, py: RY + 26, pz: SC.y - 62 }, pS(si, 1) - T0);
    const o = overlay(si); const k = pill(o, 540, 420, L.hill, 72, '#FFFFFF', '#14181D'); pop(k, T0 + .1);
    const t1 = pS(si, 1);
    go3(t1, { slide: 1 }, 2.0, 'power2.in'); tl.to(ST, { shake: 1.6, duration: .2 }, t1 + .3); tl.to(ST, { shake: 0, duration: 1.6 }, t1 + 1.6);
    sfx('hit', t1 + .3, 1); sfx('thud', t1 + .6, 1); sfx('thud', t1 + 1.1, .8); sfx('dip', t1 + .2, 1, { dur: .6 });
    m3(pS(si, 2), { px: SC.x + 10, py: RY + 20, pz: SC.y - 55, tx: SC.x - 4, ty: RY - 8, tz: SC.y - 12 }, sEnd(si) - pS(si, 2));
  },
  stop(si) {
    const T0 = sStart(si);
    go3(T0, { rain: 0, storm: .45, exposure: .85 }, 1.4, 'power1.out');
    c3(T0 - .05, { px: SC.x + 40, py: RY + 26, pz: SC.y - 52, tx: SC.x, ty: RY - 4, tz: SC.y, fov: 34 });
    sfx('dip', T0, 1, { dur: 1.0 });
  },
  gap(si) {
    const T0 = sStart(si), ex = SC.x + 24, ey = F.railY(ex), ez = F.railZ(ex), gx = SC.x + 4;
    c3(T0 - .05, { px: ex + 12, py: ey + 9, pz: ez - 12, tx: gx, ty: F.railY(gx) - 2, tz: F.railZ(gx) - 3, fov: 34 });
    m3(T0, { px: ex + 7, py: ey + 5, pz: ez - 7 }, sEnd(si) - T0, 'power2.inOut');
    hit(pS(si, 1));
  },
  never(si, L) {
    const T0 = sStart(si);
    { const ex = SC.x + 24, ey = F.railY(ex), ez = F.railZ(ex), gx = SC.x + 4; c3(T0 - .05, { px: ex + 7, py: ey + 5, pz: ez - 7, tx: gx, ty: F.railY(gx) - 2, tz: F.railZ(gx) - 3, fov: 34 }); }
    m3(T0, { px: -60, py: 110, pz: -190, tx: 10, ty: 0, tz: 0 }, sEnd(si) - T0, 'power2.inOut');
    const o = overlay(si); const st = pill(o, 540, 420, L.stamp, 64, '#FFFFFF', C.red, 40); slam(st, lastW(si) - .3);
  },
  name(si, L) {
    const T0 = sStart(si);
    v3(T0 - .05, { show: 1, mapFlood: 0, storm: 0, rain: 0, exposure: .9 });
    c3(T0 - .05, { px: 40, py: 300, pz: -240, tx: 0, ty: 0, tz: 5, fov: 34 });
    m3(T0, { px: 30, py: 250, pz: -200 }, sEnd(si) - T0);
    go3(pS(si, 1), { mapFlood: 1 }, 2.0, 'power2.out'); sfx('wave', pS(si, 1), .7);
    flash(T0 - .02, .3);
    const o = overlay(si); const y = pill(o, 540, 420, '1099', 110, '#FFFFFF', '#14181D', 56); slam(y, wT(si, 1));
    tl.to(y, { opacity: 0, duration: .2 }, pS(si, 2) - .1); const n = pill(o, 540, 420, L.title, 60, '#FFFFFF', C.red, 40); pop(n, pS(si, 2));
  },
  y2018(si) {
    const T0 = sStart(si);
    c3(T0 - .05, { px: -40, py: 250, pz: -210, tx: 0, ty: 0, tz: 5, fov: 34 });
    m3(T0, { px: -30, py: 210, pz: -170 }, sEnd(si) - T0);
    tl.set(ST, { mapFlood: .15 }, T0 - .05); go3(T0 + .3, { mapFlood: 1 }, 1.8, 'power2.out'); sfx('wave', T0 + .3, .6);
    const o = overlay(si); const y = pill(o, 540, 420, '2018', 110, '#FFFFFF', '#2F55C8', 56); slam(y, wT(si, 0));
  },
  top(si, L) {
    const T0 = sStart(si);
    v3(T0 - .05, { show: 0, storm: 0, rain: 0, water: 1.5, mist: .32, exposure: .9, aperture: .00008 });
    c3(T0 - .05, { px: TP.x + 5, py: TP.y + 4, pz: TP.z - 13, tx: TP.x, ty: TP.y + 1.2, tz: TP.z, fov: 34 });
    m3(T0, { px: TP.x + 4, py: TP.y + 3.4, pz: TP.z - 11 }, pS(si, 1) - T0);
    flash(T0 - .02, .3);
    const t1 = pS(si, 1); v3(t1, { aperture: .00002 });
    m3(t1, Object.assign({}, HERO, { px: -150, py: 160, pz: -280 }), DUR - t1, 'power2.inOut');
    sfx('chime', lastW(si) + .2, .9);
  },
};
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 26;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, duration: .15 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
function render(t) {
  $('cam').setAttribute('transform', `translate(540 960) scale(${CAM.s}) rotate(${CAM.r}) translate(${-540 + CAM.x} ${-960 + CAM.y})`);
  $('leakC').setAttribute('cx', (900 + 140 * Math.sin(t * .23)).toFixed(1)); $('leakC').setAttribute('cy', (320 + 120 * Math.cos(t * .19)).toFixed(1));
  PPL.forEach(p => p.render(t, 0));
  F.render(t);
}
