    const o = overlay(si); const tw = pill(o, 470, 360, 'THE TWIST', 62, C.ink, C.accent, 40); pop(tw, T0 + .05); const nr = pill(o, 470, 1150, 'BOOTS WEREN’T THE REASON', 54, '#FFFFFF', C.red, 36); slam(nr, wAt(si, 'reason', 1)); [tw, nr].forEach(e => tl.to(e, { opacity: 0, duration: .12 }, tb - .1));
    // b) their star defender: back to the 1948 ball and the bandages
    flash(tb, .12); v3(tb, { bootsOut: 1, ballSpin: .5 }); c3(tb, { px: -.12, py: .2, pz: .3, tx: -.32, ty: .09, tz: -.12, fov: 34 }); m3(tb + .02, { px: -.18, py: .18, pz: .25 }, sEnd(si) - tb); go3(tb, { ballSpin: .9 }, sEnd(si) - tb, 'none');

    const qg = el('g', {}, o); el('rect', { x: 70, y: 470, width: 870, height: 330, rx: 26, fill: C.ink, opacity: .86 }, qg); el('rect', { x: 70, y: 470, width: 12, height: 330, fill: C.accent }, qg);
    const q1 = text(qg, 505, 560, '“For us, the Olympics', 64, '#FFFFFF', 'middle', { 'font-weight': 800 }); const q2 = text(qg, 505, 645, 'was everything.”', 64, C.accent, 'middle', { 'font-weight': 800 }); text(qg, 505, 740, 'Sailen Manna, as reported', 34, '#CFC6B6', 'middle', { 'font-weight': 600 });
    fitW(q1, 820); fitW(q2, 820); pop(qg, tc + .05);
  },
  payoff(si) {

    const H = hookCard(); tl.set(H.h, { opacity: 0 }, 0); tl.to(H.h, { opacity: 1, duration: .4 }, wT(si, 4) - .1);

const THREE = await import('three');
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 26;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .22, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));

tl.seek(DUR, false); tl.seek(0, false); render(0);

window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
