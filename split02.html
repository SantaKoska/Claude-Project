    v.depth.setAttribute('x', -TW / 2 + 10 * E); v.depth.setAttribute('y', y1 + 12 * E); v.depth.setAttribute('width', TW); v.depth.setAttribute('height', h); v.depth.setAttribute('fill', mix(base, '#000000', .25)); v.depth.setAttribute('opacity', E);
    v.perf.setAttribute('x1', -TW / 2 + 16); v.perf.setAttribute('x2', TW / 2 - 16); v.perf.setAttribute('y1', y1 + 2); v.perf.setAttribute('y2', y1 + 2); v.perf.setAttribute('opacity', (E * .8).toFixed(2));
    v.glow.setAttribute('x', -TW / 2 - 60); v.glow.setAttribute('y', y1 - 60); v.glow.setAttribute('width', TW + 120); v.glow.setAttribute('height', h + 120); v.glow.setAttribute('opacity', BS[i].glow);
    v.g.setAttribute('opacity', op); geo.push({ ym: (y0 + y1) / 2 }); });
  tFace.setAttribute('opacity', TK.paper.toFixed(3));
  const LX = X + (TW / 2 + 40) * s + 20;
  const rows = geo.map((g, i) => ({ i, y: Y + g.ym * s, on: BS[i].lab })).filter(r => r.on > .001);

  LBT.forEach(b => b.g.setAttribute('opacity', 0));
  rows.forEach(r => { const b = LBT[r.i]; const ax = X + (TW / 2 + 10 * E) * s, ay = Y + geo[r.i].ym * s; const lx = Math.min(LX, 940 - b.w);
    b.g.setAttribute('opacity', (r.on * (1 - .75 * BS[r.i].dim)).toFixed(3)); b.dot.setAttribute('cx', ax); b.dot.setAttribute('cy', ay);
    b.line.setAttribute('points', `${ax.toFixed(1)},${ay.toFixed(1)} ${(lx - 26).toFixed(1)},${r.y.toFixed(1)} ${lx},${r.y.toFixed(1)}`);
    b.p.setAttribute('transform', `translate(${lx} ${r.y.toFixed(1)}) scale(${(.6 + .4 * Math.min(1, r.on * 1.4)).toFixed(3)})`); });

text(fCard, 140, 370, 'INDIA’S BIGGEST MULTIPLEX CHAIN · FY26', 26, '#8F98C8', 'start', { 'letter-spacing': 2 });

const WX = { v: 0 };
function slide(from, to, t) { sfx('whoosh', t, .8); tl.set(to, { opacity: 1 }, t); tl.fromTo(to, { x: 1080 }, { x: 0, duration: .62, ease: 'power3.inOut', immediateRender: false }, t);

  mLbl.textContent = t >= MLBL_T ? 'തിയേറ്ററിന്' : '₹160 ൽ ബാക്കി'; mVal.textContent = t >= MLBL_T + .3 ? '≈ ₹50' : rs(v); }
const scenes = {
  hook(si) {

    tl.set(money, { opacity: 0 }, 0); tl.set(approx, { opacity: 0 }, 0); costs.forEach(c => tl.set(c, { opacity: 0 }, 0));

  taxes(si) {

// ---------------------------------------------------------------- captions: navy box, word by word, money words underlined
const capBox = $('captions'), MAXCH = 22;
const isNum = w => /[0-9₹]|രൂപ|ശതമാനം|മൂന്നിലൊന്ന്|പകുതി|ഇരുപത്തഞ്ച്/.test(w);
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);

// ---------------------------------------------------------------- time-only render
const tiles = $('tiles'), leaves = $('leaves'), cam = $('cam');

  drawTicket(t); moneyAt(t);
  const wx = WX.v; tiles.setAttribute('patternTransform', `translate(${(wx % 120).toFixed(2)} 0)`); const lw = ((wx % 1080) + 1080) % 1080; leaves.setAttribute('transform', `translate(${(lw > 540 ? lw - 1080 : lw).toFixed(2)} 0)`);
  cam.setAttribute('transform', `translate(${CAMS.ox} ${CAMS.oy}) scale(${CAMS.s.toFixed(4)}) translate(${-CAMS.ox} ${-CAMS.oy})`);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
