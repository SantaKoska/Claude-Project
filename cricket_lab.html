</head><body><div id="stage"><canvas id="gl" width="1080" height="1920"></canvas></div>
<script type="module">
import { CricketWorld } from './lib/cricket3d.js';
await document.fonts.load('800 80px Inter','A'); await document.fonts.load('bold 80px "DejaVu Serif"','A');
const W = window.W = new CricketWorld(document.getElementById('gl'));
