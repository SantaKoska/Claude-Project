<script>
(async function () {
const CFG = JSON.parse(document.getElementById('config').textContent);

const C = CFG.palette, FONT = CFG.font;
const NS = 'http://www.w3.org/2000/svg';
const DUR = TIM.duration;
const SFX = [];
const $ = id => document.getElementById(id);
window.BEAT = TIM.beat || null;
const BEAT = window.BEAT;
const snapT = t => { if (!BEAT) return t; const g = 30 / BEAT.bpm; return Math.max(0, BEAT.t0 + Math.ceil((t - .08 - BEAT.t0) / g) * g); };
const FREE = new Set(['tick', 'wave', 'dip', 'shimmer', 'siren', 'type']);

// ---------------------------------------------------------------- timing
const sentences = CFG.sentences.map((s, si) => { const ph = TIM.phrases.filter(p => p.sentence === si); return Object.assign({}, s, { ph, words: ph.flatMap(p => p.words) }); });

let clipN = 0;
function typeLine(parent, x, y, str, size, fill, t, d = .9, anchor = 'start') {

  const g = el('g', { 'clip-path': `url(#${id})` }, parent); const tx = text(g, x, y, str, size, fill, anchor, { 'letter-spacing': 3 });
  const w = tx.getBBox().width + 12, x0 = anchor === 'middle' ? x - w / 2 : x - 4; r.setAttribute('x', x0);
  const o = { w: 0 }; tl.to(o, { w, duration: d, ease: 'steps(' + Math.max(6, str.length) + ')', onUpdate: () => r.setAttribute('width', o.w) }, t);
  for (let k = 0; k < Math.min(12, str.length); k++) sfx('type', t + k * d / Math.min(12, str.length), .5);
  return g;
}
// lower-third location card: thin orange line + typewriter text
function lowerThird(parent, line1, line2, t) {

}

// ---------------------------------------------------------------- camera (Ken Burns)
const CAM = { s: 1, x: 0, y: 0, r: 0 };
const camTo = (t, v, d, ease = 'sine.inOut') => tl.to(CAM, Object.assign({ duration: d, ease }, v), t);

const PPL = [];

}
function cityBlocks(parent, x0, y0, w, h, cell, rnd, colA = '#173A44', colB = '#1E4652') {

const rnd = (() => { let s = 13; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const police = [];   // flashing lightbars, updated in render
const DAY = { d: 17 };

// ================================================================= SCENES
const scenes = {
  hook(si, L) {

  chase(si, L) {

  rename(si, L) {

    const plate = el('g', {}, g); el('rect', { x: 110, y: 470, width: 860, height: 330, rx: 20, fill: '#0D1418', stroke: '#F3EEE4', 'stroke-width': 4, filter: 'url(#shadow)' }, plate);

  timeline(si, L) {

    for (let i = 0; i < 70; i++) { el('rect', { x: 10 + i * 32, y: 516, width: 18, height: 26, rx: 4, fill: '#2A2A2C' }, strip); el('rect', { x: 10 + i * 32, y: 978, width: 18, height: 26, rx: 4, fill: '#2A2A2C' }, strip); }
    const frames = [];
    [0, 1, 2].forEach(i => { const fx = 240 + i * 640; const fr = el('g', {}, strip); el('rect', { x: fx - 260, y: 560, width: 520, height: 400, fill: '#1A2A30' }, fr); frames.push({ fr, fx }); });
    // frame 1: top-down city
    { const f = frames[0], cl = el('clipPath', { id: 'f1c' }, $('defs')); el('rect', { x: f.fx - 260, y: 560, width: 520, height: 400 }, cl); const gg = el('g', { 'clip-path': 'url(#f1c)' }, f.fr); cityBlocks(gg, f.fx - 260, 560, 520, 400, 100, rnd); const c = el('rect', { x: f.fx - 12, y: 720, width: 24, height: 44, rx: 6, fill: C.accent }, gg); }
    // frame 2: New York skyline
    { const f = frames[1], cl = el('clipPath', { id: 'f2c' }, $('defs')); el('rect', { x: f.fx - 260, y: 560, width: 520, height: 400 }, cl); const gg = el('g', { 'clip-path': 'url(#f2c)' }, f.fr); el('rect', { x: f.fx - 260, y: 560, width: 520, height: 400, fill: '#21323A' }, gg); const sk = skyline(gg, 960, '#0E1A1F', rnd, 9, 260); sk.setAttribute('transform', `translate(${f.fx - 270} 0)`); el('circle', { cx: f.fx + 150, cy: 640, r: 36, fill: '#F3E7C8', opacity: .8 }, gg); }
    // frame 3: the city tilts into 3D
    const iso = el('g', {}, frames[2].fr);
    { const f = frames[2], cl = el('clipPath', { id: 'f3c' }, $('defs')); el('rect', { x: f.fx - 260, y: 560, width: 520, height: 400 }, cl); iso.setAttribute('clip-path', 'url(#f3c)'); el('rect', { x: f.fx - 260, y: 560, width: 520, height: 400, fill: '#1A2A30' }, iso);
      const city = el('g', {}, iso); window.__iso = { city, fx: f.fx };
      for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) { const h = 30 + ((i * 7 + j * 3) % 5) * 22, bx = f.fx - 200 + i * 80, by = 620 + j * 80; const b = el('g', {}, city); el('rect', { x: bx, y: by, width: 56, height: 56, fill: '#2E5966' }, b); const top = el('rect', { x: bx, y: by, width: 56, height: 56, fill: '#4A8796', class: 'top', 'data-h': h }, b); } }
    const years = [L.y1, L.y2, L.y3], caps = [L.c1, L.c2, L.c3];
    const ylabels = years.map((y, i) => { const gg = el('g', {}, strip); text(gg, frames[i].fx, 430, y, 120, C.gold, 'middle', { filter: 'url(#glow)' }); text(gg, frames[i].fx, 1090, caps[i], 50, '#F3EEE4'); if (i === 1) text(gg, frames[i].fx, 1160, L.c2b, 40, C.accent); hide(gg); return gg; });
    show(g, T0 - .05, .4); sfx('shutter', T0, .5);

    [0, 1, 2].forEach(i => { const t = pS(si, i); tl.to(SX, { x: 300 - i * 640, duration: .8, ease: 'power3.inOut', onUpdate: placeStrip }, t - .25); show(ylabels[i], snapT(t), .3); sfx('whoosh', t - .25, .45); sfx('tick', t, .7); });
    const ISO = { k: 0 }; window.__ISO = ISO; tl.to(ISO, { k: 1, duration: 1.2, ease: 'power2.inOut' }, wT(si, wIdx(si, 2, 5)) - .2); hit(wT(si, wIdx(si, 2, 5)));
    camSet(T0 - .05, { s: 1.0, x: 0, y: 0 });
    fadeOut(g, T1 - .25, .3);
  },
  record(si, L) {
    const g = scene('record'), T0 = sStart(si), T1 = sEnd(si);
    for (let i = 0; i < 40; i++) el('circle', { cx: (i * 137) % 1080, cy: 300 + (i * 211) % 1000, r: 3 + (i % 4), fill: C.gold, opacity: .25 + (i % 5) * .08, class: 'dust' }, g);

    const dd = Math.max(1.2, wT(si, wIdx(si, 0, 9)) - T0 - .2);
    counter(ct, 0, 1e9, T0 + .4, dd, v => '$' + Math.round(v).toLocaleString('en-US'), 18);
    const days = el('g', {}, g); const dl = [1, 2, 3].map(k => { const gg = el('g', {}, days); el('rect', { x: 200 + (k - 1) * 240, y: 760, width: 200, height: 120, rx: 16, fill: '#121B20', stroke: C.gold, 'stroke-width': 4 }, gg); text(gg, 300 + (k - 1) * 240, 800, L.day, 36, '#F3EEE4'); text(gg, 300 + (k - 1) * 240, 848, String(k), 52, C.gold); hide(gg); return gg; });
    dl.forEach((d, k) => { const t = T0 + .4 + dd * (k + 1) / 3.3; show(d, snapT(t), .2); sfx('pop', t, .5); });
    const st = el('g', {}, g); el('rect', { x: 230, y: 960, width: 620, height: 130, rx: 12, fill: 'none', stroke: C.red, 'stroke-width': 9 }, st); text(st, 540, 1025, L.stamp, 76, C.red);
    tl.set(st, { rotation: -6, svgOrigin: '540 1025' }, 0); stamp(st, pS(si, 1), { origin: '540px 1025px' }); hit(pS(si, 1)); flash(snapT(pS(si, 1)) + .1, .3);
    show(g, T0 - .05, .4); camSet(T0 - .05, { s: 1.06, x: 0, y: 20 }); camTo(T0, { s: 1.0, y: 0 }, T1 - T0);
    fadeOut(g, T1 - .25, .3);
  },
  next(si, L) {
    const g = scene('next'), T0 = sStart(si), T1 = sEnd(si);
    el('rect', { x: -100, y: -100, width: 1280, height: 2120, fill: 'url(#sunset)' }, g);
    const sun = el('circle', { cx: 540, cy: 900, r: 170, fill: '#FFE3A0', opacity: .9 }, g);
    el('rect', { x: -100, y: 1000, width: 1280, height: 1000, fill: '#2A1430' }, g);

    const sk = skyline(g, 1005, '#3A1838', rnd, 16, 300); sk.setAttribute('opacity', .95);
    [[110, 1005, 1.2], [930, 1005, 1.0], [780, 1005, .8]].forEach(([px, py, s]) => { const p = el('g', { transform: `translate(${px} ${py}) scale(${s})` }, g); el('path', { d: 'M0 0 Q-10 -180 12 -360', stroke: '#1A0C1E', 'stroke-width': 18, fill: 'none' }, p); for (let k = 0; k < 7; k++) { const a = -150 + k * 40; el('path', { d: `M12 -360 q${Math.cos(a * Math.PI / 180) * 60} ${-40 + Math.sin(a * Math.PI / 180) * 30} ${Math.cos(a * Math.PI / 180) * 140} ${Math.sin(a * Math.PI / 180) * 80 + 20}`, stroke: '#1A0C1E', 'stroke-width': 14, fill: 'none', 'stroke-linecap': 'round' }, p); } });
    const cal = el('g', { filter: 'url(#shadow)' }, g);
    el('rect', { x: 380, y: 300, width: 320, height: 300, rx: 22, fill: '#F3EEE4' }, cal); el('rect', { x: 380, y: 300, width: 320, height: 80, rx: 22, fill: C.red }, cal);

    [18, 19].forEach((d, k) => { const t = pS(si, 0) + .7 + k * .55; tl.set(DAY, { d }, snapT(t)); tl.fromTo(cal, { scaleY: .85 }, { scaleY: 1, transformOrigin: '540px 300px', duration: .2, immediateRender: false }, snapT(t)); sfx('tick', t, .8); });
    const t1 = pS(si, 1), title = text(g, 540, 690, L.title, 170, '#FFF4DE', 'middle', { stroke: '#2B1240', 'stroke-width': 10, 'paint-order': 'stroke', 'letter-spacing': 12 });
    hide(title); tl.to(title, { opacity: 1, duration: .6 }, snapT(wT(si, wIdx(si, 1, 3)))); hit(wT(si, wIdx(si, 1, 3))); sfx('shimmer', wT(si, wIdx(si, 1, 3)), .6);

sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, duration: .15 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
function render(t) {
  $('cam').setAttribute('transform', `translate(540 960) scale(${CAM.s}) rotate(${CAM.r}) translate(${-540 + CAM.x} ${-960 + CAM.y})`);
  const on = Math.floor(t * 6) % 2;                         // police lights alternate 6x/s
  police.forEach(p => {
    if (p.car) { p.car.red.setAttribute('opacity', on ? 1 : .25); p.car.blue.setAttribute('opacity', on ? .25 : 1); p.glowR.setAttribute('opacity', on ? .9 : .1); p.glowB.setAttribute('opacity', on ? .1 : .9); p.rr.setAttribute('opacity', on ? .9 : .2); p.rb.setAttribute('opacity', on ? .2 : .9); }
    if (p.top) { p.top.cr.setAttribute('opacity', on ? 1 : .2); p.top.cb.setAttribute('opacity', on ? .2 : 1); p.top.copGlow.setAttribute('fill', on ? 'url(#redGlow)' : 'url(#blueGlow)'); }
  });
  if (window.__ISO) { const k = window.__ISO.k, { city, fx } = window.__iso;
    city.setAttribute('transform', `translate(${fx} 760) scale(1 ${1 - .45 * k}) rotate(${45 * k}) translate(${-fx} -760)`);
    city.querySelectorAll('.top').forEach(r => { const h = +r.getAttribute('data-h') * k; r.setAttribute('transform', `translate(${-h * .6} ${-h})`); }); }
  document.querySelectorAll('.dust').forEach((d, i) => d.setAttribute('cy', (300 + ((i * 211 + t * (18 + i % 7 * 6)) % 1000)).toFixed(1)));
  $('leakC').setAttribute('cx', (900 + 140 * Math.sin(t * .23)).toFixed(1)); $('leakC').setAttribute('cy', (320 + 120 * Math.cos(t * .19)).toFixed(1));
  if (window.__day) window.__day.textContent = String(DAY.d);
  PPL.forEach(p => { p.S.armN = p.S.raise ? [150, 20 + 10 * Math.sin(t * 8)] : (p.baseArm || null); p.render(t, 0); });
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
