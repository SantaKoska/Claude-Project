    const ts = pS(si, 2) - .05; dip(ts, .5); showSet(swordS, ts, null); camSet(ts, { s: 1.05, x: 0, y: 0 }); camTo(ts, { s: 1.35, x: -120, y: 40 }, sEnd(si) - ts, 'sine.inOut');

    const s2 = stamp(front, 540, 330, 'A SWORD · A STAIN', 36, ts + .5); tl.to(s2, { opacity: 0, duration: .3 }, sEnd(si) - .3);

  ten(si) {

sentences.forEach((s, si) => scenes[s.scene](si));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 26;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .15 : Math.min(next - .15, ph.end + .8);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .1)); tl.to(page, { opacity: 0, duration: .2 }, tOut);
    words.forEach((w, j) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 10 }, 0); tl.to(s, { opacity: 1, y: 0, duration: .35, ease: 'power2.out' }, Math.max(0, w.t - .08));
      tl.set(s, { color: C.amber }, Math.max(0, w.t - .08)); tl.set(s, { color: '#ECE6DA' }, j + 1 < words.length ? words[j + 1].t - .08 : tOut); });
  });
});

// ---------------------------------------------------------------- time-only render
const torchHole = $('torchHole');
function waveD(k, t, x0 = -400, x1 = 1480, base0 = 1036) {
  const base = base0 + k * 52 + k * k * 14, A = 5 + k * 4.5, L = 140 + k * 70, sp = .5 + k * .18; let d = `M${x0} 2400 L${x0} ${base}`;
  for (let x = x0; x <= x1; x += 30) d += ` L${x} ${(base + A * Math.sin(x / L + t * sp + k) + A * .5 * Math.sin(x / (L * .43) - t * sp * 1.3 + k * 2)).toFixed(1)}`;
  return d + ` L${x1} 2400 Z`;
}
function render(t) {
  // sea
  waves.forEach((w, k) => w.setAttribute('d', waveD(k, t)));
  clouds.forEach((c, k) => { c.setAttribute('cx', ((k * 330 + t * (6 + k * 2) * (k % 2 ? 1 : -1)) % 1800 + 1800) % 1800 - 400); c.setAttribute('cy', 180 + k * 95); });
  glints.forEach((g, k) => { const y = 1050 + k * 22, a = .5 + .5 * Math.sin(t * 3 + k * 1.7); g.setAttribute('cx', 760 + Math.sin(k * 2.3 + t * .8) * (30 + k * 8)); g.setAttribute('cy', y); g.setAttribute('rx', 20 + k * 6); g.setAttribute('opacity', a.toFixed(2)); });
  fogs.forEach((f, k) => { f.setAttribute('cx', 540 + Math.sin(t * .07 + k * 1.9) * 300); f.setAttribute('cy', 1000 + k * 120); });
  const bob = Math.sin(t * .9) * 6, roll = SH.roll + Math.sin(t * .7) * 2.4 + Math.sin(t * 1.9) * .6;
  farShip.setAttribute('transform', `translate(${SH.x.toFixed(1)} ${(SH.y + bob).toFixed(1)}) rotate(${roll.toFixed(2)}) scale(${SH.s.toFixed(3)})`);
  ship.sails.setAttribute('transform', `skewX(${(Math.sin(t * 1.3) * 1.6).toFixed(2)})`);
  lanternG.setAttribute('transform', `translate(${230 + Math.sin(t * .8) * 6} ${1230 + Math.sin(t * 1.1) * 10}) scale(1.7)`);
  if (ROW.on) { const x = -200 + ROW.u * 760, y = 1300 + Math.sin(t * 1.2) * 10; rowboat.setAttribute('opacity', 1); rowboat.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(Math.sin(t * 1.1) * 3).toFixed(2)}) scale(1.9)`);
    const st = Math.sin(t * 3.2); rowboat.oars.forEach((o, i) => { const bx = [-45, 40][i]; o.setAttribute('x2', bx - 110 + st * 40); o.setAttribute('y2', 20 - Math.abs(st) * 10); }); }
  else rowboat.setAttribute('opacity', 0);
  // deck
  wheel.setAttribute('transform', `translate(${WH.x} ${WH.y}) scale(${WH.s.toFixed(3)})`); wheelR.setAttribute('transform', `rotate(${(Math.sin(t * .6) * 14 + Math.sin(t * 1.7) * 3).toFixed(2)})`);
  deckFog.forEach((f, k) => { f.setAttribute('cx', 540 + Math.sin(t * .1 + k * 2) * 260); f.setAttribute('cy', 900 + k * 260); });
  // lifeboat davits: loose ropes swing
  ropes.forEach((r, k) => { const x = [370, 770][k], sw = Math.sin(t * 1.1 + k) * 26; r.setAttribute('d', `M${x} 600 Q${x + sw * .5} 760 ${x + sw} 900`); });
  lbWaves.forEach((w, k) => w.setAttribute('d', waveD(k + 1, t, -400, 1480, 1040)));
  lbFog.forEach((f, k) => { f.setAttribute('cx', 540 + Math.sin(t * .09 + k * 2.2) * 300); f.setAttribute('cy', 980 + k * 90); });
  // hold water
  { let d = `M-400 2300 L-400 ${WATER.y}`; for (let x = -400; x <= 1480; x += 30) d += ` L${x} ${(WATER.y + Math.sin(x / 90 + t * 1.6) * 6).toFixed(1)}`; d += ' L1480 2300 Z'; water.setAttribute('d', d);
    let h = `M-400 ${WATER.y}`; for (let x = -400; x <= 1480; x += 30) h += ` L${x} ${(WATER.y + Math.sin(x / 90 + t * 1.6) * 6).toFixed(1)}`; waterHi.setAttribute('d', h); }
  // day counter (computed from t)
  { const k = t < DAYS.ta ? 0 : Math.max(0, Math.min(10, Math.floor((t - DAYS.ta) / .14 + 1e-6))); dayTxt.textContent = k === 0 ? '25 NOV' : k === 10 ? '10 DAYS LATER' : '+' + k + (k === 1 ? ' DAY' : ' DAYS'); daySub.textContent = k === 0 ? 'LAST ENTRY' : k === 10 ? 'FOUND · DRIFTING' : '· · ·'; dayTxt.setAttribute('font-size', k === 10 ? 50 : 64); }
  // quill writes
  { ink.setAttribute('stroke-dashoffset', (inkLen * (1 - QUILL.u)).toFixed(1)); const P = ink.getPointAtLength(Math.max(.1, inkLen * QUILL.u)); quill.setAttribute('transform', `translate(${P.x.toFixed(1)} ${P.y.toFixed(1)})`); }
  // torch
  const jit = Math.sin(t * 9) * 4 + Math.sin(t * 13) * 3; torchHole.setAttribute('cx', (TORCH.x + jit).toFixed(1)); torchHole.setAttribute('cy', (TORCH.y + jit * .6).toFixed(1)); torchHole.setAttribute('r', TORCH.r);
  // camera
  world.setAttribute('transform', `translate(540 900) scale(${CAM.s.toFixed(4)}) translate(${(-540 + CAM.x).toFixed(1)} ${(-900 + CAM.y).toFixed(1)})`);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
