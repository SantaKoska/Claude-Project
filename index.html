const C = CFG.palette, FONT = CFG.font;
const NS = 'http://www.w3.org/2000/svg';
const DUR = TIM.duration;
const SFX = [];
const $ = id => document.getElementById(id);
const sfx = (type, t, gain = 1) => SFX.push({ type, t: +t.toFixed(3), gain });

await document.fonts.load(`700 80px ${FONT}`, 'മലയാളം');
document.body.style.fontFamily = FONT;

// ---------------------------------------------------------------- helpers
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function svg(parent, markup) {           // append markup, return the first new element
  const g = el('g', {}, parent); g.innerHTML = markup; return g;
}
function text(parent, x, y, str, size, fill, anchor = 'middle', extra = {}) {
  const t = el('text', Object.assign({ x, y, 'font-size': size, fill, 'text-anchor': anchor,
    'font-family': FONT, 'dominant-baseline': 'central' }, extra), parent);
  t.textContent = str; return t;
}
// pill label: rounded box sized to its text
function pill(parent, cx, cy, str, o = {}) {
  const g = el('g', {}, parent);
  const size = o.size || 56, padX = o.padX ?? size * 0.55, padY = o.padY ?? size * 0.32;

  const t = text(g, cx, cy, str, size, o.color || '#fff');
  const b = t.getBBox();
  const w = b.width + padX * 2, h = size * 1.25 + padY * 2;

    el('circle', { cx: 540, cy: 935, r: 225, fill: '#0B1236', opacity: .92 }, lens);
    const lat = el('g', { 'clip-path': 'url(#lensClip)' }, lens);
    const latInner = el('g', {}, lat);
    const R = 46, atoms = [], bonds = [];
    for (let row = -6; row <= 6; row++) for (let col = -5; col <= 5; col++) {
      const x = 540 + col * R * Math.sqrt(3) + (row % 2 ? R * Math.sqrt(3) / 2 : 0), y = 935 + row * R * 1.5;
      for (let k = 0; k < 6; k++) {
        const a1 = Math.PI / 6 + k * Math.PI / 3, a2 = a1 + Math.PI / 3;
        bonds.push(`M${(x + R * Math.cos(a1)).toFixed(1)} ${(y + R * Math.sin(a1)).toFixed(1)}L${(x + R * Math.cos(a2)).toFixed(1)} ${(y + R * Math.sin(a2)).toFixed(1)}`);
        if (k < 2) atoms.push([x + R * Math.cos(a1), y + R * Math.sin(a1)]);
      }
    }
    el('path', { d: bonds.join(''), stroke: C.accent2, 'stroke-width': 5, opacity: .75, fill: 'none' }, latInner);
    atoms.forEach(([x, y]) => el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 10, fill: '#CCFBF1', filter: 'url(#glow)' }, latInner));
    el('circle', { cx: 540, cy: 935, r: 225, fill: 'none', stroke: '#E0E7FF', 'stroke-width': 12, filter: 'url(#glow)' }, lens);
    el('path', { d: 'M700 1095 L800 1195', stroke: '#E0E7FF', 'stroke-width': 30, 'stroke-linecap': 'round' }, lens);
    pop(lens, t1, { from: .1, d: .6, sound: 'whoosh' });
    tl.to(latInner, { rotation: 18, svgOrigin: '540 935', duration: T1 - t1 + .5, ease: 'none' }, t1);
    fadeOut(window.__stone.stone, t1 + .2, .3);
    // element card
    const card = el('g', { filter: 'url(#cardShadow)' }, g);
    el('rect', { x: 400, y: 410, width: 280, height: 270, rx: 34, fill: 'url(#cardG)', stroke: C.accent2, 'stroke-width': 5 }, card);
    const num = text(card, 438, 455, '0', 42, C.accent2, 'start');
    text(card, 540, 540, L.symbol, 140, '#fff');
    text(card, 540, 635, L.name, 46, C.accent2);
    pop(card, t1 + .15, { sound: 'pop' });
    counter(num, 0, L.number, t1 + .3, .8, v => v, 6);
    sfx('shimmer', t1 + .4, .5);
    window.__reveal = { g, lens, card };
    fadeOut(g, T1 - .1, .3);
    window.__ground.forEach(e => fadeOut(e, T1 - .1, .3));
  },

  // ---------------------------------------------------------------- RECIPE
  recipe(si, L) {
    const T0 = sStart(si), T1 = sEnd(si), cu = L.cues, W = k => wT(si, k);
    const g = el('g', {}, $('layerMid'));
    sfx('whoosh', T0 - .15, .8);
    camTo(T0 - .1, { s: 1, x: 540, y: 960 }, .8);
    heroTo(T0 - .2, { x: 500, y: 1200, r: 0, s: .84 }, 1);
    tl.to(H, { cut: 1, duration: .6 }, T0 + .3);
    // ingredients
    const pileA = el('g', {}, g), pileB = el('g', {}, g);
    el('path', { d: 'M110 610 Q250 430 390 610Z', fill: '#2B303C', stroke: '#6B7488', 'stroke-width': 3 }, pileA);
    el('path', { d: 'M590 610 Q730 430 870 610Z', fill: '#D9A36A', stroke: '#F3D2A2', 'stroke-width': 3 }, pileB);
    for (let i = 0; i < 26; i++) {
      const u = (i * 37 % 26) / 26, v = (i * 11 % 7) / 7;
      const x = 150 + u * 200, y = 600 - v * 110 * Math.sin(Math.PI * u);
      el('circle', { cx: x, cy: y, r: 6 + (i % 3) * 2, fill: '#596173' }, pileA);
      el('circle', { cx: x + 480, cy: y, r: 6 + (i % 3) * 2, fill: '#EBC08B' }, pileB);
    }
    const la = pill(g, 250, 410, L.a, { size: 54, fill: C.card, stroke: '#94A3B8' });
    const lb = pill(g, 730, 410, L.b, { size: 54, fill: C.card, stroke: '#F3D2A2' });
    const plus = text(g, 490, 540, '+', 110, '#fff', 'middle', { filter: 'url(#glow)' });
    pop(pileA, W(cu.a), { from: .2 }); pop(la, W(cu.a) + .1, { sound: false });
    pop(plus, W(cu.b) - .15, { sound: false });
    pop(pileB, W(cu.b), { from: .2 }); pop(lb, W(cu.b) + .1, { sound: false });
    // mixing swirl fed by two particle streams
    const swirl = el('g', {}, g);
    el('circle', { cx: 490, cy: 700, r: 62, fill: '#3B4050', stroke: '#fff', 'stroke-width': 4 }, swirl);
    const swirlDots = el('g', {}, swirl);
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; el('circle', { cx: 490 + Math.cos(a) * 36, cy: 700 + Math.sin(a) * 36, r: 9, fill: i % 2 ? '#EBC08B' : '#1F2430' }, swirlDots); }
    pop(swirl, W(cu.mix), { sound: 'whoosh', gain: .5 });
    tl.to(swirlDots, { rotation: 720, svgOrigin: '490 700', duration: 3, ease: 'none' }, W(cu.mix));
    tl.to(AMB, { flow: 1, duration: .3 }, W(cu.mix) - .2);
    tl.to(AMB, { flow: 0, duration: .3 }, W(cu.process) + .2);
    // kiln
    const kiln = el('g', {}, g);
    el('path', { d: 'M330 975 L330 870 Q330 760 490 760 Q650 760 650 870 L650 975 Z', fill: 'url(#kilnG)', stroke: '#F59E7A', 'stroke-width': 4 }, kiln);
    el('path', { d: 'M330 830 H650 M330 900 H650 M410 760 V830 M570 760 V830 M450 830 V900 M530 830 V900', stroke: '#7A2A1C', 'stroke-width': 4, opacity: .55 }, kiln);
    const mouth = el('path', { d: 'M425 975 L425 920 Q425 880 490 880 Q555 880 555 920 L555 975Z', fill: 'url(#fireG)', filter: 'url(#glow)', class: 'mouth' }, kiln);
    const heat = el('path', { d: 'M440 740 q12 -20 0 -40 q-12 -20 0 -40 M490 735 q12 -20 0 -40 q-12 -20 0 -40 M540 740 q12 -20 0 -40 q-12 -20 0 -40', stroke: '#FDBA74', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round', opacity: 0 }, kiln);
    const lk = pill(g, 790, 880, L.process, { size: 54, fill: C.card, stroke: '#FDBA74' });
    pop(kiln, W(cu.process) - .1, { from: .5 }); pop(lk, W(cu.process) + .05, { sound: false });
    tl.to(swirl, { y: 190, scale: .4, opacity: 0, svgOrigin: '490 700', duration: .5, ease: 'power2.in' }, W(cu.process) + .1);
    tl.to(AMB, { fire: 1, duration: .4 }, W(cu.heat) - .1);
    tl.to(heat, { opacity: 1, duration: .3 }, W(cu.heat));
    sfx('fire', W(cu.heat) - .1, .7);
    // rod comes out and becomes the core
    const rod = el('rect', { x: 360, y: 920, width: 260, height: 32, rx: 14, fill: '#FF9F1C', filter: 'url(#glow)' }, g);
    hide(rod);
    tl.to(rod, { opacity: 1, duration: .15 }, W(cu.rod));
    tl.to(rod, { attr: { y: 1184, fill: '#3A4050' }, duration: .55, ease: 'power2.in' }, W(cu.rod) + .05);
    sfx('whoosh', W(cu.rod), .6);
    const core = $('obj-core');
    tl.to(core, { attr: { width: 760 }, duration: .6, ease: 'power2.out' }, W(cu.result) - .05);
    tl.to(rod, { opacity: 0, duration: .2 }, W(cu.result) + .1);
    sfx('pop', W(cu.result), .8);
    const lm = pill(g, 830, 1060, L.result, { size: 52, fill: C.card, stroke: C.accent2 });
    const ar = el('path', { d: 'M880 1100 Q910 1140 912 1176', stroke: C.accent2, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, g);
    pop(lm, W(cu.result) + .1, { sound: false }); drawPath(ar, W(cu.result) + .2, .25);
    tl.to(H, { cut: 0, duration: .5 }, W(cu.done) + .1);
    tl.to(H, { shineX: 520, duration: .8, ease: 'power2.inOut' }, W(cu.done) + .35);
    tl.set(shine, { opacity: 1 }, W(cu.done) + .35); tl.set(shine, { opacity: 0 }, W(cu.done) + 1.2);
    sfx('chime', W(cu.done) + .35, .7);
    tl.to(AMB, { fire: 0, duration: .4 }, T1 - .2);
    fadeOut(g, T1 - .12, .3);
  },

  // ---------------------------------------------------------------- COMPARE
  compare(si, L) {
    const T0 = sStart(si), T1 = sEnd(si);
    const g = el('g', {}, $('layerMid'));
    sfx('whoosh', T0 - .1, .6);
    heroTo(T0 - .1, { x: 500, y: 1215 }, .6);
    // ratio bar
    const bar = el('g', {}, g);
    pill(bar, 250, 420, L.barLeft, { size: 46, fill: '#3A2A1A', stroke: '#D9A36A' });
    pill(bar, 730, 420, L.barRight, { size: 46, fill: '#1A1D26', stroke: '#94A3B8' });
    el('rect', { x: 110, y: 490, width: 760, height: 56, rx: 28, fill: '#2B303C' }, bar);
    const clay = el('rect', { x: 110, y: 490, width: 380, height: 56, rx: 28, fill: '#D9A36A' }, bar);
    el('rect', { x: 110, y: 490, width: 760, height: 56, rx: 28, fill: 'none', stroke: '#fff', 'stroke-width': 4, opacity: .7 }, bar);
    fadeIn(bar, T0, .35);
    // cards + paper strip with marks
    const mkCard = (cx, letter, letterFill, bgFill) => {
      const c = el('g', { filter: 'url(#cardShadow)' }, g);
      el('rect', { x: cx - 115, y: 600, width: 230, height: 220, rx: 34, fill: bgFill, stroke: '#fff', 'stroke-width': 5 }, c);
      text(c, cx, 712, letter, 150, letterFill);
      return c;
    };
    const cH = mkCard(290, L.left, '#AAB2C2', '#F4F6FB'), cB = mkCard(690, L.right, '#0E1016', '#F4F6FB');
    const paper = el('rect', { x: 110, y: 850, width: 760, height: 140, rx: 22, fill: '#FBFAF5' }, g);
    fadeIn(paper, T0 + .1, .3);
    const mH = el('path', { d: 'M150 925 c30 -40 60 40 90 0 s60 40 90 0 s60 40 90 0', stroke: '#B4BCCB', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, g);
    const mB = el('path', { d: 'M550 925 c30 -40 60 40 90 0 s60 40 90 0 s60 40 90 0', stroke: '#111318', 'stroke-width': 18, fill: 'none', 'stroke-linecap': 'round' }, g);
    const nH = pill(g, 290, 1060, L.leftNote, { size: 52, fill: C.card, stroke: '#CBD5E1' });
    const nB = pill(g, 690, 1060, L.rightNote, { size: 52, fill: C.card, stroke: C.accent });
    const p0 = pS(si, 0), p1 = pS(si, 1), p2 = pS(si, 2);
    tl.to(clay, { attr: { width: 600 }, duration: .7, ease: 'power2.out' }, p0 + .05); sfx('tick', p0 + .1, .5);
    pop(cH, p0 + .1); drawPath(mH, p0 + .35, .7); pop(nH, wT(si, 2), { sound: 'pop', gain: .6 });
    tl.to(clay, { attr: { width: 170 }, duration: .7, ease: 'power2.out' }, p1 + .05); sfx('tick', p1 + .1, .5);
    pop(cB, p1 + .1); drawPath(mB, p1 + .35, .7); pop(nB, wT(si, 5), { sound: 'pop', gain: .6 });
    const n = sentences[si].words.length;
    [[cH, wT(si, n - 2)], [cB, wT(si, n - 1)]].forEach(([c, t]) => {
      tl.to(c, { scale: 1.14, duration: .18, yoyo: true, repeat: 1, transformOrigin: '50% 50%', ease: 'power2.out' }, t);
      sfx('pop', t, .7);
    });
    const imp = $('obj-imprint'); imp.textContent = L.imprint;
    tl.to(imp, { opacity: 1, duration: .3 }, p2 + .1);
    tl.to(H, { shineX: -560, duration: .01 }, p2);
    tl.set(shine, { opacity: 1 }, p2 + .1);
    tl.to(H, { shineX: 520, duration: .8, ease: 'power2.inOut' }, p2 + .1);
    tl.set(shine, { opacity: 0 }, p2 + .95);
    sfx('chime', wT(si, n - 1) + .1, .8);
    fadeOut(g, T1 - .12, .3);
  },

  // ---------------------------------------------------------------- OUTRO
  outro(si, L) {
    const T0 = sStart(si), T1 = DUR;
    const g = el('g', {}, $('layerMid'));
    sfx('whoosh', T0 - .15, .8);
    heroTo(T0 - .2, { x: 560, y: 800, r: -22, s: 1 }, 1.1, 'back.out(1.2)');
    tl.to(H, { float: 1, duration: .8 }, T0 + .5);
    tl.to(AMB, { spark: .8, duration: .5 }, T0 + .3);
    const cg = el('g', {}, g);
    const num = text(cg, 400, 430, '0', 200, C.accent, 'middle', { filter: 'url(#glow)' });
    pill(cg, 400, 575, L.countLabel, { size: 58, fill: C.card, stroke: C.accent });
    pop(cg, T0, { sound: false });
    counter(num, 0, L.count, T0 + .05, Math.max(.8, wT(si, 2) - T0), v => v, 14);
    const old = el('g', {}, g);
    pill(old, 735, 440, L.oldName, { size: 58, fill: '#1F2433', stroke: '#94A3B8' });
    pop(old, wT(si, L.wrongWord) - .1);
    crossMark(old, 735, 440, 60, wT(si, L.wrongWord) + .2);
    // question
    const p1 = pS(si, 1), p2 = pS(si, 2);
    fadeOut(cg, p1 - .1, .25); fadeOut(old, p1 - .1, .25);
    const q = badgeQ(g, 420, 470, 120, C.accent);
    pop(q, p1, { from: .2 });
    tl.to(q, { rotation: 12, transformOrigin: '50% 50%', duration: .15, yoyo: true, repeat: 3, ease: 'sine.inOut' }, p1 + .45);
    // comment + follow
    const cm = el('g', {}, g);
    el('path', { d: 'M230 1070 h200 a40 40 0 0 1 40 40 v90 a40 40 0 0 1 -40 40 h-110 l-50 44 v-44 h-40 a40 40 0 0 1 -40 -40 v-90 a40 40 0 0 1 40 -40z', fill: '#fff', filter: 'url(#cardShadow)' }, cm);
    [290, 330, 370].forEach(x => el('circle', { cx: x, cy: 1155, r: 13, fill: C.bgMid }, cm));
    const fb = el('g', {}, g);
    pill(fb, 700, 1155, '+ ' + L.follow, { size: 60, fill: C.danger, stroke: '#FFC2CD', sw: 5 });
    pop(cm, p2 - .05); pop(fb, p2 + .15);
    for (let k = 0; k < 4; k++) {
      const t = p2 + .8 + k * .55; if (t > DUR - .3) break;
      tl.to([cm, fb], { scale: 1.08, transformOrigin: '50% 50%', duration: .2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t);
    }
    sfx('chime', p2 + .15, 1);
    fadeOut(q, p2 - .05, .25);
  },
};

// build all scenes
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ================================================================= CAPTIONS
const capBox = $('captions');
const MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => {
    const len = cur.reduce((a, b) => a + b.w.length + 1, 0);
    if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; }
    cur.push(w);
  });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tIn = words[0].t - .08;
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .1 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, tIn));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 28, scale: .82 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .22, ease: 'back.out(2.5)' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      const tEnd = j + 1 < words.length ? words[j + 1].t - .06 : tOut;
      tl.set(s, { color: '#FFFFFF' }, tEnd);
    });
    tl.to(page, { opacity: 0, y: -18, duration: .14 }, tOut);
    tl.set(page, { y: 0 }, tOut + .15);
  });
});

// ================================================================= RENDER (time-only state)
function render(t) {
  NOW = t;
  document.getElementById('cam').setAttribute('transform',
    `translate(540 960) scale(${CAM.s}) translate(${-CAM.x} ${-CAM.y})`);
  heroG.setAttribute('transform', `translate(${H.x} ${H.y + floatY()}) rotate(${H.r}) scale(${H.s})`);
  $('obj-body').setAttribute('opacity', 1 - .82 * H.cut);
  $('obj-interior').setAttribute('opacity', H.cut);
  $('obj-core').setAttribute('opacity', Math.max(H.cut, +$('obj-core').getAttribute('width') > 1 ? 1 : 0));
  shine.setAttribute('x', H.shineX);
  tipGlow.setAttribute('opacity', (.55 + .35 * Math.sin(t * 7)) * Math.max(AMB.spark, .25));
  // tip sparkles
  const [tx, ty] = tipWorld();
  sparks.forEach((p, i) => {
    const age = (t * 1.3 + i / sparks.length) % 1, seed = i * 2.399;
    const x = tx + Math.cos(seed) * age * 110, y = ty + Math.sin(seed) * age * 110 - age * 40;
    p.setAttribute('cx', x.toFixed(1)); p.setAttribute('cy', y.toFixed(1));
    p.setAttribute('r', (7 * (1 - age) + 1).toFixed(1));
    p.setAttribute('opacity', (AMB.spark * (1 - age)).toFixed(3));
  });
  // drifting background
  blobs[0].setAttribute('cx', 300 + 80 * Math.sin(t * .35)); blobs[0].setAttribute('cy', 600 + 60 * Math.cos(t * .3));
  blobs[1].setAttribute('cx', 820 + 70 * Math.cos(t * .28)); blobs[1].setAttribute('cy', 1150 + 90 * Math.sin(t * .33));
  blobs[2].setAttribute('cx', 560 + 60 * Math.sin(t * .5 + 1)); blobs[2].setAttribute('cy', 900 + 50 * Math.sin(t * .4));
  dust.forEach((d, i) => {
    const sp = .02 + (i % 5) * .008, y = (1 - ((t * sp + i / dust.length) % 1)) * 2000 - 40;
    d.setAttribute('cx', ((i * 211) % 1080 + 30 * Math.sin(t * .6 + i)).toFixed(1)); d.setAttribute('cy', y.toFixed(1));
    d.setAttribute('opacity', (.12 + .1 * Math.sin(t * 1.5 + i)).toFixed(3));
  });
  // particle streams into the mixer
  flowDots.forEach((p, i) => {
    const side = i % 2, u = (t * .9 + (i >> 1) / (flowDots.length / 2)) % 1;
    const sx = side ? 730 : 250, sy = 520, cx = side ? 640 : 340, cy = 470, ex = 490, ey = 700;
    const x = (1 - u) * (1 - u) * sx + 2 * u * (1 - u) * cx + u * u * ex, y = (1 - u) * (1 - u) * sy + 2 * u * (1 - u) * cy + u * u * ey;
    p.setAttribute('cx', x.toFixed(1)); p.setAttribute('cy', y.toFixed(1));
    p.setAttribute('opacity', (AMB.flow * Math.sin(Math.PI * u)).toFixed(3));
  });
  const mouth = document.querySelector('.mouth');
  if (mouth) mouth.setAttribute('opacity', (.55 + .45 * AMB.fire * (.8 + .2 * Math.sin(t * 23) * Math.sin(t * 7))).toFixed(3));
}
const flowDots = [];
for (let i = 0; i < 32; i++) flowDots.push(el('circle', { r: 8, fill: i % 2 ? '#EBC08B' : '#596173', opacity: 0 }, $('layerFront')));

// warm up every tween in order so random seeking is exact
tl.seek(DUR, false); tl.seek(0, false); render(0);

window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR;
window.SFX = SFX.sort((a, b) => a.t - b.t);
window.CONFIG = CFG;
window.READY = true;

// preview helpers: ?t=12.3 to freeze a frame, ?play to play with the voice, ?guides for safe zones
const q = new URLSearchParams(location.search);
if (q.has('guides')) {
  const st = $('stage');
  [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => {
    const d = document.createElement('div'); d.className = 'guide';
    Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d);
  });
}
if (q.has('t')) window.seek(parseFloat(q.get('t')));
if (q.has('play')) {
  const a = new Audio(TIM.audio); document.body.addEventListener('click', () => {
    a.currentTime = 0; a.play();
    const loop = () => { window.seek(a.currentTime); if (!a.paused) requestAnimationFrame(loop); }; loop();
  });
}
})();
</script>
