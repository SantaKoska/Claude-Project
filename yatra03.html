// the traveller drives leg i between t0 and t1 (camera follows when follow = 1)

// the camera view that frames a set of legs (mercator bbox), with the route kept in the lower part of the frame (cards sit on top)
function legView(legs, pad = 1.35, tilt = 20) {
  const P = legs.flatMap(i => D.legs[i].pts); const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = Math.max(y1 - y0, (x1 - x0) / .5625) * 1000; const h = Math.max(1.4, span / .728 * pad);
  return camAt((x0 + x1) / 2, (y0 + y1) / 2 - .17 * h / 1000, h, tilt);
}
// the camera view that frames any set of mercator points (route kept in the lower part of the frame)
function ptsView(P, pad = 1.2, tilt = 10) {

}

// one stop: preview dashed line, nav bar, drive (camera follows on short legs, frames the leg on long ones), arrive, place card
