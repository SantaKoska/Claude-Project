<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<title>Low-poly Reel</title>
<meta name="viewport" content="width=1080, initial-scale=1">

<!-- =====================================================================
     CONFIG — low-poly 3D reel template (see .claude/skills/lowpoly-reel).
     With a voice: set "voice", fill "sentences", run tools/build.sh lowpoly_reel.html
     Without a voice it plays as a demo for "demoDuration" seconds.
     ===================================================================== -->
<script id="config" type="application/json">
{
  "title": "Low-poly demo",
  "voice": "",
  "demoDuration": 10,
  "voiceTempo": 1.05,
  "timing": { "phraseGap": 0.22, "sentenceGap": 0.36, "head": 0.08, "tail": 1.4 },
  "music": { "bpm": 92, "chords": ["Dm", "Bb", "F", "C"], "level": 0.85 },
  "font": "FreeSans",
  "world": { "palette": "night", "seed": 23 },
  "palette": { "accent": "#FFC93C", "accent2": "#FF8A5B", "card": "#16224F", "cardStroke": "#5B7BFF", "ink": "#0B1030" },
  "cast": {
    "coder": { "skin": "#E6A47A", "hair": "#2B1E19", "hairStyle": "curly", "top": "#1F1E27", "pants": "#2B3147", "glasses": true, "seed": 1 },
    "friend": { "skin": "#9C6644", "hair": "#14100E", "hairStyle": "short", "top": "#2F6F8F", "collar": "#3D86A8", "pants": "#3A3226", "shoes": "#E8E2D6", "seed": 2 }
  },
  "sentences": []
}
</script>
<!-- ======================= END OF CONFIG ================================ -->

<script id="timings" type="application/json">
{}
</script>

<style>
  html, body { margin: 0; background: #050816; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #gl, #ui { position: absolute; left: 0; top: 0; }
  #capShade { position: absolute; left: 0; right: 0; top: 1180px; height: 740px;
    background: linear-gradient(to bottom, rgba(4,8,30,0) 0%, rgba(4,8,30,.5) 40%, rgba(4,8,30,.65) 100%); }
  #captions { position: absolute; left: 50px; width: 860px; top: 1290px; height: 220px; }
  .page { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center;
    justify-content: center; text-align: center; opacity: 0; }
  .w { display: inline-block; font-weight: 700; font-size: 78px; line-height: 1.32; color: #fff;
    margin: 0 12px; opacity: 0;
    text-shadow: 0 6px 22px rgba(0,0,0,.6), 0 0 3px rgba(0,0,0,.9), 0 2px 0 rgba(0,0,0,.35); }
  svg text { font-weight: 700; }
  .guide { position: absolute; background: rgba(255,0,80,.25); pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <svg id="ui" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#D9A02B"/></linearGradient>
      <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
    </defs>
    <rect width="1080" height="1920" fill="url(#vig)"/>
    <g id="L3"></g>
    <g id="mid"></g>
    <rect id="flash" width="1080" height="1920" fill="#fff" opacity="0"/>
  </svg>
  <div id="capShade"></div>
  <div id="captions"></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/three.min.js"></script>
<script src="lib/lowpoly.js"></script>
<script>
(async function () {
const CFG = JSON.parse(document.getElementById('config').textContent);
const TIM = JSON.parse(document.getElementById('timings').textContent);
const C = CFG.palette, FONT = CFG.font;
const NS = 'http://www.w3.org/2000/svg';
const HAS_VOICE = !!(TIM.phrases && TIM.phrases.length);
const DUR = HAS_VOICE ? TIM.duration : CFG.demoDuration;
const SFX = [];
const $ = id => document.getElementById(id);
window.BEAT = TIM.beat || null;
const BEAT = window.BEAT;
const snapT = t => { if (!BEAT) return t; const g = 30 / BEAT.bpm; return Math.max(0, BEAT.t0 + Math.ceil((t - .08 - BEAT.t0) / g) * g); };
const FREE = new Set(['tick', 'wave', 'dip', 'shimmer']);
const sfx = (type, t, gain = 1) => SFX.push({ type, t: +Math.max(0, FREE.has(type) ? t : snapT(t)).toFixed(3), gain });

await document.fonts.load(`700 80px ${FONT}`, 'മലയാളം');
document.body.style.fontFamily = FONT;

// ---------------------------------------------------------------- 2D overlay helpers
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function text(parent, x, y, str, size, fill, anchor = 'middle', extra = {}) { const t = el('text', Object.assign({ x, y, 'font-size': size, fill, 'text-anchor': anchor, 'font-family': FONT, 'dominant-baseline': 'central' }, extra), parent); t.textContent = str; return t; }
function pill(parent, cx, cy, str, o = {}) {
  const g = el('g', {}, parent), size = o.size || 56, padX = o.padX ?? size * .55, padY = o.padY ?? size * .32;
  const r = el('rect', { fill: o.fill || C.card, stroke: o.stroke || C.cardStroke, 'stroke-width': o.sw ?? 4 }, g);
  const t = text(g, cx, cy, str, size, o.color || '#fff');
  const b = t.getBBox(), w = b.width + padX * 2, h = size * 1.25 + padY * 2;
  r.setAttribute('x', cx - w / 2); r.setAttribute('y', cy - h / 2); r.setAttribute('width', w); r.setAttribute('height', h); r.setAttribute('rx', o.rx ?? h / 2);
  return g;
}
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DUR }, 0);
const hide = e => tl.set(e, { opacity: 0 }, 0);
function pop(e, t, o = {}) { t = snapT(t); tl.set(e, { opacity: 0, scale: o.from ?? .3, transformOrigin: o.origin || '50% 50%' }, 0); tl.to(e, { opacity: 1, scale: 1, duration: o.d || .45, ease: o.ease || 'back.out(2.2)' }, t); if (o.sound !== false) sfx(o.sound || 'pop', t, o.gain ?? .9); }
const fadeOut = (e, t, d = .3) => tl.to(e, { opacity: 0, duration: d }, t);
// labels that follow a 3D point
const L3 = [];
function anchor(v3, dy = 0) { const outer = el('g', {}, $('L3')); const inner = el('g', {}, outer); L3.push({ v: v3, dy, outer }); return inner; }

// ---------------------------------------------------------------- 3D world + cast
const R = LP.renderer($('gl'));
const W = LP.world(R.scene, CFG.world);
const fire = LP.campfire(R.scene, -1.45, 1.45); fire.g.scale.setScalar(.75);
LP.log(R.scene, -.9, 0, 1.3);
const coder = LP.person(R.scene, CFG.cast.coder);
const friend = LP.person(R.scene, CFG.cast.friend);
const lap = LP.laptop(coder.root);
lap.g.position.set(0, .6, .4); lap.g.rotation.x = .05;
const PEOPLE = [coder, friend];
const CAM = { tx: -.6, ty: 1.15, tz: .3, dist: 4.2, yaw: -18, pitch: 8, fov: 30 };

// ---------------------------------------------------------------- shots (demo; replace with voice-driven scenes)
// Shot 1 (0-3.5s): close on the coder typing by the fire, slow push.
Object.assign(coder.S, { x: -.9, z: .05, sit: 1, seat: .44, ry: 18, lean: 10, look: 0, nod: 8, armL: [30, 62, 28], armR: [30, 62, 28] });
Object.assign(friend.S, { x: -4.4, z: .85, ry: 92, walk: 1, speed: .9 });
tl.to(CAM, { dist: 3.3, yaw: -8, duration: 3.5, ease: 'sine.inOut' }, 0);
// typing jitter is in update(); a label pops for the idea
const idea = anchor(new THREE.Vector3(-.9, 2.35, .05)); pill(idea, 0, 0, 'ആശയം!', { size: 54, fill: 'url(#goldG)', stroke: '#FFF3C4', color: C.ink });
pop(idea, 2.2, { sound: 'pop' }); fadeOut(idea, 3.4, .2);
// Shot 2 (3.5-7s): wide, the friend walks into the clearing and waves.
tl.to(CAM, { tx: -3.0, ty: 1.1, tz: .6, dist: 10.5, yaw: 6, pitch: 8, duration: 1.2, ease: 'power2.inOut' }, 3.4);
tl.to(CAM, { tx: -1.6, dist: 8.5, duration: 2.2, ease: 'sine.inOut' }, 4.6);
tl.to(friend.S, { x: -2.0, z: .75, duration: 2.9, ease: 'none' }, 3.6);
tl.to(friend.S, { walk: 0, duration: .25 }, 6.5);
tl.to(friend.S, { ry: 115, duration: .4, ease: 'power2.out' }, 6.5);
tl.set(friend.S, { armL: [150, 25, -35] }, 6.9);
const wave = { a: 0 }; tl.to(wave, { a: 1, duration: 1.2, ease: 'none' }, 6.9);
tl.to(coder.S, { look: -40, nod: 0, armL: [10, 20, 0], duration: .4 }, 6.6);
tl.to(coder.S, { smile: 1, duration: .3 }, 6.8);
sfx('whoosh', 3.4, .7);
// Shot 3 (7-10s): orbit around both, glow and motes.
tl.to(CAM, { tx: -1.45, ty: 1.2, tz: .4, dist: 6.6, yaw: 4, pitch: 10, duration: 3, ease: 'sine.inOut' }, 7.0);
const hi = anchor(new THREE.Vector3(-2.0, 2.4, .75)); pill(hi, 0, 0, 'ഹായ്!', { size: 56, fill: C.card, stroke: C.accent2 });
pop(hi, 7.1, { sound: 'pop' });

// ---------------------------------------------------------------- captions (when a voice is synced)
if (HAS_VOICE) {
  const capBox = $('captions'), MAXCH = 30;
  TIM.phrases.forEach((ph, pi) => {
    const pages = []; let cur = [];
    ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
    if (cur.length) pages.push(cur);
    const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
    pages.forEach((words, k) => {
      const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
      const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
      tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
      words.forEach((w, j) => {
        const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
        tl.set(s, { opacity: 0, y: 28, scale: .82 }, 0);
        tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .22, ease: 'back.out(2.5)' }, Math.max(0, w.t - .06));
        tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
        tl.set(s, { color: '#FFFFFF' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
      });
      tl.to(page, { opacity: 0, y: -18, duration: .1 }, tOut); tl.set(page, { y: 0 }, tOut + .15);
    });
  });
} else {
  $('capShade').style.opacity = .5;
}

// ---------------------------------------------------------------- time-only render
function render(t) {
  // typing hands (small, fast) while seated with the laptop
  if (coder.S.sit > .5 && coder.S.armL && coder.S.armL[0] > 25) { coder.S.armL = [30 + Math.sin(t * 9) * 2, 62 + Math.sin(t * 13) * 4, 28]; coder.S.armR = [30 + Math.cos(t * 9) * 2, 62 + Math.cos(t * 11) * 4, 28]; }
  if (friend.S.armL && friend.S.armL[0] > 140) friend.S.armL = [150, 25 + 25 * Math.sin(t * 9), -35];
  W.update(t); fire.update(t);
  PEOPLE.forEach(p => p.update(t, p.speakFn ? p.speakFn(t) : 0));
  lap.screen.material.color.setStyle(Math.sin(t * 7.3) > .6 ? '#FFD3A0' : '#FFC58A');
  LP.orbit(R.camera, CAM);
  R.render();
  L3.forEach(l => { const s = LP.toScreen(R.camera, new THREE.Vector3(l.v.x, l.v.y + l.dy, l.v.z)); l.outer.setAttribute('transform', `translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})`); });
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
</script>
</body>
</html>
