<script>
(async function () {
const CFG = JSON.parse(document.getElementById('config').textContent);
const TIM = JSON.parse(document.getElementById('timings').textContent);
const C = CFG.palette, FONT = CFG.font, G = CFG.geo;
const NS = 'http://www.w3.org/2000/svg';
const DUR = TIM.duration;
const SFX = [];
const $ = id => document.getElementById(id);

const land = window.LAND50;

// ------------------------------------------------------------ 2D helpers
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function text(parent, x, y, str, size, fill, anchor = 'middle', extra = {}) {

}
function pill(parent, cx, cy, str, o = {}) {
  const g = el('g', {}, parent), size = o.size || 56, padX = o.padX ?? size * .55, padY = o.padY ?? size * .32;
  const r = el('rect', { fill: o.fill || C.card, stroke: o.stroke || C.cardStroke, 'stroke-width': o.sw ?? 4 }, g);

  g.box = { w, h }; g.label = t; g.rect = r; return g;
}

// ------------------------------------------------------------ timing helpers
const sentences = CFG.sentences.map((s, si) => {
  const ph = TIM.phrases.filter(p => p.sentence === si);
  return Object.assign({}, s, { ph, words: ph.flatMap(p => p.words) });
});
const sStart = si => sentences[si].ph[0].start;
const sEnd = si => si + 1 < sentences.length ? sStart(si + 1) : DUR;
const pS = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].start;
const pE = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].end;
const wT = (si, k) => { const w = sentences[si].words; return w[Math.max(0, Math.min(k, w.length - 1))].t; };

const lastW = si => wT(si, sentences[si].words.length - 1);
const speak = (si, t) => { for (const w of sentences[si].words) { const d = t - w.t; if (d >= 0 && d < .2) return Math.sin(Math.PI * d / .2); } return 0; };

const tl = gsap.timeline({ paused: true });

}

// ------------------------------------------------------------ THREE: renderer / scene
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, preserveDrawingBuffer: true });

const scene = new THREE.Scene();

const sun = new THREE.DirectionalLight(0xFFF1D0, 1.5); sun.position.set(-40, 70, 30); scene.add(sun);

const px = lon => (lon - G.lon0) * G.kx, pz = lat => -(lat - G.lat0);
const W = (lon, lat, y = 0) => new THREE.Vector3(px(lon), y, pz(lat));
const ROME = W(...CFG.places.rome), KER = W(...CFG.places.kerala), VIE = W(...CFG.places.vienna);

// sea
const seaMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uA: { value: new THREE.Color('#0A2E78') }, uB: { value: new THREE.Color('#1BA6BC') } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
  fragmentShader: `varying vec3 vW; uniform float uTime; uniform vec3 uA; uniform vec3 uB;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    void main(){
      vec2 p = vW.xz;
      float g = n(p*.06 + vec2(uTime*.02, 0.)) * .6 + n(p*.18 - vec2(0., uTime*.03)) * .4;
      vec3 c = mix(uA, uB, smoothstep(.2,.9,g));
      float l = sin((p.x*1.3 + p.y*.8)*.7 + uTime*.9 + n(p*.3)*6.);
      c += vec3(.55,.8,.95) * smoothstep(.94,1.,l) * .16;
      c += vec3(1.) * smoothstep(.985,1., n(p*1.7 + uTime*.35)) * .35;
      gl_FragColor = vec4(c, 1.);
    }`
});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(520, 380), seaMat); sea.rotation.x = -Math.PI / 2; sea.position.set(0, 0, 0); scene.add(sea);

// land (Natural Earth 50m, extruded)
{
  const f = topojson.feature(land, land.objects.land);
  const geos = f.features ? f.features.map(x => x.geometry) : [f.geometry];
  const polys = geos.flatMap(gm => gm.type === 'MultiPolygon' ? gm.coordinates : [gm.coordinates]);
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const topM = new THREE.MeshLambertMaterial({ color: 0xE6C58A }), sideM = new THREE.MeshLambertMaterial({ color: 0xA9763F });
  const geoms = [];
  polys.forEach(poly => {
    const inRegion = poly[0].some(([lo, la]) => lo > -30 && lo < 125 && la > -30 && la < 70);
    if (!inRegion) return;
    const mkRing = r => r.map(([lo, la]) => new THREE.Vector2(px(cl(lo, -30, 130)), cl(la, -30, 72) - G.lat0));
    const shape = new THREE.Shape(mkRing(poly[0]));
    for (let i = 1; i < poly.length; i++) shape.holes.push(new THREE.Path(mkRing(poly[i])));
    const g = new THREE.ExtrudeGeometry(shape, { depth: .4, bevelEnabled: false });

}

// markers
const mkPin = (color) => {
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.7, 2.2, 20), new THREE.MeshPhongMaterial({ color, shininess: 80 })); cone.rotation.x = Math.PI; cone.position.y = 1.1; g.add(cone);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.85, 20, 14), new THREE.MeshPhongMaterial({ color, shininess: 90 })); ball.position.y = 2.7; g.add(ball);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.6, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .8, side: THREE.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.y = .08; g.add(ring);
  g.userData.ring = ring; return g;
};
const pinK = mkPin(0xFF4D6D); pinK.position.set(KER.x, .45, KER.z); scene.add(pinK);
const pinV = mkPin(0x4CC9F0); pinV.position.set(VIE.x, .45, VIE.z); scene.add(pinV);
// Rome: gold coin stack
const romeStack = new THREE.Group(); romeStack.position.set(ROME.x, .45, ROME.z);

for (let i = 0; i < 9; i++) { const c = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, .32, 28), goldM); c.position.y = .2 + i * .34; c.rotation.y = i * .7; romeStack.add(c); }

const beacon = new THREE.Mesh(new THREE.CylinderGeometry(.55, 1.4, 40, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0xFFD166, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
beacon.position.set(KER.x, 20.5, KER.z); scene.add(beacon);

// glow sprite texture (drawn in code)
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,224,150,1)'); g.addColorStop(.35, 'rgba(255,190,70,.5)'); g.addColorStop(1, 'rgba(255,190,70,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();

// pepper spike at Kerala (stem + peppercorns + leaves)
const pepper = new THREE.Group(); pepper.position.set(KER.x + 1.6, .45, KER.z - .3);
{
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const stemPts = [new THREE.Vector3(0, 6, 0), new THREE.Vector3(.5, 4.6, .2), new THREE.Vector3(.4, 3, -.1), new THREE.Vector3(-.1, 1.5, .1)];
  const stem = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(stemPts), 20, .12, 8), new THREE.MeshLambertMaterial({ color: 0x5A7A2B })); pepper.add(stem);
  const pm = new THREE.MeshPhongMaterial({ color: 0x151515, shininess: 90, specular: 0x666666 });
  const corn = new THREE.InstancedMesh(new THREE.SphereGeometry(.34, 14, 10), pm, 36); const m4 = new THREE.Matrix4();
  for (let i = 0; i < 36; i++) { const u = i / 36, p = new THREE.CatmullRomCurve3(stemPts).getPoint(.15 + u * .8); m4.makeTranslation(p.x + (rnd() - .5) * .9, p.y + (rnd() - .5) * .3, p.z + (rnd() - .5) * .9); corn.setMatrixAt(i, m4); }
  pepper.add(corn);
  const lm = new THREE.MeshLambertMaterial({ color: 0x2E7D32, side: THREE.DoubleSide });
  for (let i = 0; i < 4; i++) { const lf = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), lm); lf.scale.set(1.0, .06, .5); lf.position.set(Math.cos(i * 1.6) * 1.0, 5.7 - i * .1, Math.sin(i * 1.6) * .8); lf.rotation.set(0, i * 1.6, .35); pepper.add(lf); }
  const gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); gl.scale.set(9, 9, 1); gl.position.y = 3.4; pepper.add(gl); pepper.userData.glow = gl;
}
scene.add(pepper);

// route
const routePts = CFG.places.route.map(([lo, la]) => W(lo, la, .45));
const curve = new THREE.CatmullRomCurve3(routePts, false, 'catmullrom', .3);
const TUBE_SEG = 400, TUBE_RAD = 6;
const tubeGeo = new THREE.TubeGeometry(curve, TUBE_SEG, .2, TUBE_RAD, false);
const tube = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color: 0xFFD166 })); scene.add(tube);
tubeGeo.setDrawRange(0, 0);

// ship
const ship = new THREE.Group(); scene.add(ship);
const shipBody = new THREE.Group(); ship.add(shipBody);
let sailGeo;
{
  const sh = new THREE.Shape(); sh.moveTo(1.8, 0); sh.quadraticCurveTo(1.3, .8, -.8, .85); sh.lineTo(-1.7, .55); sh.lineTo(-1.7, -.55); sh.lineTo(-.8, -.85); sh.quadraticCurveTo(1.3, -.8, 1.8, 0);
  const hg = new THREE.ExtrudeGeometry(sh, { depth: .7, bevelEnabled: true, bevelSize: .1, bevelThickness: .08, bevelSegments: 2 }); hg.rotateX(-Math.PI / 2);
  const hull = new THREE.Mesh(hg, [new THREE.MeshLambertMaterial({ color: 0xB9824B }), new THREE.MeshLambertMaterial({ color: 0x7A4A22 })]); hull.position.y = -.15; shipBody.add(hull);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(2.9, .06, 1.1), new THREE.MeshLambertMaterial({ color: 0xE3B879 })); deck.position.set(-.1, .58, 0); shipBody.add(deck);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(3.3, .14, 1.75), new THREE.MeshLambertMaterial({ color: 0xD62839 })); stripe.position.set(-.05, .3, 0); stripe.scale.set(1, 1, .96); shipBody.add(stripe);
  const wood = new THREE.MeshLambertMaterial({ color: 0x6B4423 });
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(.07, .09, 3.6, 10), wood); mast.position.set(.1, 2.4, 0); shipBody.add(mast);
  const yard = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, 2.5, 8), wood); yard.rotation.x = Math.PI / 2; yard.position.set(.1, 3.7, 0); shipBody.add(yard);
  sailGeo = new THREE.PlaneGeometry(2.3, 2.5, 10, 10); sailGeo.rotateY(Math.PI / 2); sailGeo.userData.base = sailGeo.attributes.position.array.slice();
  const sail = new THREE.Mesh(sailGeo, new THREE.MeshLambertMaterial({ color: 0xFBF1D6, emissive: 0x8A8068, side: THREE.DoubleSide })); sail.position.set(.15, 2.4, 0); shipBody.add(sail);
  const sailStripe = new THREE.Mesh(new THREE.PlaneGeometry(.55, 2.5, 1, 1), new THREE.MeshLambertMaterial({ color: 0xC1121F, side: THREE.DoubleSide })); sailStripe.rotation.y = Math.PI / 2; sailStripe.position.set(.5, 2.4, 0); sailStripe.visible = false; shipBody.add(sailStripe);
  const flag = new THREE.Mesh(new THREE.ConeGeometry(.22, .9, 3), new THREE.MeshLambertMaterial({ color: 0xFFC93C })); flag.rotation.z = Math.PI / 2; flag.position.set(-.5, 4.3, 0); shipBody.add(flag);
  const sack = new THREE.MeshLambertMaterial({ color: 0xBFA06A }), cap = new THREE.MeshPhongMaterial({ color: 0x151515 });
  [[-1.1, .85, .35], [-1.1, .85, -.35], [-.7, .85, .4], [-.7, .85, -.4], [-1.1, 1.3, 0], [-1.4, .85, 0]].forEach(([x, y, z]) => {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(.26, .32, .55, 10), sack); b.position.set(x, y, z); b.name = 'sack'; shipBody.add(b);
    const c = new THREE.Mesh(new THREE.SphereGeometry(.22, 10, 8), cap); c.position.set(x, y + .3, z); c.name = 'sack'; shipBody.add(c);
  });
}
const wake = new THREE.InstancedMesh(new THREE.SphereGeometry(.28, 8, 6), new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: .55 }), 26); scene.add(wake);

// coins
const COIN_N = 60;
const coinMat = new THREE.MeshPhongMaterial({ color: 0xFFC93C, emissive: 0x6A4300, shininess: 120, specular: 0xFFFFFF });
const coins = new THREE.InstancedMesh(new THREE.CylinderGeometry(.55, .55, .14, 20), coinMat, COIN_N); scene.add(coins);
const burst = new THREE.InstancedMesh(new THREE.CylinderGeometry(.5, .5, .13, 18), coinMat, 36); scene.add(burst);

// ------------------------------------------------------------ 3D state (tweened) + time-only render
const CAM3 = { tx: ROME.x + 2, ty: 1.5, tz: ROME.z + 5, dist: 12, pitch: 30, yaw: -22, follow: 0 };
const SH = { u: 0, vis: 0, sacks: 0 }, RT = { u: 0 }, FLOW = { n: 0, vis: 1 }, PEP = { s: 0 }, PINS = { k: 0, v: 0, rome: 1, beacon: 0 }, BURST = { t0: 9999 };
const DIM = { v: 0 };
const L3 = [];                                          // world-anchored overlay labels
function anchor(v3, dy = 3) { const outer = el('g', {}, $('L3')); const inner = el('g', {}, outer); L3.push({ v: v3.clone(), dy, outer }); return inner; }
const tmp = new THREE.Vector3();
const bez = (a, b, u, h, out) => { out.lerpVectors(a, b, u); out.y += h * 4 * u * (1 - u) + .8; return out; };
const dummy = new THREE.Object3D();

function render(t) {
  seaMat.uniforms.uTime.value = t;
  // ship
  const su = Math.max(0, Math.min(1, SH.u)), sp = curve.getPointAt(su), st = curve.getTangentAt(su);
  ship.position.set(sp.x, 0, sp.z);
  ship.rotation.set(0, Math.atan2(-st.z, st.x), 0);
  shipBody.position.y = .25 + Math.sin(t * 2.1) * .09; shipBody.rotation.set(Math.sin(t * 1.7) * .05, 0, Math.sin(t * 1.3) * .035);

    pill(bar, 330, 650, L.pepper, { size: 44, fill: '#101010', stroke: '#fff' }); pill(bar, 800, 650, L.other, { size: 40, fill: C.card, stroke: C.accent });
    fadeIn(bar, t1, .25); sfx('whoosh', t1 + .2, .5);
    const tw = pill(g, 540, 750, L.twoThirds, { size: 62, fill: 'url(#goldG)', stroke: '#FFF3C4', color: C.ink });
    pop(tw, wT(si, wIdx(si, 1, 1)), { from: 2, ease: 'power4.out', d: .3, sound: 'thud' }); hit(wT(si, wIdx(si, 1, 1))); sfx('chime', lastW(si), .7);
    fadeOut(g, T1 - .12, .25);
  },

  // ------------------------------------------------------------ 7 PATTANAM
  pattanam(si, L) {
    const T0 = sStart(si), T1 = sEnd(si), g = el('g', {}, $('mid'));
    sfx('whoosh', T0 - .1, .6); to(SH, T0 - .1, { vis: 0 }, .3); to(DIM, T0 - .1, { v: .3 }, .4); to(PINS, T0, { k: 1 }, .3);
    cam(T0 - .1, { tx: KER.x - .5, tz: KER.z - .5, ty: 1, dist: 15, pitch: 40, yaw: -25 }, 1.1, 'power3.inOut');
    const dg = person({ hairStyle: 'bun', hair: '#2B1B12', skin: '#8D5A3B', top: '#2DD4BF', topStyle: 'tee', pants: '#7A5A2A', shoes: '#4A2E12' }, { x: 260, y: 1245, s: 1.1, face: 1, smile: .8, lean: 14, armN: [60, 30], armF: [50, 20] });
    hide(dg.g); tl.to(dg.g, { opacity: 1, duration: .25 }, T0);
    const dig = { a: 0 }; const dugAt = pS(si, 0);
    // digging motion (time-only): arms swing, body leans
    dg.speakFn = null; dg.digFn = t => { const s = Math.sin(t * 7); dg.S.armN = [35 + 30 * s, 20 + 25 * s]; dg.S.armF = [30 + 28 * s, 25 + 25 * s]; dg.S.lean = 10 + 8 * s; };
    PPL.digs = (PPL.digs || []).concat(dg);
    const mound = el('g', {}, g); el('ellipse', { cx: 560, cy: 1230, rx: 230, ry: 34, fill: '#7B5A33' }, mound); el('ellipse', { cx: 560, cy: 1222, rx: 150, ry: 18, fill: '#5A3F21' }, mound);
    fadeIn(mound, T0, .3);
    const pl = anchor(KER, 6); pill(pl, 0, -30, L.place, { size: 56, fill: C.card, stroke: C.accent }); pop(pl, T0 + .3, { gain: .6 });
    // finds pop out of the ground
    const cw = wT(si, wIdx(si, 0, 5)), pw = wT(si, wIdx(si, 0, 7));
    const c1 = el('g', {}, g); coinSvg(c1, 520, 1130, 46); pop(c1, cw, { from: .1, sound: 'coin' }); tl.to(c1, { y: -90, duration: .4, ease: 'power2.out' }, cw); tl.to(c1, { y: -60, duration: .3 }, cw + .4);
    pill(g, 520, 1075, L.coin, { size: 40, fill: C.card, stroke: C.accent }); const cl = g.lastChild; pop(cl, cw + .25, { gain: .5 });
    const c2 = el('g', {}, g); el('path', { d: 'M-34 -44 Q-54 -4 -34 40 Q0 56 34 40 Q54 -4 34 -44 Q36 -60 22 -62 L-22 -62 Q-36 -60 -34 -44Z', fill: '#C0663B', stroke: '#7A3A1C', 'stroke-width': 5 }, c2); el('path', { d: 'M-40 -8 H40', stroke: '#7A3A1C', 'stroke-width': 5 }, c2);
    c2.setAttribute('transform', 'translate(700 1140)'); const c2w = el('g', {}, g); c2w.appendChild(c2);
    pop(c2w, pw, { from: .1, sound: 'pop', origin: '700px 1140px' }); tl.to(c2w, { y: -80, duration: .4, ease: 'power2.out' }, pw);
    pill(g, 800, 1075, L.pot, { size: 40, fill: C.card, stroke: '#FF9A62' }); const pt = g.lastChild; pop(pt, pw + .25, { gain: .5 });
    // the claim
    const t1 = pS(si, 1), gs = pill(g, 540, 560, L.guess, { size: 100, fill: 'url(#goldG)', stroke: '#FFF3C4', color: C.ink, sw: 7 });
    pop(gs, wT(si, wIdx(si, 1, 1)), { from: 2.2, ease: 'power4.out', d: .3, sound: 'thud' }); hit(wT(si, wIdx(si, 1, 1))); flash(wT(si, wIdx(si, 1, 1)), .4); sfx('chime', lastW(si) - .1, .8);
    fadeOut(g, T1 - .12, .25); fadeOut(dg.g, T1 - .12, .25); fadeOut(pl, T1 - .12, .25);
  },

  // ------------------------------------------------------------ 8 FINALE
  finale(si, L) {
    const T0 = sStart(si), g = el('g', {}, $('mid'));
    sfx('whoosh', T0 - .1, .8); to(DIM, T0 - .1, { v: 0 }, .4); to(PINS, T0, { k: 1 }, .1);
    to(FLOW, T0, { vis: 1 }, .5); to(PINS, T0 + .3, { beacon: 1, rome: .6 }, 1.2, 'power2.out');
    cam(T0 - .1, { tx: -4, tz: -2, ty: 1, dist: 130, pitch: 58, yaw: 0 }, DUR - T0 + .2, 'power1.inOut');
    sfx('shimmer', T0 + .3, .7); hit(T0);
    const t1 = text(g, 520, 430, L.t1, 112, C.accent, 'middle', { filter: 'url(#glow)' });
    pop(t1, wT(si, 1), { from: 1.8, ease: 'power4.out', d: .35, sound: 'thud' }); flash(wT(si, 1), .4);
    const t2 = text(g, 520, 560, L.t2, 62, '#fff', 'middle', { filter: 'url(#glow)' });
    pop(t2, pS(si, 1) + .1, { sound: 'pop' }); sfx('chime', lastW(si) - .3, 1); sfx('chime', lastW(si) + .1, .8);
    for (let k = 0; k < 3; k++) { const rg = el('circle', { cx: 540, cy: 520, r: 120, fill: 'none', stroke: C.accent, 'stroke-width': 8, opacity: 0 }, g); const tt = pS(si, 1) + .1 + k * .35; tl.set(rg, { opacity: .8 }, tt); tl.to(rg, { attr: { r: 420 }, opacity: 0, duration: 1, ease: 'power2.out' }, tt); }
  },
};
let DIM_OFF_AT = 0;
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));
to(DIM, DIM_OFF_AT, { v: 0 }, .01);

// ------------------------------------------------------------ captions
const capBox = $('captions'), MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 28, scale: .82 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .22, ease: 'back.out(2.5)' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#FFFFFF' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, y: -18, duration: .1 }, tOut); tl.set(page, { y: 0 }, tOut + .15);
  });
});

// ------------------------------------------------------------ time-only seek
const wrapRender = t => { (PPL.digs || []).forEach(d => d.digFn(t)); render(t); };
tl.seek(DUR, false); tl.seek(0, false); wrapRender(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); wrapRender(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
