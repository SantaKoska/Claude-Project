<script>

    for (let r = 0; r < 7; r++) for (let c = 0; c < 9; c++) { const w = el('rect', { x: 120 + c * 96, y: 700 + r * 62, width: 64, height: 40, rx: 4, fill: '#FFD27A' }, wg); wins.push(w); }
    el('rect', { x: 100, y: 680, width: 880, height: 450, fill: 'none', stroke: '#2A3B55', 'stroke-width': 10 }, wg);
    text(g, 540, 300, L.title, 48, '#9FB3CC', 'middle', { 'letter-spacing': 8 });
    const num = text(g, 540, 420, '90,000', 140, '#FFFFFF'), yr = text(g, 540, 560, '1970', 70, C.accent);
    const order = wins.map((w, i) => [w, Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1]).sort((a, b) => a[1] - b[1]);
    const t1 = pS(si, 1), t2 = pS(si, 2), off = Math.round(wins.length * (1 - 28 / 90));
    order.slice(0, off).forEach(([w], i) => tl.to(w, { attr: { fill: '#1C2A3E' }, duration: .08 }, T0 + .3 + (t2 + 1.2 - T0 - .3) * i / off));
    counter(num, 90000, 28000, t2 - .1, 1.4, v => Math.round(v / 1000) * 1000 === 28000 && v < 28500 ? '28,000' : (Math.round(v / 1000) * 1000).toLocaleString('en-US'), 10);
    const yo = { y: 1970 }; tl.to(yo, { y: 1988, duration: 1.4, ease: 'power2.out', onUpdate: () => yr.textContent = String(Math.round(yo.y)) }, t2 - .1);
    pop(num, t1);
    show(g, T0 - .05, .3); tl.set(g, { opacity: 0 }, sEnd(si) - .03); camSet(T0 - .05, { s: 1, x: 0, y: 0 }); camTo(T0, { s: 1.06, y: -20 }, sEnd(si) - T0);
  },
  callback(si, L) {
    const T0 = sStart(si);
    shot3(T0 - .05, { hero: 1, heroGlow: .5, heroVib: 1, bg: '#F2E4CC', orbit: -6 }, { px: -3, py: 24, pz: 34, tx: 1, ty: 0, tz: 0, fov: 34 });
    go3(pS(si, 1), { heroGlow: 1.2 }, .6, 'power2.out');
    m3(T0, { py: 16, pz: 24 }, DUR - T0, 'sine.out');
    const o = el('g', {}, $('front')); tl.set(o, { opacity: 0 }, 0); tl.set(o, { opacity: 1 }, T0 - .05);
    const e = pill(o, 540, 420, L.end, 92, '#FFFFFF', '#14181D', 54); slam(e, pS(si, 1) + .05);
    sfx('chime', lastW(si) + .1, .9);
  },
};

sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));
W3.setRate(RATE);
// mechanical tick on every beat while the balance runs in real time
TICKS.forEach(([a, b]) => { let last = Math.floor(W3.clock(a) * 8); for (let t = a; t < b; t += 1 / 60) { const k = Math.floor(W3.clock(t) * 8); if (k !== last) { sfx('tick', t, .28); last = k; } } });

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 24;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, duration: .15 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
function render(t) {
  $('cam').setAttribute('transform', `translate(540 960) scale(${CAM.s}) rotate(${CAM.r}) translate(${-540 + CAM.x} ${-960 + CAM.y})`);
  $('leakC').setAttribute('cx', (900 + 140 * Math.sin(t * .23)).toFixed(1)); $('leakC').setAttribute('cy', (320 + 120 * Math.cos(t * .19)).toFixed(1));
  document.querySelectorAll('.secT').forEach(l => { const cx = +l.getAttribute('data-cx'); l.setAttribute('transform', `rotate(${Math.floor(t) * 6} ${cx} 820)`); });
  document.querySelectorAll('.secS').forEach(l => { const cx = +l.getAttribute('data-cx'); l.setAttribute('transform', `rotate(${(t * 48) % 360} ${cx} 820)`); });
  PPL.forEach(p => p.render(t, 0));
  W3.render(t);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
</script>
