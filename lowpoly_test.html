<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low-poly night test</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<style>html,body{margin:0;background:#0A1430}#c{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="vendor/three.min.js"></script>
<script>
// Original low-poly night scene. Time-only: render(t) is deterministic.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#121F48');
scene.fog = new THREE.Fog('#16275A', 10, 45);
const cam = new THREE.PerspectiveCamera(30, 1080 / 1920, .1, 200);

// ---------- lights
scene.add(new THREE.HemisphereLight('#8FB0FF', '#0A1230', .7));
const moonL = new THREE.DirectionalLight('#AFC6FF', 1.1); moonL.position.set(-6, 12, -4); moonL.castShadow = true;
moonL.shadow.mapSize.set(2048, 2048); moonL.shadow.camera.left = -8; moonL.shadow.camera.right = 8; moonL.shadow.camera.top = 8; moonL.shadow.camera.bottom = -8; scene.add(moonL);
const warm = new THREE.PointLight('#FFB36A', 3.5, 6, 2); warm.position.set(0, 1.5, 1.6); scene.add(warm);
const rim = new THREE.DirectionalLight('#6AA8FF', .8); rim.position.set(4, 5, -6); scene.add(rim);

const flat = (color, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: true, roughness: .9, metalness: 0 }, extra));

// ---------- ground (faceted, snow-blue)
const gGeo = new THREE.PlaneGeometry(50, 50, 18, 18); gGeo.rotateX(-Math.PI / 2);
const gp = gGeo.attributes.position;
for (let i = 0; i < gp.count; i++) { const x = gp.getX(i), z = gp.getZ(i); const d = Math.hypot(x, z); gp.setY(i, (d > 2.2 ? Math.sin(x * .7) * .22 + Math.cos(z * .6) * .18 : 0) - d * .015); }
gGeo.computeVertexNormals();
const ground = new THREE.Mesh(gGeo, flat('#22407A')); ground.receiveShadow = true; scene.add(ground);

// ---------- pine trees
const TREE_COL = ['#1C4F70', '#22627F', '#19456A', '#276A8C'];
function tree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.09 * s, .12 * s, .9 * s, 5), flat('#3B2A22')); trunk.position.y = .45 * s; g.add(trunk);
  for (let k = 0; k < 4; k++) {
    const r = (1.25 - k * .24) * s, h = (1.3 - k * .1) * s;
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), flat(TREE_COL[(Math.abs(Math.round(x * 3)) + k) % 4]));
    c.position.y = (1.0 + k * .72) * s; c.rotation.y = k * .4; c.castShadow = true; c.receiveShadow = true; g.add(c);
  }
  g.position.set(x, 0, z); scene.add(g); return g;
}
const rnd = (() => { let s = 23; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
for (let i = 0; i < 34; i++) {
  const a = rnd() * Math.PI * 2, r = 5 + rnd() * 11;
  const x = Math.cos(a) * r, z = Math.sin(a) * r - 3;
  if (z > 1.5 && Math.abs(x) < 3) continue;
  tree(x, z, .7 + rnd() * 1.1);
}

// ---------- moon + stars
const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(1.3, 40), new THREE.MeshBasicMaterial({ color: '#F6F8FF' })); moonDisc.position.set(-4.5, 11, -24); scene.add(moonDisc);
const moonCut = new THREE.Mesh(new THREE.CircleGeometry(1.2, 40), new THREE.MeshBasicMaterial({ color: '#121F48' })); moonCut.position.set(-3.9, 11.35, -23.9); scene.add(moonCut);
const stars = new THREE.InstancedMesh(new THREE.SphereGeometry(.05, 6, 4), new THREE.MeshBasicMaterial({ color: '#DCE6FF' }), 90);
const dm = new THREE.Object3D();
for (let i = 0; i < 90; i++) { dm.position.set((rnd() - .5) * 60, 6 + rnd() * 14, -20 - rnd() * 12); dm.scale.setScalar(.6 + rnd() * 1.2); dm.updateMatrix(); stars.setMatrixAt(i, dm.matrix); }
scene.add(stars);

// ---------- floating glow motes
const motes = new THREE.InstancedMesh(new THREE.OctahedronGeometry(.045, 0), new THREE.MeshBasicMaterial({ color: '#FFE2A8' }), 70);
scene.add(motes);

// ---------- character (original low-poly person)
const P = new THREE.Group(); scene.add(P);
const skin = flat('#E6A47A'), hair = flat('#2B1E19'), shirt = flat('#15141C', { roughness: 1 }), collar = flat('#2C2B36'), pants = flat('#2B3147'), shoe = flat('#1B1A20');
const cast = m => { m.castShadow = true; m.receiveShadow = true; return m; };
// seated torso
const torso = cast(new THREE.Mesh(new THREE.CylinderGeometry(.48, .58, 1.25, 7), shirt)); torso.position.y = 1.45; P.add(torso);
const neckCollar = cast(new THREE.Mesh(new THREE.CylinderGeometry(.3, .5, .25, 7), collar)); neckCollar.position.y = 2.1; P.add(neckCollar);
const neck = cast(new THREE.Mesh(new THREE.CylinderGeometry(.14, .16, .25, 6), skin)); neck.position.y = 2.22; P.add(neck);
// head: icosahedron with slight jaw taper
const head = cast(new THREE.Mesh(new THREE.IcosahedronGeometry(.5, 1), skin)); head.position.y = 2.75; head.scale.set(.95, 1.05, .95); P.add(head);
// hair cap, swept, with fringe pieces
const hairCap = cast(new THREE.Mesh(new THREE.IcosahedronGeometry(.56, 1), hair)); hairCap.scale.set(1, .75, 1); hairCap.position.set(0, 2.98, -.05); P.add(hairCap);
[[-.32, 3.02, .32, .25], [.05, 3.08, .4, .22], [.36, 2.98, .3, .22], [-.5, 2.8, .05, .2], [.5, 2.78, .05, .2]].forEach(([x, y, z, s]) => { const tuft = cast(new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), hair)); tuft.position.set(x, y, z); P.add(tuft); });
// ears
[-.5, .5].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(.09, 6, 5), skin); e.position.set(x, 2.72, 0); P.add(e); });
// eyes (white + pupil), brows, nose, mouth
[-.17, .17].forEach(x => {
  const w = new THREE.Mesh(new THREE.SphereGeometry(.055, 8, 6), new THREE.MeshStandardMaterial({ color: '#F7F2EA', roughness: .4 })); w.position.set(x, 2.78, .44); P.add(w);
  const pu = new THREE.Mesh(new THREE.SphereGeometry(.03, 8, 6), new THREE.MeshStandardMaterial({ color: '#15110F' })); pu.position.set(x, 2.775, .495); P.add(pu);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(.13, .04, .05), skin); lid.position.set(x, 2.815, .47); P.add(lid);
  const br = new THREE.Mesh(new THREE.BoxGeometry(.16, .03, .04), hair); br.position.set(x, 2.9, .45); br.rotation.z = x < 0 ? -.15 : .15; P.add(br);
});
const nose = new THREE.Mesh(new THREE.ConeGeometry(.06, .14, 4), skin); nose.rotation.x = Math.PI / 2; nose.position.set(0, 2.7, .52); P.add(nose);
const mouth = new THREE.Mesh(new THREE.BoxGeometry(.14, .025, .03), new THREE.MeshStandardMaterial({ color: '#7A3A3A' })); mouth.position.set(0, 2.58, .48); P.add(mouth);
// glasses: two frames + bridge + arms
const frameMat = new THREE.MeshStandardMaterial({ color: '#3F2E28', roughness: .5 });
[-.17, .17].forEach(x => {
  const f = new THREE.Mesh(new THREE.TorusGeometry(.11, .018, 6, 14), frameMat); f.position.set(x, 2.78, .47); P.add(f);
  const lens = new THREE.Mesh(new THREE.CircleGeometry(.1, 14), new THREE.MeshStandardMaterial({ color: '#9FC4FF', transparent: true, opacity: .22, roughness: .1 })); lens.position.set(x, 2.78, .475); P.add(lens);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(.03, .02, .4), frameMat); arm.position.set(x < 0 ? -.3 : .3, 2.79, .25); P.add(arm);
});
const bridge = new THREE.Mesh(new THREE.BoxGeometry(.1, .02, .02), frameMat); bridge.position.set(0, 2.79, .49); P.add(bridge);
// legs seated: thighs forward, shins down
const thighL = cast(new THREE.Mesh(new THREE.CylinderGeometry(.17, .19, .9, 6), pants)); thighL.rotation.x = Math.PI / 2 - .1; thighL.position.set(-.22, .95, .45); P.add(thighL);
const thighR = thighL.clone(); thighR.position.x = .22; P.add(thighR);
const shinL = cast(new THREE.Mesh(new THREE.CylinderGeometry(.15, .16, .85, 6), pants)); shinL.position.set(-.22, .45, .88); P.add(shinL);
const shinR = shinL.clone(); shinR.position.x = .22; P.add(shinR);
[-.22, .22].forEach(x => { const s = cast(new THREE.Mesh(new THREE.BoxGeometry(.24, .14, .4), shoe)); s.position.set(x, .07, .98); P.add(s); });
// arms bent toward the laptop
function arm(side) {
  const g = new THREE.Group(); g.position.set(side * .5, 1.95, .15);
  const upper = cast(new THREE.Mesh(new THREE.CylinderGeometry(.13, .12, .6, 6), shirt)); upper.position.y = -.3; g.add(upper);
  const elbow = new THREE.Group(); elbow.position.y = -.6; g.add(elbow);
  const fore = cast(new THREE.Mesh(new THREE.CylinderGeometry(.11, .1, .6, 6), shirt)); fore.rotation.x = Math.PI / 2; fore.position.z = .3; elbow.add(fore);
  const cuff = cast(new THREE.Mesh(new THREE.CylinderGeometry(.115, .11, .12, 6), collar)); cuff.rotation.x = Math.PI / 2; cuff.position.z = .58; elbow.add(cuff);
  const hand = cast(new THREE.Mesh(new THREE.DodecahedronGeometry(.085, 0), skin)); hand.position.z = .68; elbow.add(hand);
  g.rotation.z = -side * .12; g.rotation.x = .35;
  P.add(g); return { g, elbow, hand };
}
const armL = arm(-1), armR = arm(1);
// laptop on the knees
const laptop = new THREE.Group(); laptop.position.set(0, 1.3, .72); laptop.rotation.x = -.12; P.add(laptop);
const base = cast(new THREE.Mesh(new THREE.BoxGeometry(1.2, .06, .8), flat('#2A3353'))); laptop.add(base);
const keys = new THREE.Mesh(new THREE.BoxGeometry(1.0, .02, .5), flat('#1E2742')); keys.position.set(0, .04, .05); laptop.add(keys);
const screenMat = new THREE.MeshStandardMaterial({ color: '#2C3659', emissive: '#FF9F5A', emissiveIntensity: .9, roughness: .6, flatShading: true });
const screen = cast(new THREE.Mesh(new THREE.BoxGeometry(1.2, .8, .05), screenMat)); screen.position.set(0, .42, -.38); screen.rotation.x = -.35; laptop.add(screen);
const screenGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.05, .62), new THREE.MeshBasicMaterial({ color: '#FFC58A', side: THREE.DoubleSide })); screenGlow.position.set(0, .42, -.345); screenGlow.rotation.x = -.35; laptop.add(screenGlow);
// lid back faces the camera: a dim logo-lit panel so the lid reads as a laptop
const lidBack = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .7), new THREE.MeshStandardMaterial({ color: '#3A4772', flatShading: true, roughness: .8 })); lidBack.position.set(0, .42, -.41); lidBack.rotation.set(-.35 + Math.PI, 0, 0); laptop.add(lidBack);
const lidLogo = new THREE.Mesh(new THREE.CircleGeometry(.08, 12), new THREE.MeshBasicMaterial({ color: '#FFD9A8' })); lidLogo.position.set(0, .44, -.415); lidLogo.rotation.set(-.35 + Math.PI, 0, 0); laptop.add(lidLogo);
// warm light spill on the face
const faceLight = new THREE.SpotLight('#FFB070', 6, 3.2, .55, .6, 2); faceLight.position.set(0, 1.55, 1.15); faceLight.target.position.set(0, 2.75, .4); P.add(faceLight); P.add(faceLight.target);
// log seat
const log = cast(new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, 1.6, 7), flat('#4A3327'))); log.rotation.z = Math.PI / 2; log.position.set(0, .42, -.15); scene.add(log);
// warm ground glow
const glowRing = new THREE.Mesh(new THREE.CircleGeometry(2.2, 32), new THREE.MeshBasicMaterial({ color: '#FFA86A', transparent: true, opacity: .14 }));
glowRing.rotation.x = -Math.PI / 2; glowRing.position.set(0, .015, .6); scene.add(glowRing);

// ---------- render(t)
function render(t) {
  // slow push-in with a gentle orbit, framing head to knees
  const push = Math.min(1, t / 10);
  const ang = -.35 + Math.sin(t * .15) * .12;
  const dist = 9.5 - push * 1.6;
  cam.position.set(Math.sin(ang) * dist, 2.9 + Math.sin(t * .25) * .06, Math.cos(ang) * dist);
  cam.lookAt(0, 1.9, .2);
  // typing and breathing
  armL.elbow.rotation.x = Math.sin(t * 8) * .06; armR.elbow.rotation.x = Math.cos(t * 8) * .06;
  torso.scale.y = 1 + Math.sin(t * 1.4) * .012;
  head.rotation.z = Math.sin(t * .6) * .035; head.rotation.y = Math.sin(t * .4) * .05;
  // blink
  const bt = t % 3.6; const bl = bt < .12 ? 0.15 : 1;
  P.children.forEach(c => { if (c.geometry && c.geometry.type === 'SphereGeometry' && Math.abs(c.position.y - 2.78) < .01 && c.position.z > .42 && c.position.z < .46) c.scale.y = bl; });
  // screen flicker + warm light
  const f = .85 + .15 * Math.sin(t * 7.3) * Math.sin(t * 2.1);
  screenMat.emissiveIntensity = .9 * f; screenGlow.material.color.setStyle(f > .9 ? '#FFCF9A' : '#FFC58A');
  warm.intensity = 6.5 + 1.2 * (f - .85);
  glowRing.material.opacity = .12 + .04 * (f - .85);
  // motes drift
  for (let i = 0; i < 70; i++) {
    const u = (t * .045 + i / 70) % 1;
    const x = Math.sin(i * 2.7) * 4.5 + Math.sin(t * .35 + i) * .35, z = Math.cos(i * 1.9) * 3 + 1.5, y = .3 + u * 6.5;
    dm.position.set(x, y, z); dm.rotation.set(t + i, t * 1.3, 0); dm.scale.setScalar(.5 + .5 * Math.abs(Math.sin(i + t * 2.5))); dm.updateMatrix(); motes.setMatrixAt(i, dm.matrix);
  }
  motes.instanceMatrix.needsUpdate = true;
  renderer.render(scene, cam);
}
window.seek = render;
window.DURATION = 12;
window.SFX = []; window.CONFIG = { music: {} };
window.READY = true;
render(0);
</script>
</body>
</html>
