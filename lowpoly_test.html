<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low-poly night test</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<style>html,body{margin:0;background:#0A1430}#c{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="vendor/three.min.js"></script>
<script>
// Original low-poly night scene: faceted trees, crescent moon, glow particles, a low-poly person at a laptop.
// Time-only: render(t) gives the same frame for the same t.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#14244F');
scene.fog = new THREE.Fog('#1E3370', 14, 60);
const cam = new THREE.PerspectiveCamera(34, 1080 / 1920, .1, 200);

// lights: cool sky, warm laptop glow, soft moon key
scene.add(new THREE.HemisphereLight('#A9C4FF', '#0B1230', .9));
const moon = new THREE.DirectionalLight('#BBD0FF', 1.3); moon.position.set(-8, 14, -6); moon.castShadow = true; scene.add(moon);
const warm = new THREE.PointLight('#FFB070', 6, 9, 1.6); warm.position.set(.4, 1.2, 1.4); scene.add(warm);

const flat = (color, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, flatShading: true, roughness: .85, metalness: 0 }, extra));

// ground with faceted hills
const gGeo = new THREE.PlaneGeometry(60, 60, 14, 14); gGeo.rotateX(-Math.PI / 2);
const gp = gGeo.attributes.position;
for (let i = 0; i < gp.count; i++) { const x = gp.getX(i), z = gp.getZ(i); gp.setY(i, Math.sin(x * .6) * .25 + Math.cos(z * .5) * .2 - (Math.abs(x) + Math.abs(z)) * .02); }
gGeo.computeVertexNormals();
const ground = new THREE.Mesh(gGeo, flat('#1F3A6B')); ground.receiveShadow = true; scene.add(ground);

// low-poly pine trees (cones, few sides, flat shading)
const TREE_COL = ['#1B4D6B', '#21607A', '#17405E', '#245F82'];
function tree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.08 * s, .1 * s, .8 * s, 5), flat('#3A2A24')); trunk.position.y = .4 * s; g.add(trunk);
  for (let k = 0; k < 3; k++) {
    const c = new THREE.Mesh(new THREE.ConeGeometry((1.1 - k * .25) * s, (1.4 - k * .15) * s, 6), flat(TREE_COL[(x * 7 + k) & 3] || TREE_COL[k])); c.position.y = (1.1 + k * .8) * s; c.castShadow = true; g.add(c);
  }
  g.position.set(x, 0, z); scene.add(g); return g;
}
const rnd = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
for (let i = 0; i < 26; i++) {
  const a = rnd() * Math.PI * 2, r = 4.5 + rnd() * 9;
  const x = Math.cos(a) * r, z = Math.sin(a) * r - 2;
  if (Math.abs(x) < 1.8 && z > -2) continue;
  tree(x, z, .7 + rnd() * .9);
}

// crescent moon: bright disc with a dark disc overlapping
const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 12), new THREE.MeshBasicMaterial({ color: '#F4F7FF' }));
moonDisc.position.set(-3.4, 8.2, -18); scene.add(moonDisc);
const moonCut = new THREE.Mesh(new THREE.SphereGeometry(1.05, 16, 12), new THREE.MeshBasicMaterial({ color: '#16295A' }));
moonCut.position.set(-2.9, 8.5, -17.9); scene.add(moonCut);

// glowing dust particles
const dust = new THREE.InstancedMesh(new THREE.OctahedronGeometry(.05, 0), new THREE.MeshBasicMaterial({ color: '#FFE8B0' }), 60);
scene.add(dust);
const m4 = new THREE.Matrix4(), dummy = new THREE.Object3D();

// low-poly person at a laptop (original design)
const person = new THREE.Group(); person.position.set(0, .0, 0); scene.add(person);
const skin = flat('#E9A97E'), hair = flat('#2A1E18'), shirt = flat('#1C1B22'), pants = flat('#262A3A'), lap = flat('#3D4A6E', { emissive: '#FF9A55', emissiveIntensity: .4 });
const body = new THREE.Mesh(new THREE.CylinderGeometry(.5, .6, 1.4, 6), shirt); body.position.y = 1.5; body.castShadow = true; person.add(body);
const head = new THREE.Mesh(new THREE.IcosahedronGeometry(.46, 1), skin); head.position.y = 2.7; head.castShadow = true; person.add(head);
const hairMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(.5, 0), hair); hairMesh.scale.set(1.05, .8, 1.02); hairMesh.position.set(0, 2.98, -.02); person.add(hairMesh);
const glassMat = flat('#3A2E2A');
[-.19, .19].forEach(x => { const lens = new THREE.Mesh(new THREE.BoxGeometry(.22, .18, .05), new THREE.MeshStandardMaterial({ color: '#5D4A44', flatShading: true, transparent: true, opacity: .55 })); lens.position.set(x, 2.72, .42); person.add(lens); });
const bridge = new THREE.Mesh(new THREE.BoxGeometry(.12, .04, .04), glassMat); bridge.position.set(0, 2.74, .44); person.add(bridge);
const legL = new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, 1.2, 5), pants); legL.position.set(-.2, .6, .05); person.add(legL);
const legR = legL.clone(); legR.position.x = .2; person.add(legR);
const armL = new THREE.Mesh(new THREE.CylinderGeometry(.14, .12, 1, 5), shirt); armL.position.set(-.6, 1.7, .35); armL.rotation.x = -1.1; armL.rotation.z = .25; person.add(armL);
const armR = armL.clone(); armR.position.x = .6; armR.rotation.z = -.25; person.add(armR);
// laptop on lap
const laptop = new THREE.Group(); laptop.position.set(0, 1.05, .9); laptop.rotation.x = -.25; person.add(laptop);
const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, .07, 1), flat('#2B3550')); laptop.add(base);
const screen = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, .06), lap); screen.position.set(0, .5, -.48); screen.rotation.x = .25; laptop.add(screen);

// lights from the screen and fire-warm glow
const glowRing = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.8, 24), new THREE.MeshBasicMaterial({ color: '#FFB070', transparent: true, opacity: .15, side: THREE.DoubleSide }));
glowRing.rotation.x = -Math.PI / 2; glowRing.position.set(0, .02, .5); scene.add(glowRing);

function render(t) {
  // gentle slow orbit, keeping the person framed
  const ang = Math.sin(t * .12) * .25;
  cam.position.set(Math.sin(ang) * 6.2, 2.8 + Math.sin(t * .3) * .08, 8.2 + Math.cos(ang) * .3);
  cam.lookAt(0, 2.2, 0);
  // typing: arms bob, head tilts slightly
  armL.position.y = 1.55 + Math.sin(t * 9) * .03; armR.position.y = 1.55 + Math.cos(t * 9) * .03;
  head.rotation.z = Math.sin(t * .7) * .04; hairMesh.rotation.z = head.rotation.z;
  laptop.position.y = 1.05 + Math.sin(t * 1.4) * .01;
  warm.intensity = 5.5 + .8 * Math.sin(t * 2.3);
  glowRing.material.opacity = .12 + .05 * Math.sin(t * 2.3);
  // dust drifting upward
  for (let i = 0; i < 60; i++) {
    const u = (t * .05 + i / 60) % 1, x = Math.sin(i * 2.7) * 4 + Math.sin(t * .4 + i) * .3, z = Math.cos(i * 1.9) * 3 + 1, y = .5 + u * 6;
    dummy.position.set(x, y, z); dummy.rotation.set(t + i, t * 1.3, 0); dummy.scale.setScalar(.6 + .4 * Math.sin(i + t * 3)); dummy.updateMatrix(); dust.setMatrixAt(i, dummy.matrix);
  }
  dust.instanceMatrix.needsUpdate = true;
  renderer.render(scene, cam);
}
window.seek = render;
window.READY = true;
render(0);
</script>
</body>
</html>
