    camTo(tp, { s: 1, oy: 900 }, .6, 'power2.out');
    const ts = pE(si, 2) - .55;                                      // "...സെൽഫി എടുത്തു!"
    tl.set(shutter, { opacity: .95 }, ts); tl.to(shutter, { opacity: 0, duration: .35 }, ts + .05); sfx('shutter', ts, .9); flash(ts, .25);
    tl.set(hPill, { opacity: 0 }, 0); pop(hPill, tp + .6);
    if (CRED.putin) { hCred.textContent = 'Split screen of two photos, not the actual selfie · ' + [CRED.raul, CRED.putin].filter(Boolean).map(c => `${c.author} (${c.license})`).join(' · ') + ' · Wikimedia Commons'; fitW(hCred, 800); }
    tl.set(hCred, { opacity: 0 }, 0); tl.to(hCred, { opacity: 1, duration: .3 }, tp + .8);
  },
  who(si) {
    const t0 = sStart(si) - .05; slide($('set_hook'), wSet, t0);
    tl.fromTo(wPhotoW, { scale: 1.06, transformOrigin: '540px 640px' }, { scale: 1, duration: sEnd(si) - t0, ease: 'none', immediateRender: false }, t0);
    tl.set(wName, { opacity: 0 }, 0); tl.fromTo(wName, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .35, ease: 'power3.out', immediateRender: false }, pS(si, 1)); sfx('pop', pS(si, 1), .5);
    tl.set(wKid, { opacity: 0 }, 0); slam(wKid, pS(si, 2));
    tl.set(wStud, { opacity: 0 }, 0); pop(wStud, pS(si, 3));
    camTo(t0 + .6, { s: 1.04, oy: 760 }, sEnd(si) - t0 - .6);
  },
  rise(si) {
    const t0 = sStart(si) - .05; slide(wSet, rSet, t0); camTo(t0, { s: 1, oy: 900 }, .6, 'power2.inOut');
    [[rP[0], pS(si, 0) + .1], [rP[1], pS(si, 1)], [rP[2], pS(si, 2)]].forEach(([p, t]) => pop(p, t));
    tl.set(rBoard, { opacity: 0 }, 0); tl.to(rBoard, { opacity: 1, duration: .3 }, pS(si, 3) - .1);
    counter(rVal, 0, 500000, pS(si, 3), 1.8, v => '≈ ' + (Math.round(v / 1000) * 1000).toLocaleString('en-IN'));
    for (let k = 0; k < 14; k++) sfx('tick', pS(si, 3) + 1.8 * (1 - Math.sqrt(1 - k / 14)), .4); sfx('coin', pS(si, 3) + 1.8, .6);
    camTo(t0 + .6, { s: 1.04, oy: 1000 }, sEnd(si) - t0 - .6);
  },
  moscow(si) {
    const t0 = sStart(si) - .05; slide(rSet, mSet, t0);
    const w = sentences[si].words; const wAt = s => { const k = w.findIndex(x => x.w.startsWith(s)); return k >= 0 ? w[k].t : t0 + 1; };
    tl.set(mTitle, { opacity: 0 }, 0); pop(mTitle, t0 + .5);
    tl.fromTo(mCityW, { scale: 1.08, transformOrigin: '540px 560px' }, { scale: 1, duration: 3, ease: 'none', immediateRender: false }, t0);
    const tr = wAt('റഷ്യ'), tk = wAt('കസാഖ'), tm = wAt('മലയാളി');
    tl.to(mCityW, { opacity: 0, y: -200, duration: .4, ease: 'power2.in' }, tr - .2);
    tl.set(mP1W, { opacity: 0 }, 0); tl.fromTo(mP1W, { opacity: 0, y: 300 }, { opacity: 1, y: 0, duration: .5, ease: 'back.out(1.4)', immediateRender: false }, tr); sfx('whoosh', tr, .5);
    tl.set(mP2W, { opacity: 0 }, 0); tl.fromTo(mP2W, { opacity: 0, y: 300 }, { opacity: 1, y: 0, duration: .5, ease: 'back.out(1.4)', immediateRender: false }, tk); sfx('whoosh', tk, .5);
    tl.set(mTal, { opacity: 0 }, 0); slam(mTal, tm);
    // the silence beat
    const hb = pE(si, 0) + .25; tl.to([mP1W, mP2W, mTitle], { opacity: .25, duration: .5 }, hb); sfx('dip', hb, .8);
    camTo(t0 + .6, { s: 1.04 }, sEnd(si) - t0 - .6);
  },
  twist(si) {
    const t0 = sStart(si) - .05; slide(mSet, tSet, t0); camTo(t0, { s: 1, oy: 900 }, .6, 'power2.inOut');
    tl.set(tQ, { opacity: 0 }, 0); tl.fromTo(tQ, { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: .45, ease: 'power3.out', immediateRender: false }, pS(si, 0) + .15); sfx('pop', pS(si, 0) + .15, .5);
    [tA0, tRep].forEach(e => tl.set(e, { opacity: 0 }, 0)); tl.to(tA0, { opacity: 1, duration: .3 }, pS(si, 2));
    tl.set(tA1, { opacity: 0 }, 0); slam(tA1, pS(si, 3)); tl.set(tA2, { opacity: 0 }, 0); pop(tA2, pS(si, 4)); tl.to(tRep, { opacity: 1, duration: .3 }, pS(si, 4) + .3);
    camTo(pS(si, 3), { s: 1.05, oy: 900 }, sEnd(si) - pS(si, 3));
  },
  callback(si) {
    const t0 = sStart(si) - .05; slide(tSet, cSet, t0); camTo(t0, { s: 1, oy: 900 }, .6, 'power2.inOut');
    tl.set(cPhotoW, { opacity: 0 }, 0); tl.fromTo(cPhotoW, { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: .5, ease: 'back.out(1.4)', immediateRender: false }, t0 + .4);
    tl.set(cTitle.bar, { scaleX: 0, transformOrigin: '0% 50%' }, 0); tl.to(cTitle.bar, { scaleX: 1, duration: .4, ease: 'power3.out' }, pS(si, 1)); sfx('thud', pS(si, 1) + .2, .6);
    camTo(t0 + .6, { s: 1.05 }, DUR - t0 - .6);
  }
};
sentences.forEach((s, si) => scenes[s.scene](si));

// ---------------------------------------------------------------- captions: navy box, word by word
const capBox = $('captions'), MAXCH = 22;
const isNum = w => /[0-9]|ലക്ഷം|ഒൻപതാം|പുടിൻ|എഐ/.test(w);
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const box = document.createElement('div'); box.className = 'box'; page.appendChild(box);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .12 : (pi + 1 < TIM.phrases.length ? Math.min(next - .1, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 0, scale: .92 }, 0); tl.to(page, { opacity: 1, scale: 1, duration: .18, ease: 'back.out(2)' }, Math.max(0, words[0].t - .1));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w' + (isNum(w.w) ? ' num' : ''); s.textContent = w.w; box.appendChild(s);
      tl.set(s, { opacity: .35 }, 0); tl.set(s, { opacity: 1, color: C.lime }, Math.max(0, w.t - .05));
      tl.set(s, { color: '#FFFFFF' }, j + 1 < words.length ? words[j + 1].t - .05 : tOut);
    });
    tl.set(page, { opacity: 0 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
const tiles = $('tiles'), leaves = $('leaves'), cam = $('cam');
function render(t) {
  const wx = WX.v; tiles.setAttribute('patternTransform', `translate(${(wx % 120).toFixed(2)} 0)`); const lw = ((wx % 1080) + 1080) % 1080; leaves.setAttribute('transform', `translate(${(lw > 540 ? lw - 1080 : lw).toFixed(2)} 0)`);
  cam.setAttribute('transform', `translate(${CAMS.ox} ${CAMS.oy}) scale(${CAMS.s.toFixed(4)}) translate(${-CAMS.ox} ${-CAMS.oy})`);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
</script>
