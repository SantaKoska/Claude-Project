    const tx = pS(si, 2) + .1; go3(tx, { globe: 0 }, .7, 'power1.inOut'); sfx('whoosh', tx, .5);
    camSet(0, camAt(...merc(80.5, 21.5), 128)); camTo(tx + .1, camAt(KC[0] + .0003, KC[1] + .0016, 22), sEnd(si) - tx + .2, 'power2.inOut');
    go3(wT(si, 6) - .1, { kerala: 1 }, .5, 'power1.out'); go3(wT(si, 6), { india: .35 }, .6); sfx('chime', wT(si, 6), .5);
    // opening card: bright, big, from frame 0
    const o = el('g', {}, UI); el('rect', { x: 90, y: 270, width: 820, height: 250, rx: 34, fill: '#FFC94A', filter: 'url(#shadowS)' }, o);
    text(o, 500, 352, 'KERALA YATRA', 96, '#14110C'); text(o, 500, 450, 'EP 6/14 · IDUKKI', 44, '#14110C', 'middle', { 'font-weight': 800 });
    tl.set(o, { opacity: 1 }, 0); hide(o, wT(si, 6) - .45);
    const k = pill(UI, 500, 330, 'KERALA', 70, '#14110C', '#FFC94A', 44); pop(k, wT(si, 6)); hide(k, sEnd(si) + .3);
  },
  purpose(si) {
    // all 14 districts draw in, numbered in road order; the done ones turn blue; Alappuzha lights up
    camTo(sStart(si), camAt(KC[0] + .0003, KC[1] + .0021, 20.5), sEnd(si) - sStart(si) + .4, 'sine.inOut');
    go3(sStart(si), { dists: 1, labels: 1 }, 2.6, 'none'); for (let k = 0; k < 14; k++) sfx('tick', sStart(si) + k * 2.6 / 14, .5);
    go3(sStart(si), { india: 0 }, .8);
    const a = pill(UI, 500, 330, '14 DISTRICTS · ONE JOURNEY', 52, '#FFFFFF', '#14110C', 36); pop(a, sStart(si) + .3); hide(a, wT(si, 4) - .1);
    go3(wT(si, 2), { doneHi: 1 }, .7); sfx('pop', wT(si, 2), .4);
    // series progress: 14 steps, 4 done (blue), this one (yellow) pulses
    const dn = el('g', {}, UI); el('rect', { x: 120, y: 410, width: 760, height: 96, rx: 48, fill: '#14110C', opacity: .9 }, dn);
    const seg = []; for (let k = 0; k < 14; k++) seg.push(el('rect', { x: 170 + k * 42, y: 440, width: 34, height: 36, rx: 9, fill: k < 5 ? '#1A73E8' : k === 5 ? '#FFC94A' : '#3C4043' }, dn));
    text(dn, 832, 458, '6/14', 40, '#FFFFFF', 'middle', { 'font-weight': 800 });
    pop(dn, wT(si, 2) + .1); hide(dn, sEnd(si) + .5);
    for (let k = 0; k < 5; k++) { tl.set(seg[k], { attr: { fill: '#3C4043' } }, 0); tl.set(seg[k], { attr: { fill: '#1A73E8' } }, wT(si, 2) + .25 + k * .12); sfx('tick', wT(si, 2) + .25 + k * .12, .4); }
    tl.fromTo(seg[5], { opacity: 1 }, { opacity: .35, duration: .4, repeat: 5, yoyo: true, ease: 'sine.inOut', immediateRender: false }, wT(si, 2) + .8);
    const b = pill(UI, 500, 330, '5 PLACES IN EACH', 60, '#14110C', '#FFC94A', 40); pop(b, wT(si, 4)); hide(b, sEnd(si) + .2);
    go3(wT(si, 6), { distHi: 1 }, .8); sfx('chime', wT(si, 6), .5);
  },
  intro(si) {
    // down to Illikkal Kallu, where episode 5 ended; the traveller appears; then the whole day's route in Idukki
    const T0 = sStart(si), S0 = D.pts.start;
    camTo(T0, camAt(S0[0] + .0006, S0[1] - .0003, 7.6, 0), pS(si, 1) - T0 + .2, 'power2.inOut');
    v3(T0 + .4, { route: 1, marker: 1 }); go3(T0 + .2, { labels: .999 }, .2);
    const k = pill(UI, 500, 330, 'DISTRICT 6 · IDUKKI', 52, '#14110C', '#FFC94A', 38); pop(k, pS(si, 1)); hide(k, sEnd(si) + .2);
    const tc = pS(si, 3) - .1; go3(tc, { labels: 0, doneHi: 0 }, .6); camTo(tc, legView([0, 1, 2, 3, 4], 1.1, 14), sEnd(si) - tc + .3, 'power2.inOut');
    const sb = pill(UI, 500, 450, 'HILLS · MIST', 40, '#FFFFFF', '#14110C', 30); pop(sb, pS(si, 3)); hide(sb, sEnd(si) + .2);
    go3(sEnd(si) - .6, { pinsOn: 1 }, .8, 'power1.out'); for (let j = 0; j < 5; j++) sfx('pop', sEnd(si) - .6 + j * .16, .3);
  },
  stop1(si) { stopScene(si, 0, [0], pS(si, 1), sEnd(si), [['MEADOWS · PINE FOREST', pS(si, 2), '#188038'], ['ABOUT 1,100 m ABOVE SEA LEVEL', pS(si, 3), '#14110C']]); },
  stop2(si) { stopScene(si, 1, [1], pS(si, 1), sEnd(si), [['PERIYAR TIGER RESERVE', pS(si, 2), '#B06000'], ['BOAT RIDE · ELEPHANTS · GAUR', pS(si, 3), '#1A73E8']], { wide: true }); },
  stop3(si) { stopScene(si, 2, [2], pS(si, 1), sEnd(si), [['168 m ARCH', pS(si, 2), '#B06000'], ['KURAVAN & KURATHI HILLS', pS(si, 2) + 2.2, '#14110C']], { wide: true }); },
  stop4(si) { stopScene(si, 3, [3], pS(si, 1), sEnd(si), [['TEA AS FAR AS THE EYE CAN SEE', pS(si, 2), '#188038']], { wide: true }); },
  stop5(si) { stopScene(si, 4, [4], pS(si, 1), sEnd(si), [['NILGIRI TAHR · ENDANGERED', pS(si, 2), '#188038'], ['CLOSED FEB–MAR · CALVING', pS(si, 3), '#B06000']]); herd(pS(si, 2) - .2, sEnd(si)); },
  handoff(si) {
    // the whole day on the map, then the houseboat crosses Vembanad east and Kottayam lights up
    const T0 = sStart(si);
    const v = ptsView([...[0, 1, 2, 3, 4].flatMap(i => D.legs[i].pts), ...D.exit], 1.15, 10);
    camTo(T0, v, 2.2, 'power2.inOut');
    v3(T0, { follow: 0, labelNext: 1 }); go3(T0 + .2, { labels: 1 }, 1.0, 'none'); go3(pS(si, 1), { exitU: 1 }, pS(si, 3) - pS(si, 1) + .1, 'power1.inOut'); sfx('whoosh', pS(si, 1), .4);
    go3(pS(si, 3), { nextHi: 1 }, .6); sfx('chime', pS(si, 3), .6);
    const p = pill(UI, 500, 330, 'NEXT · EP 7/14 · ERNAKULAM', 54, '#FFFFFF', '#188038', 38); pop(p, pS(si, 3) + .05);
    const d = pill(UI, 500, 460, 'TODAY · ≈ 230 km · 5 PLACES', 40, '#14110C', '#FFC94A', 30); pop(d, T0 + .4);
    const dt = d.querySelector('text'); const od = { v: 0 }; tl.to(od, { v: 230, duration: 1.6, ease: 'power2.out', onUpdate: () => dt.textContent = `TODAY · ≈ ${Math.round(od.v)} km · 5 PLACES` }, T0 + .4);
    for (let k = 0; k < 12; k++) sfx('tick', T0 + .4 + 1.6 * (1 - Math.sqrt(1 - k / 12)), .35);
  },
};
// one stop: preview dashed line, nav bar, drive (camera follows on short legs, frames the leg on long ones), arrive, place card
function stopScene(si, k, legs, tArrive, tEnd, chips = [], opt = {}) {
  const T0 = sStart(si), stop = D.ep.stops[k];
  v3(T0 - .3, { preview: legs[0] });
  const tD1 = tArrive - .1, tD0 = T0 + .15, per = (tD1 - tD0) / legs.length;
  legs.forEach((li, j) => drive(li, tD0 + j * per, tD0 + (j + 1) * per - .02));
  navBar(stop.name.toUpperCase(), NAV[stop.n], T0, tArrive + .1);
  if (opt.wide) { v3(T0 - .05, { follow: 0 }); camTo(T0 - .05, legView(legs), 1.1, 'power2.inOut'); }
  else { v3(T0 - .05, { follow: 1 }); camTo(T0 - .05, { h: 1.2, tilt: 34 }, .9, 'power2.inOut'); }
  arrive(k, tArrive - .05);
  const photos = (PH[stop.n] || []).map(i => photo(stop.n, i));
  placeCard(stop, photos.length ? photos : [photo(stop.n, 0)], tArrive, tEnd ?? sEnd(si), chips);
}
sentences.forEach((s, si) => scenes[s.scene](si));

// ---------------------------------------------------------------- captions (Malayalam, word by word)
const capBox = $('captions'), MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .22, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0); tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06)); tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut); });
    tl.to(page, { opacity: 0, duration: .12 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
const FOLLOW_N = .00009; // look-ahead to the north so the traveller sits low on screen, under the cards
function render(t) {
  if (ST.follow > 0 && ST.leg >= 0) { const [X, Y] = M.where(ST.leg, ST.u); const p = M.w(X, Y - FOLLOW_N * ST.cam.h); ST.cam.x += (p.x - ST.cam.x) * ST.follow; ST.cam.z += (p.z - ST.cam.z) * ST.follow; }
  M.render(t); drawHerds(t);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.__M = M; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
