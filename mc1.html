<script>
(async function () {
const CFG = JSON.parse(document.getElementById('config').textContent);
const TIM = JSON.parse(document.getElementById('timings').textContent);
const C = CFG.palette, NS = 'http://www.w3.org/2000/svg', DUR = TIM.duration, SFX = [];
const $ = id => document.getElementById(id);
const sfx = (type, t, gain = 1, extra = {}) => SFX.push(Object.assign({ type, t: +Math.max(0, t).toFixed(3), gain }, extra));
await document.fonts.load('800 80px Anek', 'മലയാളം'); await document.fonts.load('bold 80px "DejaVu Serif"', 'MARY'); await document.fonts.load('800 80px Inter', 'A');
function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const ML = s => /[ഀ-ൿ]/.test(s);
function text(parent, x, y, str, size, fill, anchor = 'middle', extra = {}) { const t = el('text', Object.assign({ x, y, 'font-size': size, fill, 'text-anchor': anchor, 'font-family': ML(str) ? 'Anek' : '"DejaVu Serif"', 'font-weight': ML(str) ? 800 : 'bold', 'dominant-baseline': 'central' }, extra), parent); t.textContent = str; return t; }
const fitW = (e, w) => { const bw = e.getBBox().width; if (bw > w) e.setAttribute('font-size', (+e.getAttribute('font-size') * w / bw).toFixed(1)); return e; };
const wrap = e => { const w = el('g', {}); e.parentNode.insertBefore(w, e); w.appendChild(e); return w; };

// ---------------------------------------------------------------- timing
const sentences = CFG.sentences.map((s, si) => { const ph = TIM.phrases.filter(p => p.sentence === si); return Object.assign({}, s, { ph, words: ph.flatMap(p => p.words) }); });
const SI = {}; sentences.forEach((s, i) => SI[s.scene] = i);
const sStart = si => sentences[si].ph[0].start;
const sEnd = si => si + 1 < sentences.length ? sStart(si + 1) : DUR;
const pS = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].start;
const pE = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].end;
const tl = gsap.timeline({ paused: true }); tl.to({}, { duration: DUR }, 0);
const hide = e => tl.set(e, { opacity: 0 }, 0);
const fadeIn = (e, t, d = .6) => tl.to(e, { opacity: 1, duration: d, ease: 'power1.inOut' }, Math.max(0, t));
const fadeOut = (e, t, d = .5) => tl.to(e, { opacity: 0, duration: d, ease: 'power1.inOut' }, t);
// a dip through black between two shots
const dip = (t, d = .5) => { tl.to($('black'), { opacity: 1, duration: d * .45, ease: 'power1.in' }, t - d * .45); tl.to($('black'), { opacity: 0, duration: d * .55, ease: 'power1.out' }, t); };

function stamp(parent, x, y, str, size, t, fill = C.paper, anchor = 'middle', d = .8) {

  tx.setAttribute('clip-path', `url(#${id})`); tl.to(r, { attr: { width: bb.width + 12 }, duration: d, ease: 'steps(' + Math.max(8, str.length) + ')' }, t);
  for (let k = 0; k < Math.min(10, str.length); k++) sfx('type', t + k * d / Math.min(10, str.length), .4);
  return g;
}

// ---------------------------------------------------------------- camera (whole world)

const camSet = (t, v) => tl.set(CAM, v, t);

const world = $('cam');
const set = (name, visible = false) => { const g = el('g', { id: 'set_' + name }, world); if (!visible) tl.set(g, { opacity: 0 }, 0); return g; };
const showSet = (g, t0, t1) => { tl.set(g, { opacity: 1 }, t0); if (t1 != null) tl.set(g, { opacity: 0 }, t1); };

// ================================================================= THE SEA (sky, sun behind cloud, clouds, waves, fog)
const sea = set('sea', true);
const skyR = el('rect', { x: -400, y: -400, width: 1880, height: 1460, fill: 'url(#sky)' }, sea);

const clouds = [...Array(7)].map((_, k) => el('ellipse', { rx: 420 + k * 40, ry: 70 + (k % 3) * 25, fill: k % 2 ? '#141E2A' : '#22303F', opacity: .85, filter: 'url(#blur30)' }, sea));
const farShip = el('g', {}, sea);            // the Mary Celeste (placed by SH)
const waves = [...Array(7)].map((_, k) => el('path', { fill: ['#2B3A48', '#223140', '#1B2836', '#15212D', '#101A24', '#0C141C', '#080E15'][k] }, sea));
const glint = el('g', { opacity: .55 }, sea); const glints = [...Array(14)].map(() => el('ellipse', { rx: 40, ry: 3, fill: '#C9D4DC', filter: 'url(#blur3)' }, glint));
const fogs = [...Array(4)].map((_, k) => el('ellipse', { rx: 900, ry: 90 + k * 20, fill: '#8C9AA8', opacity: .16, filter: 'url(#blur60)' }, sea));
const lanternG = el('g', { opacity: 0 }, sea);   // Dei Gratia's lantern + bow (foreground left)
el('circle', { cx: 0, cy: 0, r: 160, fill: 'url(#lantern)' }, lanternG); el('circle', { cx: 0, cy: 0, r: 12, fill: '#FFE7B0' }, lanternG);

// the brigantine silhouette (local coords: waterline y=0, bow to the right), drawn once
function brig(parent) {

  const sails = el('g', {}, g);
  el('path', { d: 'M-305 -8 L300 -8 Q338 -40 352 -86 L-292 -86 Q-318 -46 -305 -8 Z', fill: dark, stroke: rim, 'stroke-width': 2, 'stroke-opacity': .5 }, g);
  el('path', { d: 'M-292 -86 L352 -86 L352 -96 L-296 -96 Z', fill: '#121A24' }, g);
  el('line', { x1: 345, y1: -92, x2: 500, y2: -150, stroke: dark, 'stroke-width': 9 }, g);
  [[150, -600], [-120, -640]].forEach(([x, top]) => el('line', { x1: x, y1: -90, x2: x, y2: top, stroke: dark, 'stroke-width': 12 }, g));
  // fore square sails (some torn), main gaff sail, jibs
  const sq = (y0, y1, w0, w1, torn) => { let d = `M${150 - w0} ${y0} L${150 + w0} ${y0} L${150 + w1} ${y1}`; if (torn) { for (let k = 8; k >= 0; k--) d += ` L${(150 - w1 + (2 * w1) * k / 8).toFixed(0)} ${(y1 - (k % 2 ? 26 : 0) - (k === 3 ? 40 : 0)).toFixed(0)}`; } else d += ` L${150 - w1} ${y1}`; return el('path', { d: d + ' Z', fill: sail, stroke: rim, 'stroke-width': 2, 'stroke-opacity': .45, opacity: .93 }, sails); };
  sq(-150, -270, 150, 170, true); sq(-290, -390, 125, 140, false); sq(-405, -480, 95, 108, true);
  el('path', { d: 'M-120 -120 L-120 -560 L-330 -500 L-372 -120 Z', fill: sail, stroke: rim, 'stroke-width': 2, 'stroke-opacity': .45, opacity: .9 }, sails);
  el('path', { d: 'M160 -560 L490 -148 L180 -150 Z', fill: sail, opacity: .8 }, sails); el('path', { d: 'M160 -480 L420 -125 L200 -128 Z', fill: '#1A2531', opacity: .75 }, sails);
  [[150, -600, 352, -90], [150, -600, -300, -90], [-120, -640, -300, -90], [-120, -640, 150, -600], [150, -600, 500, -150]].forEach(([a, b, c, d]) => el('line', { x1: a, y1: b, x2: c, y2: d, stroke: rim, 'stroke-width': 2, opacity: .35 }, g));
  g.sails = sails; return g;
}
const ship = brig(farShip);
const SH = { x: 620, y: 1040, s: .55, roll: 0 };
// rowboat with two rowers + a small lantern (local coords)
{ const b = rowboat; el('path', { d: 'M-120 0 L120 0 Q140 -20 150 -40 L-150 -40 Q-140 -20 -120 0 Z', fill: '#070B10', stroke: '#5E7184', 'stroke-width': 2, 'stroke-opacity': .5 }, b);
  [-45, 40].forEach(x => { el('circle', { cx: x, cy: -92, r: 16, fill: '#06090D' }, b); el('path', { d: `M${x - 22} -40 L${x - 16} -80 L${x + 16} -80 L${x + 22} -40 Z`, fill: '#06090D' }, b); });
  b.oars = [-45, 40].map(x => el('line', { x1: x, y1: -60, x2: x - 120, y2: 20, stroke: '#06090D', 'stroke-width': 6 }, b));
  el('circle', { cx: 130, cy: -70, r: 70, fill: 'url(#lantern)', opacity: .8 }, b); el('circle', { cx: 130, cy: -70, r: 6, fill: '#FFE7B0' }, b); }
const RB = { x: -200, y: 1250, s: 1 };

// ================================================================= DECK (the wheel, then the empty deck)
const deck = set('deck');
el('rect', { x: -400, y: -400, width: 1880, height: 2700, fill: '#0B1118' }, deck);
el('rect', { x: -400, y: -400, width: 1880, height: 1300, fill: 'url(#sky)', opacity: .9 }, deck);
const plank = el('g', {}, deck);                              // planks converging to a vanishing point
el('path', { d: 'M-400 2300 L1480 2300 L700 900 L380 900 Z', fill: '#2A1E15' }, plank);
for (let k = -10; k <= 10; k++) el('line', { x1: 540 + k * 190, y1: 2300, x2: 540 + k * 16, y2: 900, stroke: '#150E09', 'stroke-width': 4 }, plank);
for (let k = 0; k < 12; k++) { const y = 900 + 1400 * Math.pow(k / 12, 1.8); el('line', { x1: -400, y1: y, x2: 1480, y2: y, stroke: '#1A120C', 'stroke-width': 2, opacity: .5 }, plank); }
el('line', { x1: 380, y1: 900, x2: -400, y2: 1500, stroke: '#3A2A1E', 'stroke-width': 18 }, deck); el('line', { x1: 700, y1: 900, x2: 1480, y2: 1500, stroke: '#3A2A1E', 'stroke-width': 18 }, deck);
[430, 650].forEach((x, k) => el('rect', { x: x - 10, y: 300, width: 20, height: 620, fill: '#0A0705' }, deck));
const coil = el('g', {}, deck); for (let k = 0; k < 5; k++) el('ellipse', { cx: 250, cy: 1360, rx: 110 - k * 18, ry: 34 - k * 5, fill: 'none', stroke: '#5A4632', 'stroke-width': 9 }, coil);
const hatch = el('rect', { x: 620, y: 1150, width: 260, height: 120, fill: '#1A120C', stroke: '#3A2A1E', 'stroke-width': 8 }, deck);
const wheel = el('g', {}, deck); const wheelR = el('g', {}, wheel);
el('rect', { x: -30, y: 0, width: 60, height: 420, fill: '#1E140D' }, wheel);
el('circle', { cx: 0, cy: 0, r: 240, fill: 'none', stroke: '#4A3424', 'stroke-width': 30 }, wheelR); el('circle', { cx: 0, cy: 0, r: 240, fill: 'none', stroke: '#6B4D35', 'stroke-width': 6, opacity: .6 }, wheelR);
el('circle', { cx: 0, cy: 0, r: 46, fill: '#3B2A1D', stroke: '#6B4D35', 'stroke-width': 6 }, wheelR);
for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; el('line', { x1: 0, y1: 0, x2: Math.cos(a) * 320, y2: Math.sin(a) * 320, stroke: '#4A3424', 'stroke-width': 18, 'stroke-linecap': 'round' }, wheelR); }
const deckFog = [...Array(3)].map((_, k) => el('ellipse', { rx: 800, ry: 140, fill: '#9AA9B8', opacity: .12, filter: 'url(#blur60)' }, deck));
const WH = { x: 540, y: 1000, s: 1, rot: 0 };

// ================================================================= NAME (stern board), PAINTING, MAP, THE TEN
const nameS = set('name');
el('rect', { x: -400, y: -400, width: 1880, height: 2700, fill: '#140E0A' }, nameS);
for (let k = 0; k < 26; k++) el('rect', { x: -400, y: 300 + k * 52, width: 1880, height: 48, fill: k % 2 ? '#22170F' : '#1C130C' }, nameS);
const nameT = text(nameS, 540, 820, 'MARY CELESTE', 112, '#C9A35C', 'middle', { 'letter-spacing': 8, filter: 'url(#shadow)' });
const nameT2 = text(nameS, 540, 940, 'NEW YORK', 44, '#8E7242', 'middle', { 'letter-spacing': 12 });
const nameLight = el('circle', { cx: 0, cy: 860, r: 360, fill: 'url(#lantern)', opacity: .55, style: 'mix-blend-mode:screen' }, nameS);
// map
const mapS = set('map');
el('rect', { x: -400, y: -400, width: 1880, height: 2700, fill: '#070B11' }, mapS);
const mapLand = el('path', { fill: '#1B2632', stroke: '#4E6274', 'stroke-width': 2 }, mapS);
const mapGrid = el('g', { opacity: .18 }, mapS);
const mapRoute = el('path', { fill: 'none', stroke: C.red, 'stroke-width': 7, 'stroke-dasharray': '18 14', 'stroke-linecap': 'round' }, mapS);
const nyDot = el('circle', { r: 14, fill: C.red, stroke: '#fff', 'stroke-width': 4 }, mapS);
// projection: lon -80..5, lat 15..55 -> frame
const PX = lon => 60 + (lon + 80) / 85 * 960, PY = lat => 1120 - (lat - 15) / 40 * 760;
{ const topo = window.LAND50; const land = topojson.feature(topo, topo.objects.land); let d = '';
  const ring = r => { if (!r.some(([lo, la]) => lo > -110 && lo < 20 && la > 5 && la < 65)) return ''; return r.map(([lo, la], i) => (i ? 'L' : 'M') + PX(lo).toFixed(1) + ' ' + PY(la).toFixed(1)).join('') + 'Z'; };
  land.features.forEach(f => { const g = f.geometry; (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => p.forEach(r => d += ring(r))); }); mapLand.setAttribute('d', d);
  const cp = el('clipPath', { id: 'mapClip' }, $('defs')); el('rect', { x: 40, y: 330, width: 1000, height: 820 }, cp); mapLand.setAttribute('clip-path', 'url(#mapClip)'); }
for (let lo = -80; lo <= 0; lo += 10) el('line', { x1: PX(lo), y1: PY(15), x2: PX(lo), y2: PY(55), stroke: '#9AB', 'stroke-width': 1 }, mapGrid);
for (let la = 20; la <= 50; la += 10) el('line', { x1: PX(-80), y1: PY(la), x2: PX(5), y2: PY(la), stroke: '#9AB', 'stroke-width': 1 }, mapGrid);
const NY = [PX(-74.0), PY(40.7)], AZ = [PX(-25.0), PY(37.0)];
nyDot.setAttribute('cx', NY[0]); nyDot.setAttribute('cy', NY[1]);
mapRoute.setAttribute('d', `M${NY[0]} ${NY[1]} Q${(NY[0] + AZ[0]) / 2} ${NY[1] - 120} ${AZ[0]} ${AZ[1]}`);
const routeLen = mapRoute.getTotalLength(); mapRoute.setAttribute('stroke-dashoffset', 0);
const routeMask = el('path', { d: mapRoute.getAttribute('d'), fill: 'none', stroke: '#070B11', 'stroke-width': 14, 'stroke-dasharray': `${routeLen} ${routeLen}`, 'stroke-dashoffset': 0 }, mapS);

// the ten aboard: silhouettes on a dark band
const tenS = set('ten');
el('rect', { x: -400, y: -400, width: 1880, height: 2700, fill: '#06090E' }, tenS);
el('ellipse', { cx: 540, cy: 1060, rx: 640, ry: 60, fill: '#1B2632', opacity: .7, filter: 'url(#blur30)' }, tenS);
const PEOPLE = []; const personPath = (h, w) => `M${-w} 0 L${-w * .8} ${-h * .55} Q${-w * .7} ${-h * .78} 0 ${-h * .8} Q${w * .7} ${-h * .78} ${w * .8} ${-h * .55} L${w} 0 Z`;
const xs = [130, 220, 300, 390, 470, 560, 650, 740, 830, 920], hs = [330, 300, 150, 320, 310, 330, 300, 325, 315, 335];
xs.forEach((x, k) => { const g = el('g', { transform: `translate(${x} 1050)` }, tenS); const h = hs[k], w = h * .16;
  el('path', { d: personPath(h, w), fill: '#121A23', stroke: '#5E7184', 'stroke-width': 2, 'stroke-opacity': .6 }, g); el('circle', { cx: 0, cy: -h * .9, r: h * .1, fill: '#121A23', stroke: '#5E7184', 'stroke-width': 2, 'stroke-opacity': .6 }, g);
  const glow = el('ellipse', { cx: 0, cy: -h * .5, rx: w * 2.4, ry: h * .7, fill: 'url(#lantern)', opacity: 0 }, g); g.insertBefore(glow, g.firstChild); PEOPLE.push({ g, glow }); });
const tenLbl = text(tenS, 540, 560, '10 ABOARD', 64, C.paper, 'middle', { 'letter-spacing': 10 });
const nmLbl = [['CAPT. BENJAMIN BRIGGS', 2], ['SARAH BRIGGS', 1], ['SOPHIA · AGE 2', 2], ['7 CREW', 3]].map(([s]) => text(tenS, 540, 1170, s, 46, C.amber, 'middle', { 'letter-spacing': 6 }));
// real photos (public domain, Wikimedia Commons) if fetched
const PB = 'build/mc/photos/', HAVE = {}; const IMG = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(true); i.onerror = () => ok(false); i.src = src; });
for (const k of ['briggs', 'sarah', 'painting']) HAVE[k] = await IMG(PB + k + '.jpg');
function oldPhoto(parent, cx, cy, w, h, key, cap, rot) { const g = el('g', { transform: `translate(${cx} ${cy}) rotate(${rot})` }, parent);
  el('rect', { x: -w / 2 - 22, y: -h / 2 - 22, width: w + 44, height: h + 96, fill: '#D9CCAE', filter: 'url(#shadow)' }, g);
  if (HAVE[key]) el('image', { href: PB + key + '.jpg', x: -w / 2, y: -h / 2, width: w, height: h, preserveAspectRatio: 'xMidYMid slice', style: 'filter: sepia(.55) contrast(1.1) brightness(.9)' }, g);
  fitW(text(g, 0, h / 2 + 40, cap, 28, '#3A2E1E', 'middle', { 'letter-spacing': 3 }), w - 10); return g; }
const phBriggs = oldPhoto(tenS, 540, 700, 300, 380, 'briggs', 'CAPT. BENJAMIN BRIGGS', -3);
const phSarah = oldPhoto(tenS, 540, 700, 300, 380, 'sarah', 'SARAH & SOPHIA', 3);
const phPaint = oldPhoto(nameS, 540, 560, 640, 420, 'painting', 'THE SHIP IN 1861 (THEN "AMAZON")', -2);

// ================================================================= CABINS (torch beam)
const cab = set('cabins');

  glints.forEach((g, k) => { const y = 1050 + k * 22, a = .5 + .5 * Math.sin(t * 3 + k * 1.7); g.setAttribute('cx', 760 + Math.sin(k * 2.3 + t * .8) * (30 + k * 8)); g.setAttribute('cy', y); g.setAttribute('rx', 20 + k * 6); g.setAttribute('opacity', a.toFixed(2)); });
  fogs.forEach((f, k) => { f.setAttribute('cx', 540 + Math.sin(t * .07 + k * 1.9) * 300); f.setAttribute('cy', 1000 + k * 120); });
  const bob = Math.sin(t * .9) * 6, roll = SH.roll + Math.sin(t * .7) * 2.4 + Math.sin(t * 1.9) * .6;
  farShip.setAttribute('transform', `translate(${SH.x.toFixed(1)} ${(SH.y + bob).toFixed(1)}) rotate(${roll.toFixed(2)}) scale(${SH.s.toFixed(3)})`);
  ship.sails.setAttribute('transform', `skewX(${(Math.sin(t * 1.3) * 1.6).toFixed(2)})`);
  lanternG.setAttribute('transform', `translate(${230 + Math.sin(t * .8) * 6} ${1230 + Math.sin(t * 1.1) * 10}) scale(1.7)`);
  if (ROW.on) { const x = -200 + ROW.u * 760, y = 1300 + Math.sin(t * 1.2) * 10; rowboat.setAttribute('opacity', 1); rowboat.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(Math.sin(t * 1.1) * 3).toFixed(2)}) scale(1.9)`);
    const st = Math.sin(t * 3.2); rowboat.oars.forEach((o, i) => { const bx = [-45, 40][i]; o.setAttribute('x2', bx - 110 + st * 40); o.setAttribute('y2', 20 - Math.abs(st) * 10); }); }
  else rowboat.setAttribute('opacity', 0);
  // deck
  wheel.setAttribute('transform', `translate(${WH.x} ${WH.y}) scale(${WH.s.toFixed(3)})`); wheelR.setAttribute('transform', `rotate(${(Math.sin(t * .6) * 14 + Math.sin(t * 1.7) * 3).toFixed(2)})`);
  deckFog.forEach((f, k) => { f.setAttribute('cx', 540 + Math.sin(t * .1 + k * 2) * 260); f.setAttribute('cy', 900 + k * 260); });
  // lifeboat davits: loose ropes swing
  ropes.forEach((r, k) => { const x = [370, 770][k], sw = Math.sin(t * 1.1 + k) * 26; r.setAttribute('d', `M${x} 600 Q${x + sw * .5} 760 ${x + sw} 900`); });
  lbWaves.forEach((w, k) => w.setAttribute('d', waveD(k + 1, t, -400, 1480, 1040)));
  lbFog.forEach((f, k) => { f.setAttribute('cx', 540 + Math.sin(t * .09 + k * 2.2) * 300); f.setAttribute('cy', 980 + k * 90); });
  // torch
  const jit = Math.sin(t * 9) * 4 + Math.sin(t * 13) * 3; torchHole.setAttribute('cx', (TORCH.x + jit).toFixed(1)); torchHole.setAttribute('cy', (TORCH.y + jit * .6).toFixed(1)); torchHole.setAttribute('r', TORCH.r);
  // camera
  world.setAttribute('transform', `translate(540 900) scale(${CAM.s.toFixed(4)}) translate(${(-540 + CAM.x).toFixed(1)} ${(-900 + CAM.y).toFixed(1)})`);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
