    scrTo(tN, SCR.namit, .5); credit(SCR.namit, tN + .2, tP); c3(tN, Object.assign({}, SEAT)); m3(tN + .02, { px: 1.2, py: 3.15, pz: 6.3 }, tP - tN);
    const n = pill(o, 470, 1150, 'NAMIT MALHOTRA · AGE 19', 52, C.ink, C.accent, 36); slam(n, tN + .15); tl.to(n, { opacity: 0, duration: .15 }, tP - .1);
    const v = pill(o, 470, 1150, 'A VIDEO EDITING STUDIO', 46, '#FFFFFF', C.ink, 30); pop(v, pS(si, 3) + .2); tl.to(v, { opacity: 0, duration: .15 }, tP - .1);
    scrTo(tP, SCR.prime, .35); sfx('whoosh', tP, .4); c3(tP, { px: 3.2, py: 4.6, pz: 11.5, tx: 0, ty: 3.0, tz: -4, fov: 40 }); m3(tP + .02, { px: 2.6, py: 4.2, pz: 10.2 }, sEnd(si) - tP);
    const pf = pill(o, 470, 1150, 'IT GREW INTO PRIME FOCUS', 50, '#FFFFFF', '#B06000', 34); pop(pf, pS(si, 5));
  },
  dneg(si) {
    // 2014: London; the screen shows DNEG, then the Oscars; then the silence (screen and beam fade, a flare builds)
    const T0 = sStart(si), tO = pS(si, 2) - .05, tH = pE(si, 2) + .15;
    flash(T0 - .02, .2); scrTo(T0 - .05, SCR.dneg, .25); credit(SCR.dneg, T0, tO);
    c3(T0 - .05, { px: -3.4, py: 4.45, pz: 10.5, tx: 0, ty: 3.2, tz: -4, fov: 40 }); m3(T0, { px: -2.6, py: 3.95, pz: 8.8 }, tO - T0);
    const o = overlay(si); const g1 = tag(o, '2014 · LONDON', 'HE BUYS DOUBLE NEGATIVE (DNEG)', T0 + .05); tl.to(g1, { opacity: 0, duration: .15 }, tO - .1);
    scrTo(tO, SCR.oscar, .4); go3(tO, { scrZoom: 1, sconce: .5 }, tH - tO + .3, 'sine.inOut');
    c3(tO, { px: -.6, py: 3.5, pz: 7.6, tx: 0, ty: 3.4, tz: -4, fov: 38 }); m3(tO + .02, { px: -.3, py: 3.2, pz: 6.5 }, sEnd(si) - tO);
    const os = pill(o, 470, 1150, 'OSCARS · INTERSTELLAR · DUNE', 48, C.ink, '#E9C46A', 34); slam(os, pS(si, 2) + .4); tl.to(os, { opacity: 0, duration: .2 }, tH);
    go3(tH, { scrOn: .15, beam: .2, sconce: .15 }, sEnd(si) - tH - .2, 'power1.in'); sfx('dip', tH, .6); sfx('hum', tH, .5); flare(sEnd(si) - .55, 1.2);
  },
  twist(si) {
    // the same man's film: RAMAYANA in gold; then the stars (real photos) and the budget
    const T0 = sStart(si), tT = pS(si, 1) - .05, tB = pS(si, 2) + 1.0;
    flash(T0 - .03, .55); leak(T0, 1.6); v3(T0 - .04, { scrA: SCR.title, scrB: SCR.title, scrMix: 0, scrZoom: 0 }); go3(T0 - .03, { scrOn: 1, beam: 1, sconce: .5 }, .4, 'power2.out'); sfx('hit', T0, .9);
    c3(T0 - .04, { px: 0, py: 3.5, pz: 8.4, tx: 0, ty: 3.4, tz: -4, fov: 38 }); m3(T0, { px: 0, py: 3.3, pz: 7.4 }, tB - T0, 'sine.inOut');
    const o = overlay(si); const n = pill(o, 470, 1150, 'PRODUCED BY NAMIT MALHOTRA', 40, C.ink, C.accent, 30); pop(n, T0 + .1); tl.to(n, { opacity: 0, duration: .15 }, tT - .05);
    const r = pill(o, 470, 1150, 'RAMAYANA', 96, '#FFFFFF', '#7A1A0E', 54); slam(r, tT + .05); tl.to(r, { opacity: 0, duration: .15 }, tB - .1);
    scrTo(tT, SCR.ranbir, .35); credit(SCR.ranbir, tT + .1, tB + .05); const cast = pill(o, 470, 470, 'YASH · SAI PALLAVI · RANBIR KAPOOR', 36, '#FFFFFF', C.ink, 26); pop(cast, tT + .3); tl.to(cast, { opacity: 0, duration: .15 }, tB - .1);
    scrTo(tB, SCR.budget, .3); sfx('whoosh', tB, .4); c3(tB, { px: 2.2, py: 4.1, pz: 9.8, tx: 0, ty: 3.2, tz: -4, fov: 40 }); m3(tB + .02, { px: 1.6, py: 3.7, pz: 8.4 }, sEnd(si) - tB);
    const bb = pill(o, 470, 1150, 'BIGGEST BUDGET IN INDIAN CINEMA', 44, C.ink, C.accent, 30); slam(bb, tB + .1); const rp = pill(o, 470, 1250, 'REPORTED · BOTH PARTS', 32, '#FFFFFF', C.ink, 24); pop(rp, tB + .4);
  },
  payoff(si) {
    // 20 days: the screen counts to ₹973 CR; the ticket stack grows again in the front row
    const T0 = sStart(si), tN = pS(si, 2) - .05;
    flash(T0 - .02, .2); scrTo(T0 - .05, SCR.cr973, .3); go3(T0, { sconce: 1 }, .6);
    c3(T0 - .05, { px: -2.0, py: 3.9, pz: 8.6, tx: 0, ty: 3.3, tz: -4, fov: 40 }); m3(T0, { px: -1.4, py: 3.5, pz: 7.2 }, tN - T0);
    const o = overlay(si); tag(o, '20 DAYS', 'SINCE 5 NOVEMBER', T0 + .05);
    flash(tN, .12); c3(tN, { px: .9, py: 1.65, pz: 1.75, tx: .34, ty: 1.3, tz: 1.2, fov: 34 }); m3(tN + .02, { px: .8, py: 1.75, pz: 1.62 }, sEnd(si) - tN); v3(tN, { exposure: .8, tickets: .4 }); go3(tN, { tickets: 1 }, sEnd(si) - tN, 'power1.out');
    const c = pill(o, 470, 470, '₹973 CRORE · INDIA NET', 58, C.ink, C.accent, 40); slam(c, pS(si, 2) + .2); counterSfx(tN, sEnd(si) - tN - .3);
  },
  callback(si) {
    const T0 = sStart(si);
    flash(T0 - .02, .25); v3(T0 - .05, { aperture: .00002, tickets: 0, exposure: 1 }); scrTo(T0 - .05, SCR.cr1000, .3);
    c3(T0 - .05, { px: 0, py: 5.0, pz: 12.5, tx: 0, ty: 3.3, tz: -4, fov: 40 }); m3(T0, { px: 0, py: 4.15, pz: 9.0 }, sEnd(si) - T0 + .3, 'sine.inOut');
    const H = hookCard(); tl.set(H.h, { opacity: 0 }, 0); tl.to(H.h, { opacity: 1, duration: .4 }, pS(si, 2) - .1); sfx('thud', pS(si, 2), .7);
    const o = overlay(si); const p = pill(o, 470, 1150, 'ONLY ₹27 CRORE TO GO', 54, '#FFFFFF', C.ink, 36); pop(p, pS(si, 2) + .3);
  },
};
function counterSfx(t, d, n = 14) { for (let k = 0; k < n; k++) sfx('tick', t + d * (1 - Math.sqrt(1 - k / n)), .45); }
const THREE = await import('three');
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .22, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, duration: .12 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
function render(t) { W.render(t); placeCallouts(); placeExploded(t); placeDims(); }
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));

})();
