    const o = overlay(si); const p = pill(o, 470, 360, '₹48 CRORE · A MONTH EARLY', 54, C.ink, C.accent, 38); slam(p, wT(si, 9)); const q = pill(o, 470, 470, 'ADVANCE BOOKINGS · INDIA (TRACKER EST.)', 32, '#FFFFFF', C.ink, 26); pop(q, wT(si, 9) + .35);
  },
  endgame(si) {
    const T0 = sStart(si), tI = pS(si, 3) - .05, tS = pS(si, 4) - .05;
    flash(T0 - .02, .2); v3(T0 - .05, { exposure: 1, tickets: 0 }); scrTo(T0 - .05, SCR.endgame, .2);
    c3(T0 - .05, { px: -2.6, py: 4.25, pz: 9.5, tx: 0, ty: 3.3, tz: -4, fov: 38 }); m3(T0, { px: -2.0, py: 3.85, pz: 8.0 }, tI - T0);
    const o = overlay(si); tag(o, 'APRIL 2019', 'AVENGERS: ENDGAME', T0 + .05);
    scrTo(tI, SCR.ironman, .5); credit(SCR.ironman, tI + .2, tS); const d = pill(o, 470, 1150, 'IRON MAN DIES SAVING THE UNIVERSE', 44, '#FFFFFF', C.red, 30); pop(d, tI + .2); tl.to(d, { opacity: 0, duration: .15 }, tS - .1);
    scrTo(tS, SCR.sec18, .25); c3(tS, Object.assign({}, SEAT)); m3(tS + .02, { px: 1.2, py: 3.15, pz: 6.3 }, sEnd(si) - tS); sfx('whoosh', tS, .4);
    for (let k = 0; k < 18; k++) sfx('tick', tS + .2 + k * .1, .45);
  },
  comiccon(si) {
    const T0 = sStart(si), tD = pS(si, 3) - .05;
    flash(T0 - .02, .2); scrTo(T0 - .05, SCR.hallh, .25); credit(SCR.hallh, T0, tD);
    c3(T0 - .05, { px: 3.2, py: 4.6, pz: 11.5, tx: 0, ty: 3.0, tz: -4, fov: 40 }); m3(T0, { px: 2.4, py: 4.0, pz: 9.5 }, tD - T0);
    const o = overlay(si); tag(o, 'JULY 2024', 'SAN DIEGO COMIC-CON · HALL H', T0 + .05); tl.to(o.firstChild, { opacity: 0, duration: .15 }, tD - .1);
    scrTo(tD, SCR.doom, .6); credit(SCR.doom, tD + .3, sEnd(si) + 1.2); go3(tD, { sconce: .35, scrZoom: 1 }, sEnd(si) - tD + 1, 'sine.inOut');
    c3(tD, { px: -.6, py: 3.5, pz: 7.6, tx: 0, ty: 3.4, tz: -4, fov: 38 }); m3(tD + .02, { px: -.3, py: 3.2, pz: 6.5 }, sEnd(si) - tD + .9);
    const v = pill(o, 470, 1150, 'DOCTOR DOOM', 76, '#FFFFFF', '#1E5B3A', 44); slam(v, pS(si, 5));
  },
  unmask(si) {
    // the mask comes off: the screen fades to black, the beam dies, a flare builds in the silence
    const T0 = sStart(si);
    go3(T0 + .4, { scrOn: .15, beam: .2, sconce: .15 }, sEnd(si) - T0 - .5, 'power1.in'); sfx('dip', T0 + .5, .6); sfx('hum', T0 + .3, .5);
    flare(sEnd(si) - .55, 1.2);
  },
  twist(si) {
    const T0 = sStart(si);
    flash(T0 - .03, .55); leak(T0, 1.6); v3(T0 - .04, { scrA: SCR.rdj, scrB: SCR.rdj, scrMix: 0, scrZoom: 0 }); go3(T0 - .03, { scrOn: 1, beam: 1, sconce: .5 }, .4, 'power2.out'); sfx('hit', T0, .9); credit(SCR.rdj, T0, sEnd(si));
    c3(T0 - .04, { px: 0, py: 3.4, pz: 6.6, tx: 0, ty: 3.4, tz: -4, fov: 38 }); m3(T0, { px: 0, py: 3.05, pz: 5.4 }, sEnd(si) - T0 + .1, 'sine.inOut');
    const o = overlay(si); const n = pill(o, 470, 1150, 'ROBERT DOWNEY JR.', 70, C.ink, C.accent, 44); slam(n, T0 + .05);
    const r = pill(o, 470, 360, 'IRON MAN → DOCTOR DOOM', 56, '#FFFFFF', '#1E5B3A', 38); pop(r, pS(si, 2));
  },
  payoff(si) {
    const T0 = sStart(si), tK = pS(si, 2) - .05;
    flash(T0 - .02, .2); scrTo(T0 - .05, SCR.logo, .3); go3(T0, { sconce: 1 }, .6);
    c3(T0 - .05, { px: -3.4, py: 4.45, pz: 10.5, tx: 0, ty: 3.2, tz: -4, fov: 40 }); m3(T0, { px: -2.6, py: 3.95, pz: 8.8 }, tK - T0);
    const o = overlay(si); tag(o, '17 DECEMBER', 'RELEASE IN INDIA', T0 + .05); const b = pill(o, 470, 1150, 'SPIDER-MAN RECORD: BROKEN', 52, '#FFFFFF', C.red, 36); slam(b, pS(si, 1) + .3); [o.firstChild, b].forEach(e => tl.to(e, { opacity: 0, duration: .15 }, tK - .1));
    // Thiruvananthapuram: the first show, on a printed ticket
    flash(tK, .12); c3(tK, { px: -.25, py: 1.5, pz: 1.62, tx: -.34, ty: 1.27, tz: 1.2, fov: 30 }); m3(tK + .02, { px: -.28, py: 1.45, pz: 1.55 }, sEnd(si) - tK); v3(tK, { aperture: .00003, exposure: .78 });
    const k = pill(o, 470, 360, 'THIRUVANANTHAPURAM', 56, '#FFFFFF', C.ink, 38); pop(k, tK + .1); const f = pill(o, 470, 470, 'FIRST SHOW · 12:01 AM', 60, C.ink, C.accent, 40); slam(f, pS(si, 3) + .4);
  },
  callback(si) {
    const T0 = sStart(si);
    flash(T0 - .02, .25); v3(T0 - .05, { aperture: .00002, tickets: 0, exposure: 1 });
    c3(T0 - .05, { px: 0, py: 5.0, pz: 12.5, tx: 0, ty: 3.3, tz: -4, fov: 40 }); m3(T0, { px: 0, py: 4.15, pz: 9.0 }, sEnd(si) - T0 + .3, 'sine.inOut');
    const H = hookCard(); tl.set(H.h, { opacity: 0 }, 0); tl.to(H.h, { opacity: 1, duration: .4 }, pS(si, 1) - .1); sfx('thud', pS(si, 1), .7);
  },
};
const THREE = await import('three');
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .22, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, duration: .12 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
function render(t) { W.render(t); placeCallouts(); placeExploded(t); placeDims(); }
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));

})();
