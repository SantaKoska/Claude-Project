<body>

<script src="vendor/gsap.min.js"></script>
<script>
(async function () {
const CFG = JSON.parse(document.getElementById('config').textContent);
const TIM = JSON.parse(document.getElementById('timings').textContent);
const C = CFG.palette, FONT = CFG.font;
const NS = 'http://www.w3.org/2000/svg';
const DUR = TIM.duration;
const SFX = [];
const $ = id => document.getElementById(id);
const sfx = (type, t, gain = 1, extra = {}) => SFX.push(Object.assign({ type, t: +Math.max(0, t).toFixed(3), gain }, extra));

await document.fonts.load(`700 80px ${FONT}`, 'മലയാളം');

// ---------------------------------------------------------------- helpers
function el(tag, attrs = {}, parent) {

function text(parent, x, y, str, size, fill, anchor = 'middle', extra = {}) {

}

  const r = el('rect', { fill: o.fill || C.card, stroke: o.stroke || C.cardStroke, 'stroke-width': o.sw ?? 4 }, g);
  const t = text(g, cx, cy, str, size, o.color || '#fff');

  const w = b.width + padX * 2, h = size * 1.25 + padY * 2;

let uid = 0;

// ---------------------------------------------------------------- defs
$('defs').innerHTML = `

  <radialGradient id="blobC"><stop offset="0" stop-color="${C.glowC}" stop-opacity=".45"/><stop offset="1" stop-color="${C.glowC}" stop-opacity="0"/></radialGradient>

  <radialGradient id="ballGlow"><stop offset="0" stop-color="#FFE9B0" stop-opacity=".8"/><stop offset="1" stop-color="#FFE9B0" stop-opacity="0"/></radialGradient>

  <linearGradient id="handleG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9773D"/><stop offset=".45" stop-color="#F0C48A"/><stop offset="1" stop-color="#9A5B26"/></linearGradient>
  <linearGradient id="busG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0525E"/><stop offset="1" stop-color="#A3162A"/></linearGradient>

  <linearGradient id="tableG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B82E0"/><stop offset="1" stop-color="#1A4FA0"/></linearGradient>
  <linearGradient id="cardG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D2B78"/><stop offset="1" stop-color="#0E1648"/></linearGradient>
  <linearGradient id="interiorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A1E3F"/><stop offset="1" stop-color="#1A0E22"/></linearGradient>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3B3"/><stop offset="1" stop-color="#F7B267"/></linearGradient>
  <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#D9A02B"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020414" flood-opacity=".5"/></filter>
`;

// ---------------------------------------------------------------- background
const blobs = [
  el('circle', { cx: 300, cy: 600, r: 520, fill: 'url(#blobB)' }, $('blobs')),
  el('circle', { cx: 820, cy: 1150, r: 560, fill: 'url(#blobC)' }, $('blobs')),
  el('circle', { cx: 560, cy: 900, r: 420, fill: 'url(#blobA)', opacity: .6 }, $('blobs')),
];
const dust = [];
for (let i = 0; i < 26; i++) dust.push(el('circle', { r: 2 + (i * 7 % 5), fill: '#fff', opacity: 0 }, $('blobs')));

// ---------------------------------------------------------------- hero: paddle + ball
$('hero').innerHTML = document.getElementById('object-svg').content.querySelector('svg').innerHTML;
const heroG = $('hero');
const P = { x: 1000, y: 1380, r: 40, s: .95 };               // paddle state
const BALL = { x: 600, y: 820, s: .9, hop: 0, o: 1 };      // ball state
const ballGlow = el('circle', { r: 80, fill: 'url(#ballGlow)' }, $('ballG'));
const ballC = el('circle', { r: 36, fill: 'url(#ballG2)' }, $('ballG'));
const CAM = { x: 540, y: 960, s: 1, shake: 0 };
const F = { ux: -260, uy: 620, cx: 1340, cy: 620, s: 1, shake: 0 };   // flag badges
const AMB = { dark: 0, lights: 0 };
let NOW = 0;
const HOPW = 5;   // hop angular speed (bounces every PI/HOPW s)

// ---------------------------------------------------------------- reusable drawings
function flagUSA(parent, r) {
  const g = el('g', {}, parent), id = 'fu' + (uid++);
  const cp = el('clipPath', { id }, $('defs')); el('circle', { r }, cp);
  const inner = el('g', { 'clip-path': `url(#${id})` }, g);
  for (let i = 0; i < 9; i++) el('rect', { x: -r, y: -r + i * (2 * r / 9), width: 2 * r, height: 2 * r / 9 + 1, fill: i % 2 ? '#FFFFFF' : '#D62839' }, inner);
  el('rect', { x: -r, y: -r, width: r * 1.05, height: r * .95, fill: '#1D3A8A' }, inner);
  for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) el('circle', { cx: -r * .82 + b * r * .24, cy: -r * .78 + a * r * .22, r: r * .045, fill: '#fff' }, inner);
  el('circle', { r, fill: 'none', stroke: '#fff', 'stroke-width': 8 }, g);
  return g;
}
function flagChina(parent, r) {
  const g = el('g', {}, parent);
  el('circle', { r, fill: '#DE2910' }, g);
  el('path', { d: starPath(-r * .38, -r * .28, r * .32, r * .13), fill: '#FFDE00' }, g);
  [[-.02, -.62], [.14, -.42], [.14, -.14], [-.02, .06]].forEach(([x, y], i) =>
    el('path', { d: starPath(r * x, r * y, r * .1, r * .04, -90 + i * 20), fill: '#FFDE00' }, g));
  el('circle', { r, fill: 'none', stroke: '#fff', 'stroke-width': 8 }, g);
  return g;
}
function figure(parent, x, y, color, s = 1, o = {}) {     // (x,y) = feet
  const g = el('g', { transform: `translate(${x} ${y}) scale(${s})` }, parent);
  el('path', { d: 'M-70 0 L-62 -170 Q-58 -205 0 -210 Q58 -205 62 -170 L70 0 Z', fill: color }, g);
  el('rect', { x: -16, y: -232, width: 32, height: 30, fill: color }, g);
  el('circle', { cx: 0, cy: -272, r: 50, fill: color }, g);
  el('circle', { cx: -16, cy: -288, r: 16, fill: '#fff', opacity: .18 }, g);
  if (o.smile) el('path', { d: 'M-20 -262 Q0 -240 20 -262', stroke: '#fff', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, g);
  return g;
}
function bus(parent) {                                      // facing left, centred
  const g = el('g', {}, parent);
  el('rect', { x: -330, y: -150, width: 660, height: 280, rx: 46, fill: 'url(#busG)', stroke: '#FFB3BA', 'stroke-width': 4 }, g);
  el('path', { d: 'M-330 -40 L-330 -104 Q-330 -150 -284 -150 L-250 -150 L-250 -40Z', fill: 'url(#glassG)' }, g);
  for (let i = 0; i < 5; i++) el('rect', { x: -120 + i * 86, y: -122, width: 70, height: 84, rx: 12, fill: 'url(#glassG)' }, g);
  el('rect', { x: -330, y: 10, width: 660, height: 22, fill: '#FFD166' }, g);
  const door = el('g', {}, g);
  el('rect', { x: -232, y: -122, width: 92, height: 236, rx: 8, fill: '#12223A' }, door);
  const dl = el('rect', { x: -232, y: -122, width: 46, height: 236, fill: 'url(#glassG)', stroke: '#7A1220', 'stroke-width': 4 }, door);
  const dr = el('rect', { x: -186, y: -122, width: 46, height: 236, fill: 'url(#glassG)', stroke: '#7A1220', 'stroke-width': 4 }, door);
  const badge = flagChina(g, 44); badge.setAttribute('transform', 'translate(150 66)');
  [-200, 210].forEach(x => { el('circle', { cx: x, cy: 132, r: 52, fill: '#1B1B24' }, g); el('circle', { cx: x, cy: 132, r: 22, fill: '#9AA3B5' }, g); });
  el('circle', { cx: -318, cy: 70, r: 14, fill: '#FFF3B0', filter: 'url(#glow)' }, g);
  return { g, dl, dr, badge };
}
function paper(parent, cx, cy) {
  const g = el('g', {}, parent);
  el('rect', { x: cx - 120, y: cy - 150, width: 240, height: 300, rx: 6, fill: '#F4EFE3', filter: 'url(#cardShadow)' }, g);
  el('rect', { x: cx - 100, y: cy - 130, width: 200, height: 30, fill: '#1B1B24' }, g);
  el('rect', { x: cx - 100, y: cy - 88, width: 120, height: 90, fill: '#9AA3B5' }, g);
  for (let i = 0; i < 7; i++) el('rect', { x: cx - 100 + (i < 4 ? 130 : 0), y: cy - 88 + (i < 4 ? i * 24 : 110 + (i - 4) * 24), width: i < 4 ? 70 : 200, height: 10, fill: '#B9B2A3' }, g);
  return g;
}

// ---------------------------------------------------------------- timing helpers
const sentences = CFG.sentences.map((s, si) => {
  const ph = TIM.phrases.filter(p => p.sentence === si);
  return Object.assign({}, s, { ph, words: ph.flatMap(p => p.words) });
});
const sStart = si => sentences[si].ph[0].start;
const sEnd = si => si + 1 < sentences.length ? sStart(si + 1) : DUR;
const pS = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].start;
const pE = (si, j) => sentences[si].ph[Math.min(j, sentences[si].ph.length - 1)].end;
const wT = (si, k) => { const w = sentences[si].words; return w[Math.max(0, Math.min(k, w.length - 1))].t; };
const lastW = si => wT(si, sentences[si].words.length - 1);

const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DUR }, 0);

function hide(e) { tl.set(e, { opacity: 0 }, 0); }
function pop(e, t, o = {}) {
  tl.set(e, { opacity: 0, scale: o.from ?? .3, transformOrigin: o.origin || '50% 50%' }, 0);
  tl.to(e, { opacity: 1, scale: 1, duration: o.d || .5, ease: o.ease || 'back.out(2.2)' }, t);
  if (o.sound !== false) sfx(o.sound || 'pop', t, o.gain ?? .9);
}
function fadeIn(e, t, d = .4) { hide(e); tl.to(e, { opacity: 1, duration: d }, t); }
function fadeOut(e, t, d = .35) { tl.to(e, { opacity: 0, duration: d, ease: 'power1.in' }, t); }
function drawPath(p, t, d, ease = 'power2.inOut') {
  const L = p.getTotalLength(); p.setAttribute('stroke-dasharray', L + ' ' + L);
  tl.set(p, { attr: { 'stroke-dashoffset': L } }, 0);
  tl.to(p, { attr: { 'stroke-dashoffset': 0 }, duration: d, ease }, t);
}
function counter(tEl, from, to, t, d, fmt = v => v, ticks = 12) {
  const o = { v: from }; tEl.textContent = fmt(from);
  tl.to(o, { v: to, duration: d, ease: 'power2.out', onUpdate: () => tEl.textContent = fmt(Math.round(o.v)) }, t);
  for (let k = 0; k < ticks; k++) sfx('tick', t + d * (1 - Math.sqrt(1 - k / ticks)), .55);
}
const to = (obj, t, v, d = .9, ease = 'power3.inOut') => tl.to(obj, Object.assign({ duration: d, ease }, v), t);
function crossMark(parent, cx, cy, size, t) {
  const g = el('g', { filter: 'url(#glow)' }, parent);
  [[-1, -1, 1, 1], [1, -1, -1, 1]].forEach(([a, b, c, d], i) => {
    const p = el('path', { d: `M${cx + a * size} ${cy + b * size}L${cx + c * size} ${cy + d * size}`, stroke: C.danger, 'stroke-width': 22, 'stroke-linecap': 'round', fill: 'none' }, g);
    drawPath(p, t + i * .14, .18, 'power2.out');
  });

}
function hop(t0, t1, gain = .35) {          // ball bounces in place between t0..t1
  to(BALL, t0, { hop: 1 }, .25, 'power1.out'); to(BALL, t1, { hop: 0 }, .25, 'power1.in');
  for (let k = Math.ceil(t0 * HOPW / Math.PI); k * Math.PI / HOPW < t1; k++) sfx('ping', k * Math.PI / HOPW, gain);

  const n = pts.length - 1, d = (t1 - t0) / n;
  for (let k = 0; k < n; k++) {
    const o = { u: 0 }, [ax, ay] = pts[k], [bx, by] = pts[k + 1];
    tl.to(o, { u: 1, duration: d, ease: 'none', onUpdate: () => {
      BALL.x = ax + (bx - ax) * o.u; BALL.y = ay + (by - ay) * o.u - h * 4 * o.u * (1 - o.u);

}
const darkR = el('rect', { width: 1080, height: 1920, fill: '#02030A', opacity: 0 }, $('layerScreen'));
const flashR = el('rect', { width: 1080, height: 1920, fill: '#FFFFFF', opacity: 0 }, $('layerScreen'));

// flags (persistent)
const fU = flagUSA($('flags'), 130), fC = flagChina($('flags'), 130);
const fGlow = el('circle', { r: 40, fill: 'none', stroke: C.accent, 'stroke-width': 16, opacity: 0, filter: 'url(#glow)' }, $('flags'));

// ================================================================= SCENES
const scenes = {
  // --------------------------------------------------------------- HOOK
  hook(si, L) {
    const g = el('g', {}, $('layerMid'));
    // speed lines behind the incoming ball
    const speed = el('g', { opacity: 1 }, $('layerBack'));
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      el('path', { d: `M${600 + Math.cos(a) * 230} ${820 + Math.sin(a) * 230}L${600 + Math.cos(a) * 900} ${820 + Math.sin(a) * 900}`, stroke: '#fff', 'stroke-width': 6, opacity: .25 }, speed);
    }
    tl.to(speed, { scale: 1.25, svgOrigin: '600 820', duration: .45, ease: 'power2.in' }, 0);
    fadeOut(speed, .42, .2);
    tl.set(BALL, { x: 600, y: 820, s: .9 }, 0);
    to(BALL, 0, { s: 2.4 }, .45, 'power2.in');
    to(P, 0, { x: 790, y: 1110, r: -22, s: .95 }, .42, 'power3.out');
    sfx('whoosh', 0, .9);
    // smash!
    const tS = .45;
    sfx('ping', tS, 1.6); sfx('thud', tS, .8);
    const ring = el('circle', { cx: 640, cy: 870, r: 60, fill: 'none', stroke: '#fff', 'stroke-width': 14, opacity: 0 }, $('layerFront'));
    tl.set(ring, { opacity: .9 }, tS); tl.to(ring, { attr: { r: 420 }, opacity: 0, duration: .5, ease: 'power2.out' }, tS);
    to(CAM, tS, { shake: 1 }, .05); to(CAM, tS + .05, { shake: 0 }, .4, 'power2.out');
    to(BALL, tS, { x: 930, y: 330, s: 1 }, .6, 'power3.out');
    to(P, tS + .15, { x: 1250, y: 1650, r: 40, s: .9 }, .7, 'power2.in');
    hop(tS + .6, sEnd(si) + 3);
    // the bus pulls in and opens its door
    const B1 = bus(g);
    const bp = { x: 1500 };
    const placeBus = () => B1.g.setAttribute('transform', `translate(${bp.x} 990)`);
    placeBus();
    tl.to(bp, { x: 560, duration: .9, ease: 'power3.out', onUpdate: placeBus }, .3);
    sfx('whoosh', .3, .7);
    tl.to([B1.dl, B1.dr], { attr: { width: 4 }, duration: .3 }, 1.2);
    tl.to(B1.dr, { attr: { x: -144 }, duration: .3 }, 1.2);
    sfx('door', 1.15, .8);
    // "the mistake"
    const st = pill(g, 560, 760, L.mistake, { size: 84, fill: C.danger, stroke: '#FFD6DD', sw: 6 });
    tl.set(st, { rotation: -8, svgOrigin: '560 760' }, 0);
    pop(st, pS(si, 1), { from: 2.2, ease: 'power4.out', d: .3, sound: 'thud' });
    // bus leaves; two superpowers drift together
    const t2 = pS(si, 2);
    fadeOut(st, t2 - .05, .2);
    tl.to(bp, { x: -800, duration: .8, ease: 'power3.in', onUpdate: placeBus }, t2);
    sfx('whoosh', t2, .8);
    to(F, t2 + .2, { ux: 410, cx: 670, uy: 640, cy: 640 }, lastW(si) - t2 - .1, 'power2.inOut');
    const tm = lastW(si) + .1;
    tl.set(fGlow, { opacity: 1, attr: { cx: 540, cy: 640, r: 30 } }, tm);
    tl.to(fGlow, { attr: { r: 330 }, opacity: 0, duration: .7, ease: 'power2.out' }, tm);
    sfx('chime', tm, 1);
    fadeOut(g, sEnd(si) - .05, .2);
  },

  // --------------------------------------------------------------- ENEMIES
  enemies(si, L) {
    const T0 = sStart(si), T1 = sEnd(si);
    const g = el('g', {}, $('layerMid'));
    to(F, T0 - .1, { ux: 220, cx: 860, uy: 800, cy: 800 }, .8);
    sfx('whoosh', T0 - .1, .6);
    const yt = text(g, 540, 470, '', 200, C.accent, 'middle', { filter: 'url(#glow)' });
    fadeIn(yt, T0, .2);
    counter(yt, L.yearFrom, L.year, T0 + .05, pE(si, 0) - T0 - .2, v => v, 12);
    // crack of hostility
    const crack = el('path', { d: 'M540 640 L505 700 L565 760 L515 830 L570 890 L530 960', stroke: C.danger, 'stroke-width': 12, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#glow)' }, g);
    drawPath(crack, pS(si, 1), .35, 'power2.out'); sfx('thud', pS(si, 1) + .05, .9);
    const lu = pill(g, 220, 990, L.left, { size: 50, fill: C.card, stroke: C.usa });
    const lc = pill(g, 860, 990, L.right, { size: 50, fill: C.card, stroke: C.china });
    pop(lu, wT(si, 1), { gain: .6 }); pop(lc, wT(si, 2), { gain: .6 });
    to(F, wT(si, 3), { shake: 1 }, .1); to(F, wT(si, 3) + .5, { shake: 0 }, .3);
    sfx('thud', wT(si, 3), .6);

sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ================================================================= CAPTIONS
const capBox = $('captions');
const MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => {
    const len = cur.reduce((a, b) => a + b.w.length + 1, 0);
    if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; }
    cur.push(w);
  });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tIn = words[0].t - .08;
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, tIn));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 28, scale: .82 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .22, ease: 'back.out(2.5)' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      const tEnd = j + 1 < words.length ? words[j + 1].t - .06 : tOut;
      tl.set(s, { color: '#FFFFFF' }, tEnd);
    });
    tl.to(page, { opacity: 0, y: -18, duration: .1 }, tOut);
    tl.set(page, { y: 0 }, tOut + .15);
  });
});

// ================================================================= RENDER (time-only state)
function render(t) {
  NOW = t;
  const sh = CAM.shake * 18;
  $('cam').setAttribute('transform',
    `translate(${540 + sh * Math.sin(t * 90)} ${960 + sh * Math.cos(t * 77)}) scale(${CAM.s}) translate(${-CAM.x} ${-CAM.y})`);
  heroG.setAttribute('transform', `translate(${P.x} ${P.y}) rotate(${P.r}) scale(${P.s})`);
  const by = BALL.y - BALL.hop * Math.abs(Math.sin(t * HOPW)) * 80;
  ballC.setAttribute('cx', BALL.x); ballC.setAttribute('cy', by); ballC.setAttribute('r', 36 * BALL.s);
  ballGlow.setAttribute('cx', BALL.x); ballGlow.setAttribute('cy', by); ballGlow.setAttribute('r', 80 * BALL.s);
  const wig = F.shake * Math.sin(t * 45) * 7;
  fU.setAttribute('transform', `translate(${F.ux} ${F.uy}) rotate(${wig}) scale(${F.s})`);
  fC.setAttribute('transform', `translate(${F.cx} ${F.cy}) rotate(${-wig}) scale(${F.s})`);
  darkR.setAttribute('opacity', AMB.dark);
  if (window.__lights) window.__lights.forEach((l, i) => l.setAttribute('x', ((t * 420 + i * 157) % 1250) - 120));
  if (window.__placeC) window.__placeC();
  blobs[0].setAttribute('cx', 300 + 80 * Math.sin(t * .35)); blobs[0].setAttribute('cy', 600 + 60 * Math.cos(t * .3));
  blobs[1].setAttribute('cx', 820 + 70 * Math.cos(t * .28)); blobs[1].setAttribute('cy', 1150 + 90 * Math.sin(t * .33));
  blobs[2].setAttribute('cx', 560 + 60 * Math.sin(t * .5 + 1)); blobs[2].setAttribute('cy', 900 + 50 * Math.sin(t * .4));
  dust.forEach((d, i) => {
    const sp = .02 + (i % 5) * .008, y = (1 - ((t * sp + i / dust.length) % 1)) * 2000 - 40;
    d.setAttribute('cx', ((i * 211) % 1080 + 30 * Math.sin(t * .6 + i)).toFixed(1)); d.setAttribute('cy', y.toFixed(1));
    d.setAttribute('opacity', (.12 + .1 * Math.sin(t * 1.5 + i)).toFixed(3));
  });
}

tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR;
window.SFX = SFX.sort((a, b) => a.t - b.t);
window.CONFIG = CFG;
window.READY = true;

const q = new URLSearchParams(location.search);
if (q.has('guides')) {
  const st = $('stage');
  [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => {
    const d = document.createElement('div'); d.className = 'guide';
    Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d);
  });
}
if (q.has('t')) window.seek(parseFloat(q.get('t')));
if (q.has('play')) {
  const a = new Audio(TIM.audio); document.body.addEventListener('click', () => {
    a.currentTime = 0; a.play();
    const loop = () => { window.seek(a.currentTime); if (!a.paused) requestAnimationFrame(loop); }; loop();
  });
}
})();
</script>
</body>
