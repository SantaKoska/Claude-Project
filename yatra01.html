  const g = el('g', {}, UI), X = 60, Y = 250, W = 880, PH = 520;
  el('rect', { x: X, y: Y, width: W, height: PH + 200, rx: 30, fill: '#FFFFFF', filter: 'url(#shadowC)' }, g);
  const cid = 'pc' + (clipN++); const cp = el('clipPath', { id: cid }, $('defs')); el('path', { d: `M${X} ${Y + PH} L${X} ${Y + 30} Q${X} ${Y} ${X + 30} ${Y} L${X + W - 30} ${Y} Q${X + W} ${Y} ${X + W} ${Y + 30} L${X + W} ${Y + PH} Z` }, cp);
  const ph = el('g', { 'clip-path': `url(#${cid})` }, g); el('rect', { x: X, y: Y, width: W, height: PH, fill: '#CCD6DD' }, ph);
  const n = photos.length, seg = (t1 - t0) / n;
  photos.forEach((p, i) => { const im = el('image', { href: p.src, x: X, y: Y, width: W, height: PH, preserveAspectRatio: 'xMidYMid slice' }, ph);
    const a = t0 + i * seg, z0 = i % 2 ? 1.12 : 1.0, z1 = i % 2 ? 1.0 : 1.12; tl.set(im, { opacity: i ? 0 : 1, scale: z0, transformOrigin: `${X + W / 2}px ${Y + PH / 2}px` }, 0);
    tl.to(im, { scale: z1, duration: seg + .6, ease: 'none' }, a - .3); if (i) tl.to(im, { opacity: 1, duration: .5 }, a - .25); });
  const cr = el('rect', { x: X + W - 18, y: Y + PH - 42, width: 0, height: 0 }, ph); // (credits live in the description)
  el('circle', { cx: X + 70, cy: Y + PH + 82, r: 40, fill: '#EA4335' }, g); text(g, X + 70, Y + PH + 84, String(stop.n), 44, '#FFFFFF');
  const tt = text(g, X + 132, Y + PH + 62, stop.card, 44, '#14110C', 'start'); const ln = text(g, X + 132, Y + PH + 124, stop.line, 30, '#5F6368', 'start', { 'font-weight': 600 });
  [tt, ln].forEach(e => { const w = e.getBBox().width; if (w > 700) e.setAttribute('font-size', (+e.getAttribute('font-size') * 700 / w).toFixed(1)); });
  tl.set(g, { opacity: 0, scale: .3, transformOrigin: '540px 1150px' }, 0); tl.to(g, { opacity: 1, scale: 1, duration: .45, ease: 'back.out(1.4)' }, t0); tl.to(g, { opacity: 0, scale: .3, duration: .3, ease: 'power2.in' }, t1 - .3); sfx('pop', t0, .6); sfx('whoosh', t1 - .3, .35);
  // chips under the card, one per time
  chips.forEach(([str, t, col], i) => { const c = pill(UI, 540, Y + PH + 200 + 70 + (i % 2) * 0, str, 38, '#FFFFFF', col || '#14110C', 30); const nx = chips[i + 1] ? chips[i + 1][1] : t1; tl.set(c, { opacity: 0 }, 0); tl.to(c, { opacity: 1, duration: .3 }, t); tl.to(c, { opacity: 0, duration: .2 }, Math.min(nx, t1) - .22); sfx('pop', t, .4); });
  return g;
}
const photo = (n, k) => ({ src: `build/yatra/ep01/photos/s${n}_${k}.jpg` });
const PH = JSON.parse(document.getElementById('photos').textContent);

// the traveller drives leg i between t0 and t1 (camera follows when follow = 1)
function drive(i, t0, t1, ease = 'power1.inOut') { v3(t0 - .02, { leg: i, u: 0, mode: D.legs[i].mode, preview: -1 }); go3(t0, { u: 1 }, t1 - t0, ease); sfx('whoosh', t0, .25); }
function arrive(i, t) { v3(t, { visited: i + 1, bounceI: i, bounce: 0 }); go3(t, { bounce: 1 }, .5, 'power1.out'); sfx('chime', t, .5); }

const scenes = {
  space(si) {
    // the Earth turns, the camera dives to India; India's official outline traces; then the flat satellite map takes over
    v3(0, { globe: 1, india: 0, kerala: 0, dists: 0, labels: 0, route: 0, marker: 0, pinsOn: 0, plane: 0, follow: 0, distHi: 0, nextHi: 0, exitU: 0, visited: 0, leg: -1, u: 0, bounce: 0, bounceI: -1 });
    gSet(0, { lat: 10, lon: 28, dist: 5.4 }); gTo(.05, { lat: 21, lon: 80, dist: 2.05 }, pS(si, 2) + .3, 'power2.inOut');
    go3(pS(si, 1) + .05, { india: 1 }, 1.4, 'power1.inOut'); sfx('shimmer', pS(si, 1), .6);
    const tx = pS(si, 2) + .1; go3(tx, { globe: 0 }, .7, 'power1.inOut'); sfx('whoosh', tx, .5);
    camSet(0, camAt(...merc(80.5, 21.5), 128)); camTo(tx + .1, camAt(KC[0] + .0003, KC[1] + .0016, 22), sEnd(si) - tx + .2, 'power2.inOut');
    go3(pS(si, 4) - .1, { kerala: 1 }, .5, 'power1.out'); go3(pS(si, 4), { india: .35 }, .6); sfx('chime', pS(si, 4), .5);
    // opening card: bright, big, from frame 0
    const o = el('g', {}, UI); el('rect', { x: 90, y: 270, width: 820, height: 250, rx: 34, fill: '#FFC94A', filter: 'url(#shadowS)' }, o);
    text(o, 500, 352, 'KERALA YATRA', 96, '#14110C'); text(o, 500, 450, '14 DISTRICTS · ONE JOURNEY', 40, '#14110C', 'middle', { 'font-weight': 700 });
    tl.set(o, { opacity: 1 }, 0); hide(o, pS(si, 3));
    const k = pill(UI, 500, 330, 'KERALA', 70, '#14110C', '#FFC94A', 44); pop(k, pS(si, 4)); hide(k, sEnd(si) + .4);
  },
  purpose(si) {
    // all 14 districts draw in, numbered in road order; Thiruvananthapuram lights up
    camTo(sStart(si), camAt(KC[0] + .0003, KC[1] + .0015, 20.5), sEnd(si) - sStart(si), 'sine.inOut');
    go3(pS(si, 1) - .1, { dists: 1, labels: 1 }, 3.0, 'none'); for (let k = 0; k < 14; k++) sfx('tick', pS(si, 1) + k * 3 / 14, .5);
    const a = pill(UI, 500, 330, '14 DISTRICTS', 60, '#FFFFFF', '#14110C', 40); pop(a, pS(si, 1) + .5); hide(a, pS(si, 3) - .1);
    const b = pill(UI, 500, 330, '5 PLACES IN EACH', 60, '#14110C', '#FFC94A', 40); pop(b, pS(si, 3)); hide(b, pS(si, 4) - .1);
    const c1 = pill(UI, 500, 310, 'HOW TO GET THERE', 46, '#FFFFFF', '#1A73E8', 34); pop(c1, pS(si, 4)); const c2 = pill(UI, 500, 405, 'WHAT TO SEE', 46, '#FFFFFF', '#188038', 34); pop(c2, pS(si, 5)); hide(c1, sEnd(si) - .2); hide(c2, sEnd(si) - .2);
    go3(pS(si, 4), { distHi: 1 }, .8);
  },
  land(si) {
    // drop into Thiruvananthapuram; the plane glides onto the airport; the day's five pins drop
    const T0 = sStart(si);
    go3(T0, { labels: 0, dists: .999 }, .6); camTo(T0, camAt(distBox[0], distBox[1] + .00045, 3.1, 18), 2.0, 'power2.inOut');
    const o = el('g', {}, UI); el('rect', { x: 90, y: 260, width: 820, height: 210, rx: 30, fill: '#14110C', opacity: .92 }, o); el('rect', { x: 90, y: 260, width: 14, height: 210, fill: '#FFC94A' }, o);
    text(o, 500, 320, 'KERALA YATRA · EP 1/14', 44, '#FFC94A'); const tvm = text(o, 500, 405, 'THIRUVANANTHAPURAM', 64, '#FFFFFF'); const w = tvm.getBBox().width; if (w > 760) tvm.setAttribute('font-size', (64 * 760 / w).toFixed(1));
    pop(o, T0 + .3); hide(o, sEnd(si) - .1);
    v3(pS(si, 1) - .4, { plane: 1, planeU: 0 }); go3(pS(si, 1) - .4, { planeU: 1 }, 2.1, 'power2.out'); sfx('whoosh', pS(si, 1) - .3, .7);
    v3(sEnd(si) - .35, { plane: 0, marker: 1, route: 1 }); go3(sEnd(si) - .9, { pinsOn: 1 }, .8, 'power1.out'); for (let k = 0; k < 5; k++) sfx('pop', sEnd(si) - .9 + k * .16, .3);
  },
  stop1(si) { stopScene(si, 0, [0], pS(si, 2)); },
  stop2(si) {
    const s2 = sIdx('stop2b');
    stopScene(si, 1, [1], pS(si, 2), sEnd(s2), [['THIRU · ANANTHA · PURAM', pS(si, 4) - .1, '#14110C'], ['2011 · ₹1 LAKH CRORE+ TREASURE', pS(s2, 0) + .2, '#B06000'], ['DRESS CODE: MUNDU / SAREE', pS(s2, 2), '#14110C']]);
  },
  stop2b() {},
  stop3(si) { stopScene(si, 2, [2], pS(si, 1), sEnd(si), [['OPENED 1880', pS(si, 2), '#14110C'], ['CLOSED MONDAYS', pS(si, 3), '#C5221F']]); },
  stop4(si) {
    // the long climb: the camera pulls out to the district while the bus drives
    stopScene(si, 3, [3], pS(si, 3) - .3, sEnd(si), [['1,100 m · IN THE MIST', pS(si, 4), '#14110C']], { wide: true, hairpin: pS(si, 2) });
  },
  stop5(si) { stopScene(si, 4, [4, 5], pS(si, 2), sEnd(si), [['TRAIN · ~1 h FROM THE CITY', pS(si, 4), '#1A73E8']], { wide: true }); },
  handoff(si) {
    // the whole day on the map, then the traveller drives north and Kollam lights up
    const T0 = sStart(si);
    camTo(T0, camAt(D.pts.next[0] * .5 + distBox[0] * .5, distBox[1] - .0002, 5.6, 12), 2.2, 'power2.inOut');
    v3(T0, { follow: 0 }); go3(T0 + .2, { labels: 1 }, 1.0, 'none'); go3(pS(si, 1), { exitU: 1 }, pS(si, 3) - pS(si, 1) + .1, 'power1.inOut'); sfx('whoosh', pS(si, 1), .4);
    go3(pS(si, 3), { nextHi: 1 }, .6); sfx('chime', pS(si, 3), .6);
    const p = pill(UI, 500, 330, 'NEXT · EP 2/14 · KOLLAM', 56, '#FFFFFF', '#188038', 38); pop(p, pS(si, 3) + .05);
    const d = pill(UI, 500, 430, '5 PLACES · 1 DAY', 40, '#14110C', '#FFC94A', 30); pop(d, T0 + .4);
  },
};
// one stop: preview dashed line, nav bar, drive with the camera following, arrive, place card with photos and chips
function stopScene(si, k, legs, tArrive, tEnd, chips = [], opt = {}) {
  const T0 = sStart(si), stop = D.ep.stops[k], L0 = D.legs[legs[0]];
  const km = legs.reduce((a, i) => a + D.legs[i].km, 0), mins = legs.reduce((a, i) => a + D.legs[i].min, 0);
  const modeTxt = legs.map(i => ICON[D.legs[i].mode]).filter((v, j, a) => a.indexOf(v) === j).join(' + ');
  const sub = k === 3 ? `${Math.round(km)} km · ${modeTxt} FROM THAMPANOOR` : k === 4 ? `BUS TO THE CITY + TRAIN` : `${km < 10 ? km.toFixed(1) : Math.round(km)} km · ${fmtMin(mins)} · ${modeTxt}`;
  v3(T0 - .3, { preview: legs[0] });
  const tD1 = tArrive - .1, tD0 = T0 + .15, per = (tD1 - tD0) / legs.length;
  legs.forEach((li, j) => drive(li, tD0 + j * per, tD0 + (j + 1) * per - .02));
  navBar(stop.name.toUpperCase(), sub, T0, tArrive + .1);
  if (opt.wide) { v3(T0 - .05, { follow: 0 }); camTo(T0 - .05, camAt(...(k === 3 ? [(D.pts.stops[2][0] + D.pts.stops[3][0]) / 2, (D.pts.stops[2][1] + D.pts.stops[3][1]) / 2 + .0006] : [distBox[0] - .0004, distBox[1] + .0006]), 3.3, 22), 1.2, 'power2.inOut'); }
  else { v3(T0 - .05, { follow: 1 }); camTo(T0 - .05, { h: k === 0 ? 1.1 : .7, tilt: 34 }, .9, 'power2.inOut'); }
  if (opt.hairpin) { const c = pill(UI, 500, 470, '22 HAIRPIN BENDS', 48, '#14110C', '#FFC94A', 34); pop(c, opt.hairpin); hide(c, tArrive - .1); }
  arrive(k, tArrive - .05);
  const photos = (PH[stop.n] || []).map(i => photo(stop.n, i));
  placeCard(stop, photos.length ? photos : [photo(stop.n, 0)], tArrive, tEnd ?? sEnd(si), chips);
}
sentences.forEach((s, si) => scenes[s.scene](si));

// ---------------------------------------------------------------- captions (Malayalam, word by word)
const capBox = $('captions'), MAXCH = 30;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .22, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0); tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06)); tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut); });
    tl.to(page, { opacity: 0, duration: .12 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
const FOLLOW_N = .00009; // look-ahead to the north so the traveller sits low on screen, under the cards
function render(t) {
  if (ST.follow > 0 && ST.leg >= 0) { const [X, Y] = M.where(ST.leg, ST.u); const p = M.w(X, Y - FOLLOW_N * ST.cam.h); ST.cam.x += (p.x - ST.cam.x) * ST.follow; ST.cam.z += (p.z - ST.cam.z) * ST.follow; }
  M.render(t);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.__M = M; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
