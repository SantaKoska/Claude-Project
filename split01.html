const CAMS = { s: 1, ox: 540, oy: 900 };
const camTo = (t, v, d, ease = 'sine.inOut') => tl.to(CAMS, Object.assign({ duration: d, ease }, v), t);
const front = $('front');
// visible = shown from frame 0 (never two sets of the same property at t=0: gsap reverts them in the wrong order)
const ov = (visible = false) => { const g = el('g', {}, front); if (!visible) tl.set(g, { opacity: 0 }, 0); return g; };
const lab = (k, t) => { tl.to(L[LI[k]], { lab: 1, duration: .45, ease: 'back.out(1.6)' }, t); sfx('pop', t, .45); };
const reveal = (k, t) => { tl.to(L[LI[k]], { c: 1, duration: .4, ease: 'power2.out' }, t); };
let left = 15;
const spend = (v, t) => { counter(mVal, left, left - v, t, .5, rs); left -= v; sfx('coin', t, .55); };
// remove the counter set at 0 for later tweens (counter() sets text at 0 each call; keep the first)
const scenes = {
  hook(si) {
    // bright first frame: white tiles, a glass of tea on the counter, the price on a lime bar
    tl.set(G, { x: 540, y: 1172, s: 1, E: 0, tea: 1, glass: 1, steam: 0, fill: .28, pour: 1 }, 0);
    const fe = pE(si, 0) + .1; tl.to(G, { fill: 1, duration: fe, ease: 'sine.out' }, 0); tl.to(G, { pour: 0, duration: .35, ease: 'power2.in' }, fe); tl.to(G, { steam: 1, duration: .8 }, fe);
    sfx('wave', 0, .5); sfx('wave', .9, .4);
    tl.set(money, { opacity: 0 }, 0); tl.set(approx, { opacity: 0 }, 0);
    const T = ov(true); titleBar(T, 540, 296, 'ഒരു ഗ്ലാസ് ചായ', '₹15', { bigSize: 150, gap: 128 });
    camTo(0, { s: 1.05 }, pS(si, 2));
    const q = ov(true); const qp = pill(q, 795, 700, 'ലാഭം = ?', { size: 54, bg: C.navy, fg: C.lime }); pop(qp, pW(si, 1, 2));
    const t3 = pW(si, 2, 3);           // "പിളർന്ന്"
    tl.to(T, { opacity: 0, y: -40, duration: .3 }, t3 - .2); tl.to(q, { opacity: 0, duration: .25 }, t3 - .2);
    tl.to(G, { x: 290, y: 1150, s: .86, gap: 26, duration: .7, ease: 'power3.inOut' }, t3 - .1); camTo(t3 - .1, { s: 1 }, .7, 'power3.inOut');
    flash(t3 + .25, .35); sfx('hit', t3 + .25, .9);
    tl.to(G, { E: 1, tea: 0, steam: 0, glass: .25, duration: .9, ease: 'power3.out' }, t3 + .25);
    tl.to(money, { opacity: 1, duration: .3 }, t3 + .6); 
    tl.to(approx, { opacity: 1, duration: .3 }, t3 + .9);
  },
  costs1(si) {
    // each cost lights up its layer, gets a label, and leaves the ₹15 card
    reveal('milk', pS(si, 0) + .2); lab('milk', pS(si, 0) + .25); spend(3.92, pS(si, 1) + .2);
    reveal('sugar', pS(si, 2)); lab('sugar', pS(si, 2) + .05); spend(.61, pS(si, 3) + .1);
    reveal('gas', pS(si, 4)); lab('gas', pS(si, 4) + .05); spend(.60, pS(si, 5) + .1);
    camTo(sStart(si), { s: 1.04, oy: 760 }, sEnd(si) - sStart(si));
  },
  costs2(si) {
    reveal('rent', pS(si, 0)); lab('rent', pS(si, 0) + .05); spend(1.67, pS(si, 1) + .1);
    reveal('helper', pS(si, 2)); lab('helper', pS(si, 2) + .05); spend(2.50, pS(si, 3) + .1);
    const to = pE(si, 3) + .15; reveal('other', to); lab('other', to + .05); spend(.25, to + .1);
    // the silence beat: everything we know dims, the last grey layer waits
    const hb = pE(si, 3) + .55; tl.to(L.slice(0, 6), { dim: 1, duration: .5 }, hb); sfx('dip', hb, .8);
    tl.set(G, { ringOn: LI.tea }, 0); tl.to(G, { ring: 1, duration: .35 }, hb + .1);
    camTo(sStart(si), { s: 1.0, oy: 900 }, .8);
  },
  twist(si) {
    reveal('tea', pS(si, 0)); lab('tea', pS(si, 0) + .05);
    const T = ov(); titleBar(T, 540, 292, 'ചായയുടെ ഹീറോ', 'ചായപ്പൊടി', { bigSize: 96, gap: 108 }); show(T, pS(si, 1), .3); tl.to(approx, { opacity: 0, duration: .2 }, pS(si, 1));
    const big = ov(true); const bp = pill(big, 290, 300, '₹0.60', { size: 120, bg: C.lime, fg: C.ink, pad: 46 });
    tl.to(T, { opacity: 0, duration: .2 }, pS(si, 3) - .15); slam(bp, pW(si, 3, 1)); spend(.60, pW(si, 3, 1));
    for (let k = 0; k < 3; k++) sfx('chime', pW(si, 3, 1) + .15 + k * .08, .3);
    tl.to(G, { ring: 0, duration: .3 }, sEnd(si) - .3); tl.to(big, { opacity: 0, duration: .25 }, sEnd(si) - .25);
  },
  profit(si) {
    tl.to(L.slice(0, 7), { dim: .55, duration: .4 }, pS(si, 0));
    reveal('profit', pS(si, 0)); tl.to(L[LI.profit], { glow: 1, duration: .5 }, pS(si, 0) + .1); sfx('shimmer', pS(si, 0), .6);
    lab('profit', pS(si, 1));
    tl.to(mVal, { fill: C.lime, duration: .1 }, pS(si, 1)); tl.set(mLbl, { textContent: 'ലാഭം / ഗ്ലാസ്' }, pS(si, 1)); tl.set(mVal, { textContent: '≈ ₹4.85' }, pS(si, 1) + .55);
    const T = ov(); titleBar(T, 540, 292, 'ഓരോ ഗ്ലാസിലും', 'ലാഭം ≈ ₹5', { bigSize: 100, gap: 108 }); slam(T, pS(si, 2));
    tl.to(T, { opacity: 0, duration: .2 }, sEnd(si) - .3);
    camTo(pS(si, 0), { s: 1.06, oy: 640 }, sEnd(si) - pS(si, 0));
  },
  volume(si) {
    const t0 = sStart(si) - .05; slide($('set_glass'), vSet, t0); camTo(t0, { s: 1, oy: 900 }, .6, 'power3.inOut');
    pop(board.firstChild ? board : board, t0 + .55, .45, null);
    // 100 a day: the first row fills, and all of it goes to rent + wage
    const a = pW(si, 1, 1), b = pE(si, 1);
    cups[0].forEach((c, k) => { const t = a + k * (b - a - .5) / 10; tl.set(c, { attr: { fill: '#E9EDF7' } }, t); sfx('tick', t, .4); });
    pop(zero, b - .3);
    hide(br1); show(br1, pS(si, 2), .35); cups[0].forEach((c, k) => tl.set(c, { attr: { fill: '#F5A47C' } }, pS(si, 2) + .05 * k));
    const c0 = pS(si, 3), c1 = pW(si, 3, 2);
    cups[1].forEach((c, k) => { const t = c0 + k * (c1 - c0) / 10; tl.set(c, { attr: { fill: C.lime } }, t); sfx('tick', t, .45); });
    hide(br2); show(br2, c1, .3);
    hide(month); tl.to(month, { opacity: 1, duration: .25 }, pW(si, 3, 3)); counter(monthVal, 0, 29000, pW(si, 3, 3), 1.4, v => '≈ ' + rk(Math.round(v / 100) * 100) + ' / മാസം');
    for (let k = 0; k < 12; k++) sfx('tick', pW(si, 3, 3) + k * .1, .4); sfx('coin', pW(si, 3, 3) + 1.4, .7);
    camTo(t0 + .7, { s: 1.03 }, sEnd(si) - t0 - .8);
  },
  startup(si) {
    const t0 = sStart(si) - .05; slide(vSet, uSet, t0); camTo(t0, { s: 1, oy: 900 }, .6, 'power3.inOut');
    hide(uTitle); show(uTitle, t0 + .5, .3);
    // the photo (if we have one) leads, then the list builds while the items drop onto the counter
    const items = [[uPills[0], null, pS(si, 2), pS(si, 3)], [uPills[1], boiler, pS(si, 4), pS(si, 5)], [uPills[2], cyl, pS(si, 6), pS(si, 7)], [uPills[3], glasses, pS(si, 8), null]];
    items.forEach(([p, it, ta]) => { pop(p, ta, .4); if (it) dropIn(it, ta + .1); });
    hide(shelf);
    tl.set(photoG, { opacity: 0 }, 0); if (photoG.childNodes.length) { tl.set(photoG, { opacity: 1 }, pS(si, 1)); tl.fromTo(photoG, { y: 900, rotation: 8, transformOrigin: '50% 50%' }, { y: 0, rotation: 0, duration: .55, ease: 'back.out(1.4)', immediateRender: false }, pS(si, 1)); sfx('whoosh', pS(si, 1), .5);
      tl.to(photoG, { y: -1200, duration: .45, ease: 'power2.in' }, pS(si, 2) - .25); }
    camTo(t0 + .7, { s: 1.04, oy: 1000 }, sEnd(si) - t0 - .8);
  },
  papers(si) {
    const t0 = sStart(si) - .05; slide(uSet, pSet, t0); camTo(t0, { s: 1, oy: 900 }, .6, 'power3.inOut');
    hide(pTitle); show(pTitle, t0 + .45, .3);
    dropIn(pap1, pS(si, 1) - .1, -400); hide(st1); slam(st1, pS(si, 3) + .1);
    dropIn(pap2, pS(si, 4), -400); hide(st2); slam(st2, pW(si, 4, 6));
    hide(pNote); show(pNote, pS(si, 3) + .4, .3);
    camTo(t0 + .7, { s: 1.03 }, sEnd(si) - t0 - .8);
  },
  callback(si) {
    const t0 = sStart(si) - .05; slide(pSet, $('set_glass'), t0); camTo(t0, { s: 1, oy: 900 }, .6, 'power3.inOut');
    // the layers snap back into the glass (all colours still showing); the thin tea-powder band is ringed
    tl.set(L, { dim: 0, glow: 0 }, t0); tl.set(L.map((l, i) => i).filter(i => i !== LI.tea).map(i => L[i]), { lab: 0 }, t0);
    tl.set(money, { opacity: 0 }, t0); tl.set(approx, { opacity: 0 }, t0);
    tl.set(G, { x: 540, y: 1172, s: 1, E: 1, glass: .25 }, t0);
    tl.to(G, { E: 0, glass: 1, duration: .8, ease: 'power3.inOut' }, t0 + .55); sfx('thud', t0 + 1.3, .6);
    tl.to(L[LI.tea], { lab: 0, duration: .2 }, t0 + .4);
    tl.set(G, { ringOn: LI.tea }, t0); tl.to(G, { ring: 1, duration: .3 }, pS(si, 1));
    const T = ov(); titleBar(T, 540, 296, 'ചായപ്പൊടിക്ക്', 'വെറും ₹0.60', { bigSize: 120, gap: 124 }); slam(T, pS(si, 1));
    const sr = ov(true); const sp = pill(sr, 540, 1262, 'ഒരു രൂപയുടെ കണക്ക് · EP 1', { size: 40, bg: C.navy, fg: '#FFFFFF' }); pop(sp, pE(si, 1) + .2);
    camTo(t0 + .7, { s: 1.05 }, DUR - t0 - .7);
  }
};
sentences.forEach((s, si) => scenes[s.scene](si));

// ---------------------------------------------------------------- captions: navy box, word by word, money words underlined
const capBox = $('captions'), MAXCH = 22;
const isNum = w => /[0-9₹]|രൂപ|പൈസ|പതിനായിരം|മുപ്പതിനായിരം|ഇരുപത്തൊമ്പതിനായിരം|അയ്യായിരത്തിലധികം|പൂജ്യം/.test(w);
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const box = document.createElement('div'); box.className = 'box'; page.appendChild(box);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .12 : (pi + 1 < TIM.phrases.length ? Math.min(next - .1, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 0, scale: .92 }, 0); tl.to(page, { opacity: 1, scale: 1, duration: .18, ease: 'back.out(2)' }, Math.max(0, words[0].t - .1));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w' + (isNum(w.w) ? ' num' : ''); s.textContent = w.w; box.appendChild(s);
      tl.set(s, { opacity: .35 }, 0); tl.set(s, { opacity: 1, color: C.lime }, Math.max(0, w.t - .05));
      tl.set(s, { color: '#FFFFFF' }, j + 1 < words.length ? words[j + 1].t - .05 : tOut);
    });
    tl.set(page, { opacity: 0 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
const tiles = $('tiles'), leaves = $('leaves'), cam = $('cam');
function render(t) {
  drawGlass(t);
  const wx = WX.v; tiles.setAttribute('patternTransform', `translate(${(wx % 120).toFixed(2)} 0)`); const lw = ((wx % 1080) + 1080) % 1080; leaves.setAttribute('transform', `translate(${(lw > 540 ? lw - 1080 : lw).toFixed(2)} 0)`);
  cam.setAttribute('transform', `translate(${CAMS.ox} ${CAMS.oy}) scale(${CAMS.s.toFixed(4)}) translate(${-CAMS.ox} ${-CAMS.oy})`);
}
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));
})();
</script>
</body>
