    const sp = pill(o, 540, 360, 'ONE CORNER FIRES', 56, '#FFFFFF', C.ink, 36); pop(sp, t2 + .25);
    sfx('dip', t3 + .9, .6);
  },
  twist(si) {
    const T0 = sStart(si);
    v3(T0 - .05, Object.assign({}, STUDIO, { pose: 0, padZ: 0, padYaw: 0, ghost: 0, jets: 1, jetMask: BIT(0), jetLen: 1.6, frost: 0, aperture: .00009 }));
    c3(T0 - .05, { px: 1.5, py: 1.95, pz: 2.2, tx: 2.3, ty: .42, tz: 1.02, fov: 40 }); m3(T0, { px: 1.65, py: 1.8, pz: 2.15 }, sEnd(si) - T0);
    go3(T0 + .2, { frost: 1 }, 2.6, 'power1.inOut'); sfx('hiss', T0, .7);
    const o = overlay(si);
    const a = pill(o, 540, 340, 'NO FUEL', 64, '#FFFFFF', C.ink, 40), b = pill(o, 540, 440, 'NO FLAME', 64, '#FFFFFF', C.ink, 40), c = pill(o, 540, 560, 'JUST AIR', 88, C.ink, C.accent, 50);
    pop(a, wAt(si, 'fuel', 2.2)); pop(b, wAt(si, 'flame', 2.7)); slam(c, wAt(si, 'just', 3.3));
  },
  cleared(si) {
    const T0 = sStart(si), t1 = pS(si, 1);
    const names = [['cybercab', 0, 'CYBERCAB'], ['cybertruck', 0, 'CYBERTRUCK'], ['semi', 0, 'SEMI'], ['model', 0, 'MODEL Y'], ['model', 1, 'MODEL 3']];
    const uV = W.vehX.map(x => (x + 24) / 26);
    flash(T0 - .02, .25);
    v3(T0 - .05, Object.assign({}, STUDIO, { pose: 2, flightU: .1, jets: 0, jetMask: BOTTOM, jetLen: 1.3, ghost: 0, aperture: .00001 }));
    let tp = T0, up = .1; const keys = names.map(([w, n], i) => ({ t: wAtN(si, w, n, 1 + i) + .12, u: uV[i] }));
    keys.forEach(k => { const d = Math.max(.2, k.t - tp); go3(tp, { flightU: k.u }, d, 'none'); tp = k.t; up = k.u; });
    const uEnd = .835; go3(tp, { flightU: uEnd }, t1 - tp, 'none'); go3(t1, { flightU: uEnd + .03 }, sEnd(si) - t1, 'none');
    go3(T0 + .3, { jets: 1 }, .15); go3(T0 + 1.6, { jets: .25 }, .6);
    // tracking camera alongside the row, matched to the car's x at each key
    const fx = u => W.flightAt(u).p.x; const cam0 = { px: fx(.1) + 2.5, py: 2.6, pz: 27, tx: fx(.1) + 1.5, ty: 3.4, tz: 9, fov: 40 };
    c3(T0 - .05, cam0); let tc = T0; [{ t: keys[0].t, u: keys[0].u }, ...keys.slice(1), { t: t1, u: uEnd }].forEach(k => { m3(tc, { px: fx(k.u) + 2.5, tx: fx(k.u) + .3, ty: 4.2, py: 3.0 }, Math.max(.2, k.t - tc), 'none'); tc = k.t; });
    const o = overlay(si); names.forEach(([w, n, s], i) => { const c = callout(o, 'veh' + i, s, keys[i].t - .1, i % 2 ? 1 : -1, 200); tl.to(c, { opacity: 0, duration: .15 }, i < 4 ? keys[i + 1].t - .15 : t1 - .1); });
    sfx('whoosh', T0 + .3, .7);
    // with no one inside: close on the empty cockpit while it is still in the air
    const P = u => { W.ST.pose = 2; W.ST.flightU = u; W.render(0); return W.anchor('cockpit'); };
    const a = P(uEnd), b = P(uEnd + .03);
    v3(t1 - .03, { ghost: .55, aperture: .00004 });
    c3(t1 - .03, { px: a.x + 1.6, py: a.y + .9, pz: a.z + 2.6, tx: a.x, ty: a.y, tz: a.z, fov: 32 }); m3(t1, { px: b.x + 1.5, py: b.y + .8, pz: b.z + 2.4, tx: b.x, ty: b.y, tz: b.z }, sEnd(si) - t1, 'none');
    const ni = pill(o, 540, 360, 'NO ONE INSIDE', 66, '#FFFFFF', C.ink, 40); pop(ni, wAt(si, 'one', 5.8));
  },
  callback(si) {
    const T0 = sStart(si);
    flash(T0 - .02, .3);
    v3(T0 - .05, Object.assign({}, STUDIO, { pose: 0, tankVis: 1, carLift: 1.5, jets: 1, jetMask: BOTTOM, jetLen: 1.0, aperture: .00009, ghost: 0, sweep: 0 }));
    go3(T0, { carLift: 0 }, 1.6, 'power2.out'); go3(T0 + 1.3, { jets: 0 }, .5);
    c3(T0 - .05, { px: 3.2, py: 1.0, pz: 5.4, tx: 2.7, ty: 1.0, tz: 4.4, fov: 28 }); m3(T0, Object.assign({}, TANKCAM), sEnd(si) - T0 + .3, 'sine.inOut');
    go3(T0 + .2, { sweep: 1 }, 2.4, 'sine.inOut'); sfx('hiss', T0 + .1, .4);
    const h = el('g', {}, $('front')); text(h, 540, 330, 'A TANK OF AIR', 118, C.ink, 'middle', HS); tl.set(h, { opacity: 0 }, 0); tl.to(h, { opacity: 1, duration: .4 }, wAt(si, 'tank', 1.2) - .1);
  },
};
const THREE = await import('three');
sentences.forEach((s, si) => scenes[s.scene](si, s.labels || {}));

// ---------------------------------------------------------------- captions
const capBox = $('captions'), MAXCH = 26;
TIM.phrases.forEach((ph, pi) => {
  const pages = []; let cur = [];
  ph.words.forEach(w => { const len = cur.reduce((a, b) => a + b.w.length + 1, 0); if (cur.length && len + w.w.length > MAXCH) { pages.push(cur); cur = []; } cur.push(w); });
  if (cur.length) pages.push(cur);
  const next = pi + 1 < TIM.phrases.length ? TIM.phrases[pi + 1].start : DUR;
  pages.forEach((words, k) => {
    const page = document.createElement('div'); page.className = 'page'; capBox.appendChild(page);
    const tOut = k + 1 < pages.length ? pages[k + 1][0].t - .2 : (pi + 1 < TIM.phrases.length ? Math.min(next - .06, ph.end + .9) : DUR + 1);
    tl.set(page, { opacity: 1 }, Math.max(0, words[0].t - .08));
    words.forEach((w, j) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w.w; page.appendChild(s);
      tl.set(s, { opacity: 0, y: 20, scale: .9 }, 0);
      tl.to(s, { opacity: 1, y: 0, scale: 1, duration: .25, ease: 'power2.out' }, Math.max(0, w.t - .06));
      tl.set(s, { color: C.accent }, Math.max(0, w.t - .06));
      tl.set(s, { color: '#F3EEE4' }, j + 1 < words.length ? words[j + 1].t - .06 : tOut);
    });
    tl.to(page, { opacity: 0, duration: .15 }, tOut);
  });
});

// ---------------------------------------------------------------- time-only render
function render(t) { W.render(t); placeCallouts(); placeExploded(t); placeDims(); }
tl.seek(DUR, false); tl.seek(0, false); render(0);
window.seek = t => { tl.seek(Math.max(0, Math.min(DUR, t)), false); render(t); };
window.DURATION = DUR; window.SFX = SFX.sort((a, b) => a.t - b.t); window.CONFIG = CFG; window.READY = true;
const q = new URLSearchParams(location.search);
if (q.has('guides')) { const st = $('stage'); [['0', '0', '1080px', '230px'], ['0', '1520px', '1080px', '400px'], ['940px', '0', '140px', '1920px']].forEach(([l, tp, w, h]) => { const d = document.createElement('div'); d.className = 'guide'; Object.assign(d.style, { left: l, top: tp, width: w, height: h }); st.appendChild(d); }); }
if (q.has('t')) window.seek(parseFloat(q.get('t')));

})();
